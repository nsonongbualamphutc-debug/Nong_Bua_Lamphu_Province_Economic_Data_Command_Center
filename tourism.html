<body>
<div id="tip"></div>
<div class="app" id="app">
  <header class="top" id="topbar"></header>
  <nav class="side" id="sidebar"></nav>
  <main class="main">
    <section class="view on" id="v-tourism"></section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data1.js"></script>
<script src="data2.js"></script>
<script src="ds.js"></script>
<script>
const T=DX.tour;
const YRS=[...new Set(T.internal.map(x=>x.y))].sort((a,b)=>a-b);
let TY=YRS[YRS.length-1];
const KINDS=['ผู้เยี่ยมเยือน','นักท่องเที่ยว','นักทัศนาจร'];
const val=(y,kind,who)=>{const r=T.internal.find(x=>x.y===y&&x.kind===kind&&x.who===who);return r?r.v:0};
const tot=(y,kind)=>val(y,kind,'ชาวไทย')+val(y,kind,'ชาวต่างชาติ');
const spend=(y,who,kind)=>{const r=T.spend.find(x=>x.y===y&&x.who===who&&x.kind===kind);return r?r.v:null};
const occOf=y=>{const r=T.occYear.find(x=>x.y===y);return r?r.v:null};

function renderTour(){
  const prev=TY-1;
  const v=tot(TY,'ผู้เยี่ยมเยือน'), vPrev=tot(prev,'ผู้เยี่ยมเยือน');
  const th=val(TY,'ผู้เยี่ยมเยือน','ชาวไทย'), fo=val(TY,'ผู้เยี่ยมเยือน','ชาวต่างชาติ');
  const M=T.visitor.filter(x=>x.fy===2569), R=T.revenue.filter(x=>x.fy===2569), OC=T.occ.filter(x=>x.fy===2569);
  const spotTot=Object.values(T.spotByType).reduce((a,b)=>a+b,0);

  document.getElementById('v-tourism').innerHTML=`
  <div class="ph"><div class="t" style="display:flex;gap:14px;align-items:flex-start">
    <span class="bigico icow img" data-bigico="tourism"></span>
    <span><h2>ภาคการท่องเที่ยว</h2>
    <p>รายได้จากการท่องเที่ยวคือเงินใหม่ที่ไหลเข้าจังหวัดจากภายนอก ต่างจากการค้าภายในที่เป็นการหมุนเงินก้อนเดิม</p></span></div>
    <div class="r"><span class="chip real">ข้อมูลจริง</span>
      <select class="sel" id="tYear">${YRS.slice().reverse().map(y=>`<option value="${y}"${y===TY?' selected':''}>ปี ${y}</option>`).join('')}</select></div></div>

  <div id="tPlayer"></div>
  <div class="grid g3 mb" id="tBig"></div>

  <div class="grid g21 mb">
    <div class="c"><header><h3>แนวโน้มผู้เยี่ยมเยือน</h3><span class="u">คน · ${YRS[0]}–${YRS[YRS.length-1]}</span>
      <span class="r">${viewToggle('cTrend')}</span></header>
      <div class="b">
        <div id="cTrend-chart"><div class="ch lg"><canvas id="cTrend"></canvas></div></div>
        <div id="cTrend-table" class="hide"><div class="sc" style="max-height:330px"><table class="t" id="tTrend"></table></div></div>
        <div class="note" id="trendNote"></div>
      </div></div>
    <div class="c"><header><h3>สัดส่วนชาวไทยและชาวต่างชาติ</h3><span class="u">ปี ${TY}</span></header>
      <div class="b"><div class="ch"><canvas id="cMix"></canvas></div>
        <div id="spendBox" style="margin-top:10px"></div></div></div>
  </div>

  <div class="grid g2 mb">
    <div class="c"><header><h3>ค่าใช้จ่ายเฉลี่ยต่อคนต่อวัน</h3><span class="u">บาท</span></header>
      <div class="b"><div class="ch"><canvas id="cSpend"></canvas></div>

  const revYear=rSum/1e6;
  document.getElementById('gapBox2').innerHTML=[
    ['ห้องพักที่ว่างเฉลี่ยต่อคืน',f(T.accRooms*(1-oNow.v/100),0),'ห้อง',cv('--coral'),
     'อัตราเข้าพัก '+oNow.v.toFixed(1)+'% แปลว่าห้องว่างมากกว่าครึ่ง',
     tipOf({t:'ห้องพักที่ว่างเฉลี่ยต่อคืน',
       d:'กำลังรองรับที่มีอยู่แล้วและพร้อมใช้ทันทีโดยไม่ต้องลงทุนเพิ่ม ถ้าดึงคนให้ค้างคืนได้มากขึ้น รายได้เพิ่มโดยต้นทุนแทบไม่เปลี่ยน',
       calc:'ห้องพักทั้งจังหวัด × (100 − อัตราการเข้าพัก) ÷ 100 = '+f_num(T.accRooms)+' × (100 − '+oNow.v.toFixed(2)+') ÷ 100',
       src:'tour',when:'ปี '+oNow.y})],
    ['สัดส่วนชาวต่างชาติ',(fo/v*100).toFixed(2),'%',cv('--gold'),
     'ต่ำมาก ทั้งที่ใช้จ่ายสูงกว่าคนไทย '+((sFo/sTh-1)*100).toFixed(0)+'%',
     tipOf({t:'สัดส่วนผู้เยี่ยมเยือนชาวต่างชาติ',
       d:'ชาวต่างชาติใช้จ่ายต่อคนต่อวันสูงกว่าคนไทย การเพิ่มสัดส่วนนี้จึงเพิ่มรายได้ได้เร็วกว่าการเพิ่มจำนวนคนรวม',
       calc:'(ผู้เยี่ยมเยือนชาวต่างชาติ ÷ ผู้เยี่ยมเยือนทั้งหมด) × 100 = ('+f_num(fo)+' ÷ '+f_num(v)+') × 100 · ค่าใช้จ่ายชาวต่างชาติ '+f_num(sFo)+' เทียบชาวไทย '+f_num(sTh)+' บาท/คน/วัน',
       src:'tour',when:'ปี '+TY})],
    ['นักทัศนาจรที่ไม่ค้างคืน',f(tot(TY,'นักทัศนาจร'),0),'คน',cv('--blue'),
     'คิดเป็น '+(tot(TY,'นักทัศนาจร')/v*100).toFixed(0)+'% ของผู้เยี่ยมเยือน หากเปลี่ยนเป็นค้างคืนได้แม้ 10% จะเพิ่มรายได้มหาศาล',
     tipOf({t:'นักทัศนาจรที่ไม่พักค้างคืน',
       d:'กลุ่มที่มาเที่ยวแล้วกลับในวันเดียว จังหวัดจึงไม่ได้รายได้ค่าที่พักและมื้อเย็น เป็นกลุ่มที่แปลงเป็นรายได้เพิ่มได้ง่ายที่สุด',
       calc:'(นักทัศนาจร ÷ ผู้เยี่ยมเยือนทั้งหมด) × 100 = ('+f_num(tot(TY,'นักทัศนาจร'))+' ÷ '+f_num(v)+') × 100',
       src:'tour',when:'ปี '+TY})],
    ['แหล่งท่องเที่ยวเชิงเกษตร',T.spotByType['แหล่งท่องเที่ยวเชิงเกษตร']||0,'แห่ง',cv('--leaf'),
     'เชื่อมกับแปลงใหญ่ 73 แปลงและร้าน OTOP 1,000 แห่งได้ทันที',
     tipOf({t:'แหล่งท่องเที่ยวเชิงเกษตร',
       d:'จุดเชื่อมระหว่างภาคเกษตรกับภาคท่องเที่ยว ทำให้เงินจากนักท่องเที่ยวตกถึงเกษตรกรโดยตรงไม่ผ่านคนกลาง',
       calc:'นับแหล่งท่องเที่ยวที่จำแนกประเภทเป็นเชิงเกษตร จากแหล่งท่องเที่ยวทั้งหมด '+T.spots.length+' แห่งในฐานข้อมูลจังหวัด',
       src:'tour',when:'ปี '+T.spotYear})]
  ].map(r=>`<div class="mini" data-tip2="${r[5]}" style="margin-bottom:10px">
      <div class="l">${r[0]}</div>
      <div class="v" style="color:${r[3]}">${r[1]}<small> ${r[2]}</small></div>
      <div style="font-size:11px;color:var(--faint);line-height:1.6;margin-top:4px">${r[4]}</div></div>`).join('');

  drawSpotMap();
}

let TMAP=null, TMARK=[], SPOT_FILTER={q:'',amp:''}, ME=null, MEMARK=null, TBASE={layer:null};
function spotsFiltered(){
  const q=SPOT_FILTER.q.trim();
  let list=T.spots.filter(s=>
    (!SPOT_FILTER.amp||s.a===SPOT_FILTER.amp) &&
    (!q||s.n.includes(q)||s.ta.includes(q)||s.a.includes(q)));
  if(ME){
    list=list.map(s=>Object.assign({},s,{km:distKm(ME.lat,ME.lng,s.lat,s.lng)}))
             .sort((a,b)=>a.km-b.km);
  }
  return list;
}
function drawSpotMap(){
  if(typeof L==='undefined')return;
  const el=document.getElementById('tmap'); if(!el)return;
  if(TMAP){TMAP.remove();TMAP=null;TMARK=[]}
  TMAP=L.map('tmap',{zoomControl:false,attributionControl:false,scrollWheelZoom:false,zoomSnap:.25});
  L.control.zoom({position:'topright'}).addTo(TMAP);
  bindBase('tbase',TMAP,TBASE);
  fetch('assets/nbl-amphoe.geojson').then(r=>r.json()).then(j=>{
    const g=L.geoJSON(j,{style:{color:'#fff',weight:2,fillColor:'#cfe9dc',fillOpacity:.85},
      onEachFeature:(f,l)=>{const nm=f.properties.amp_th;
        l.bindTooltip('อ.'+nm,{direction:'center',className:'amplbl'})}}).addTo(TMAP);
    try{TMAP.fitBounds(g.getBounds(),{padding:[20,20]})}catch(e){}
    addSpots();
  }).catch(()=>{TMAP.setView([17.22,102.36],9.3);addSpots()});
}
function addSpots(){
  TMARK.forEach(m=>TMAP.removeLayer(m)); TMARK=[];
  const list=spotsFiltered();
  list.forEach((s,i)=>{
    const m=L.circleMarker([s.lat,s.lng],{radius:8,color:'#fff',weight:2,
      fillColor:cv('--brand'),fillOpacity:.95}).addTo(TMAP);
    m.bindPopup(servicePopup({
      name:s.n, sub:'ต.'+s.ta+' · อ.'+s.a,
      rows:[['อำเภอ','อ.'+s.a],['ตำบล','ต.'+s.ta]],
      km:s.km, lat:s.lat,lng:s.lng,nearby:'ที่พักและร้านอาหาร'
    }),{maxWidth:310});
    m.on('click',()=>highlight(i));
    TMARK.push(m);
  });
  if(list.length){
    try{TMAP.fitBounds(L.featureGroup(TMARK).getBounds(),{padding:[34,34],maxZoom:12})}catch(e){}
  }
  renderSpotList(list);
}
function renderSpotList(list){
  const el=document.getElementById('spotList');
  if(!list.length){el.innerHTML='<div class="svc-empty">ไม่พบแหล่งท่องเที่ยวที่ตรงกับตัวกรอง</div>';return}
  el.innerHTML=(ME?`<div style="padding:9px 13px;font-size:11.5px;color:var(--brand);background:var(--brand-l);
      border-bottom:1px solid var(--line)">เรียงตามระยะทางจากตำแหน่งของท่าน</div>`:'')+
    list.map((s,i)=>`<button class="svc-item" data-spot="${i}">
      <span class="no">${i+1}</span>
      <span style="flex:1"><b>${s.n}</b><span>ต.${s.ta} · อ.${s.a}</span></span>
      ${s.km!=null?`<span class="km">${s.km.toFixed(1)} กม.<br><span style="font-weight:400;color:var(--faint)">~${driveMin(s.km)} นาที</span></span>`:''}
    </button>`).join('');
}
function highlight(i){
  document.querySelectorAll('.svc-item').forEach((el,j)=>el.classList.toggle('on',j===i));
  const it=document.querySelector(`[data-spot="${i}"]`);
  if(it)it.scrollIntoView({block:'nearest'});
}
function focusSpot(i){
  const s=spotsFiltered()[i]; if(!s||!TMAP)return;
  TMAP.setView([s.lat,s.lng],13,{animate:true});
  if(TMARK[i])TMARK[i].openPopup();
  highlight(i);
}
function wireSpotTools(){
  const q=document.getElementById('spotQ'), sel=document.getElementById('spotAmpSel');
  if(sel&&!sel.options.length){
    const amps=[...new Set(T.spots.map(s=>s.a))].filter(Boolean).sort();
    sel.innerHTML='<option value="">ทุกอำเภอ</option>'+amps.map(a=>`<option value="${a}">อ.${a}</option>`).join('');
  }
  if(q&&!q.dataset.b){q.dataset.b='1';
    q.addEventListener('input',()=>{SPOT_FILTER.q=q.value;addSpots()})}
  if(sel&&!sel.dataset.b){sel.dataset.b='1';
    sel.addEventListener('change',()=>{SPOT_FILTER.amp=sel.value;addSpots()})}
  const nr=document.getElementById('spotNear');
  if(nr&&!nr.dataset.b){nr.dataset.b='1';
    nr.onclick=async()=>{
      nr.disabled=true;const old=nr.innerHTML;nr.textContent='กำลังหาตำแหน่ง…';
      try{
        ME=await askLocation();
        if(MEMARK)TMAP.removeLayer(MEMARK);
        MEMARK=L.circleMarker([ME.lat,ME.lng],{radius:9,className:'mebadge',color:'#fff',weight:3,
          fillColor:cv('--blue'),fillOpacity:1}).addTo(TMAP)
          .bindPopup('<div class="pop"><div class="ph2"><b>ตำแหน่งของท่าน</b><span>คลาดเคลื่อนราว '+Math.round(ME.acc)+' เมตร</span></div></div>');
        addSpots();
        nr.classList.add('on');
      }catch(e){alert(e.message)}
      finally{nr.disabled=false;nr.innerHTML=old}
    }}
  const rs=document.getElementById('spotReset');
  if(rs&&!rs.dataset.b){rs.dataset.b='1';
    rs.onclick=()=>{SPOT_FILTER={q:'',amp:''};ME=null;
      if(MEMARK&&TMAP){TMAP.removeLayer(MEMARK);MEMARK=null}
      const n=document.getElementById('spotNear');if(n)n.classList.remove('on');
      if(q)q.value='';if(sel)sel.value='';addSpots()}}
  const lst=document.getElementById('spotList');
  if(lst&&!lst.dataset.b){lst.dataset.b='1';
    lst.addEventListener('click',e=>{const b=e.target.closest('[data-spot]');if(b)focusSpot(+b.dataset.spot)})}
}

DS.init('tourism',function(){
  renderTour();
  wireSpotTools();
  const sel=document.getElementById('tYear');
  if(sel)sel.onchange=function(){TY=+sel.value;renderTour();wireSpotTools();};
});
</script>
