<body>
<div id="tip"></div>
<div class="app" id="app">
  <header class="top" id="topbar"></header>
  <nav class="side" id="sidebar"></nav>

    <section class="view on" id="v-labor"></section>

<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="data1.js"></script>
<script src="data2.js"></script>
<script src="ds.js"></script>
<script>
const QL=q=>'ไตรมาส '+q.n+'/'+q.y;
const LB={freq:'Q',key:null};
const LYEARS=()=>[...new Set(D.labor.quarters.map(q=>q.y))].sort((a,b)=>a-b);
function lbPeriods(){
  const Q=D.labor.quarters;
  if(LB.freq==='Q')return Q.map(q=>({k:q.q,label:QL(q),qs:[q]}));
  return LYEARS().map(y=>({k:'Y'+y,label:'ปี '+y,qs:Q.filter(q=>q.y===y)}));
}
function lbCur(){
  const ps=lbPeriods();
  if(!LB.key||!ps.find(p=>p.k===LB.key))LB.key=ps[ps.length-1].k;
  return ps.find(p=>p.k===LB.key);
}
function lbPrev(cur){
  const Q=D.labor.quarters;
  if(LB.freq==='Q'){
    const c=cur.qs[0], py=Q.find(q=>q.y===c.y-1&&q.n===c.n);
    return py?{label:QL(py),qs:[py]}:null;
  }
  const y=+cur.k.slice(1), qs=Q.filter(q=>q.y===y-1);
  return qs.length?{label:'ปี '+(y-1),qs}:null;
}
/* ค่าของงวด — จำนวนคนเป็นค่าสต๊อก จึงใช้ค่าเฉลี่ยของไตรมาสในปีนั้น */
function lbVal(p,key){
  if(!p||!p.qs.length)return null;
  const v=p.qs.map(q=>q[key]).filter(x=>x!=null);
  if(!v.length)return null;
  return LB.freq==='Q'?v[0]:v.reduce((a,b)=>a+b,0)/v.length;
}
function lbBar(){
  const ps=lbPeriods(), cur=lbCur(), ci=ps.indexOf(cur);
  return `<div class="slicer" id="lbSlicer">
    <span class="sl-lab"><img class="slico" src="assets/icons/ic-filter.png" alt="" onerror="this.remove()">เลือกงวดข้อมูล</span>
    <span class="sl-seg">
      <button data-lfq="Q" class="${LB.freq==='Q'?'on':''}">รายไตรมาส</button>
      <button data-lfq="Y" class="${LB.freq==='Y'?'on':''}">รายปี</button></span>
    <span class="sl-nav">
      <button data-lstep="-1" ${ci<=0?'disabled':''}><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <select data-lpick>${ps.map(p=>`<option value="${p.k}"${p.k===cur.k?' selected':''}>${p.label}</option>`).join('')}</select>
      <button data-lstep="1" ${ci>=ps.length-1?'disabled':''}><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </span>
    <button class="sl-now${ci===ps.length-1?' on':''}" data-lnow>ล่าสุด</button>
    <span class="sl-info">${LB.freq==='Q'?'ข้อมูลรายไตรมาส 12 งวด ตั้งแต่ '+QL(D.labor.quarters[0]):
      'รายปีใช้ค่าเฉลี่ยของไตรมาสในปีนั้น เพราะเป็นค่าสต๊อก ไม่ใช่ยอดสะสม'}</span>
  </div>`;
}
function bindLb(){
  const el=document.getElementById('lbSlicer'); if(!el||el.dataset.b)return;
  el.dataset.b='1';
  el.addEventListener('click',e=>{
    const fq=e.target.closest('[data-lfq]'), st=e.target.closest('[data-lstep]'), nw=e.target.closest('[data-lnow]');
    if(fq){LB.freq=fq.dataset.lfq;LB.key=null}
    else if(st){const ps=lbPeriods(),i=ps.findIndex(p=>p.k===LB.key);const n=ps[i+ +st.dataset.lstep];if(!n)return;LB.key=n.k}
    else if(nw){const ps=lbPeriods();LB.key=ps[ps.length-1].k}
    else return;
    renderLabor();
  });
  el.addEventListener('change',e=>{if(e.target.matches('[data-lpick]')){LB.key=e.target.value;renderLabor()}});
}
const QS=q=>'Q'+q.n+'/'+String(q.y).slice(-2);
function yoyOf(arr,i,k){return i>=4?pctc(arr[i][k],arr[i-4][k]):null}

function renderLabor(){
  const L=D.labor, Q=L.quarters, first=Q[0];
  const cur=lbCur(), prevP=lbPrev(cur);
  const last=LB.freq==='Q'?cur.qs[0]:{ue:lbVal(cur,'ue'),ur:lbVal(cur,'ur'),emp:lbVal(cur,'emp'),
    force:lbVal(cur,'force'),pop15:lbVal(cur,'pop15'),notin:lbVal(cur,'notin'),lfpr:lbVal(cur,'lfpr'),
    y:+cur.k.slice(1),n:0};
  const yoy=prevP?(LB.freq==='Q'?prevP.qs[0]:{ue:lbVal(prevP,'ue'),ur:lbVal(prevP,'ur'),
    emp:lbVal(prevP,'emp'),force:lbVal(prevP,'force'),lfpr:lbVal(prevP,'lfpr')}):null;
  const curLabel=cur.label, prevLabel=prevP?prevP.label:'';
  const v=document.getElementById('v-labor');

  v.innerHTML=`
  <div class="ph"><div class="t" style="display:flex;gap:14px;align-items:flex-start">
    <span class="bigico icow img">${icoImg('labor',52)}</span><span><h2>ตลาดแรงงานจังหวัดหนองบัวลำภู</h2>
    <p>ข้อมูลจริงจากการสำรวจภาวะการทำงานของประชากร รายไตรมาส ย้อนหลัง 3 ปี พร้อมโครงสร้างการจ้างงานและสัญญาณที่ซ่อนอยู่หลังตัวเลขว่างงาน</p></span></div>
    <div class="r"><span class="chip real">ข้อมูลจริง</span><span class="chip br">${L.latest}</span></div></div>

  ${lbBar()}
  <div class="grid g4 mb" id="lbKpi"></div>

  <div class="grid g21 mb">
    <div class="c"><header><span class="hdico icow img" data-hdico="unemployed"></span><h3>จำนวนผู้ว่างงานและอัตราการว่างงาน</h3><span class="u">12 ไตรมาสย้อนหลัง</span>
      <span class="r">${viewToggle('cUe')}</span></header>
      <div class="b">
        <div id="cUe-chart"><div class="ch lg"><canvas id="cUe"></canvas></div></div>
        <div id="cUe-table" class="hide"><div class="sc" style="max-height:340px"><table class="t" data-owner="labor" id="tUe"></table></div></div>
        <div class="note">แท่งสีทองคืองวดที่เลือกอยู่ · แท่งสีส้มคือไตรมาสที่ 1 ของแต่ละปีซึ่งเป็นช่วงหลังฤดูเก็บเกี่ยว<br>${L.note}</div>
      </div></div>
    <div class="c"><header><span class="hdico icow img" data-hdico="unemprate"></span><h3>อัตราการว่างงานรายปี</h3><span class="u">ร้อยละ</span></header>
      <div class="b"><div class="ch lg"><canvas id="cAnn"></canvas></div>
        <div class="note" id="annNote"></div></div></div>
  </div>

  <div class="c mb" style="border-left:4px solid var(--coral)">
    <header><span class="hdico icow img" data-hdico="alert"></span><h3>สัญญาณที่ต้องจับตา — คนหายจากกำลังแรงงาน</h3>
      <span class="u">เรื่องนี้สำคัญกว่าตัวเลขว่างงาน</span></header>
    <div class="b">
      <div class="grid g21">
        <div><div class="ch"><canvas id="cForce"></canvas></div></div>
        <div id="forceBox"></div>
      </div>
      <div class="note" id="forceNote"></div>
    </div></div>

  <div class="grid g2 mb">
    <div class="c"><header><span class="hdico icow img" data-hdico="employed"></span><h3>ผู้มีงานทำแยกสาขาเศรษฐกิจ</h3><span class="u">${L.secQ.replace('-Q','  ไตรมาส ')}</span>
      <span class="r">${viewToggle('cSec')}</span></header>
      <div class="b">
        <div id="cSec-chart"><div class="ch lg"><canvas id="cSec"></canvas></div></div>
        <div id="cSec-table" class="hide"><div class="sc" style="max-height:330px"><table class="t" id="tSec"></table></div></div>
        <div class="note" id="secNote"></div>
      </div></div>
    <div class="c"><header><span class="hdico icow img" data-hdico="labor"></span><h3>สถานภาพการทำงาน</h3><span class="u">${L.statusQ.replace('-Q','  ไตรมาส ')}</span></header>
      <div class="b"><div id="stBox"></div>
        <div class="ch sm" style="height:160px"><canvas id="cStatus"></canvas></div>
        <div class="note" id="stNote"></div></div></div>
  </div>

  <div class="grid g21 mb">
    <div class="c"><header><span class="hdico icow img" data-hdico="underemp"></span><h3>การทำงานต่ำกว่าระดับด้านชั่วโมงการทำงาน</h3>
      <span class="u">ผู้ที่ทำงานน้อยกว่า 35 ชั่วโมงต่อสัปดาห์และต้องการทำงานเพิ่ม</span>
      <span class="r"><span class="icow img" style="width:26px;height:26px;display:inline-grid;place-items:center">${icoImg('underemp',26)}</span></span></header>
      <div class="b"><div class="ch"><canvas id="cUnder"></canvas></div>
        <div class="note" id="underNote"></div></div></div>
    <div class="c"><header><span class="hdico icow img" data-hdico="social"></span><h3>ผู้ประกันตนในระบบประกันสังคม</h3><span class="u" id="ssoU">รายปี · ราย</span></header>
      <div class="b"><div class="ch"><canvas id="cSso"></canvas></div>
        <div class="note" id="ssoNote"></div></div></div></div>
  </div>

  <div class="c"><header><span class="hdico icow img">${icoImg('source',26)}</span><h3>แหล่งข้อมูลและหน่วยงานผู้รับผิดชอบ</h3></header>
    <div class="b">${srcBar(['labor','social'],
      'ชุดข้อมูลจริงเผยแพร่ที่บัญชีข้อมูลจังหวัดหนองบัวลำภู (nongbualamphu.gdcatalog.go.th) · ' +
      'ประกอบด้วย สถานภาพแรงงานรายไตรมาส · จำนวนและอัตราการว่างงาน · การมีงานทำจำแนกตามอุตสาหกรรมและสถานภาพการทำงาน · การทำงานต่ำกว่าระดับด้านชั่วโมงการทำงาน')}</div></div>`;

  /* ── KPI ── */
  /* ผู้ว่างงานบางไตรมาสเป็น n.a. ในระบบบัญชีข้อมูล → ไม่เทียบ และแสดงเป็น n.a. */
  const ueNA=last.ue==null, cmpUE=yoy&&!ueNA&&yoy.ue!=null&&last.ur!=null&&yoy.ur!=null;
  const ueY=cmpUE?pctc(last.ue,yoy.ue):null;
  const aggNote=LB.freq==='Y'?'ค่าเฉลี่ยของไตรมาสในปีนั้น':'ค่าที่สำรวจได้ในไตรมาสนั้น';
  const SRC='labor';
  document.getElementById('lbKpi').innerHTML=[
    kpiCard({icon:'people',img:'unemployed',color:cv('--coral'),label:'จำนวนผู้ว่างงาน',value:ueNA?'n.a.':f(last.ue,0),unit:ueNA?'':'คน',
      /* ฐานปีก่อนเล็กมาก (เช่น 64 คน) ร้อยละจะพุ่งหลายพัน% จนอ่านผิด → แสดงเป็นจำนวนคนที่เปลี่ยน และตัดสถานะจากอัตราว่างงานแทน */
      chip:(ueY==null?'<span class="chip">—</span>'
          :(cmpUE&&yoy.ue<500)?`<span class="chip ${last.ue>=yoy.ue?'dn':'up'}">${last.ue>=yoy.ue?'+':'−'}${f(Math.abs(last.ue-yoy.ue),0)} คน</span>`
          :chip(ueY))+' '+
        ((cmpUE&&yoy.ue<500)
          ?statusBadge((last.ur-yoy.ur)*10,true,'อัตราการว่างงานเปลี่ยน '+(last.ur-yoy.ur>=0?'+':'')+(last.ur-yoy.ur).toFixed(2)+' จุด (ใช้แทนร้อยละเพราะฐานปีก่อนมีผู้ว่างงานน้อยมาก)')
          :statusBadge(ueY,true,'จำนวนผู้ว่างงานเทียบงวดเดียวกันปีก่อน')),
      sub:ueNA?'ไตรมาสนี้ไม่มีค่าประมาณ (n.a.) ในระบบบัญชีข้อมูล':yoy?('เทียบ '+prevLabel+' · '+(yoy.ue==null?'n.a.':f(yoy.ue,0)+' คน')):'ไม่มีงวดปีก่อนให้เทียบ',
      tip:tipOf({t:'จำนวนผู้ว่างงาน',
        d:'ผู้ที่ไม่ได้ทำงานเลยแม้แต่ชั่วโมงเดียวในสัปดาห์สำรวจ พร้อมทำงาน และกำลังหางาน · '+aggNote,
        calc:'นับจากกลุ่มตัวอย่างครัวเรือนแล้วถ่วงน้ำหนักขึ้นเป็นระดับจังหวัด'+(LB.freq==='Y'?' จากนั้นเฉลี่ยไตรมาสในปีนั้น':''),
        src:SRC,when:curLabel})}),
    kpiCard({icon:'chart',img:'unemprate',color:cv('--gold'),label:'อัตราการว่างงาน',value:last.ur==null?'n.a.':last.ur.toFixed(2),unit:last.ur==null?'':'%',
      chip:'<span class="chip fl">'+(cmpUE?((last.ur-yoy.ur>0?'+':'')+(last.ur-yoy.ur).toFixed(2)+' จุด'):'—')+'</span>'
        +' '+statusBadge(cmpUE?-(last.ur-yoy.ur)*10:null,false,'อัตราการว่างงานเทียบงวดเดียวกันปีก่อน'),
      sub:'จากกำลังแรงงาน '+f(last.force,0)+' คน',
      tip:tipOf({t:'อัตราการว่างงาน',
        d:'สัดส่วนผู้ว่างงานต่อกำลังแรงงานรวม · ไตรมาส 1 ของทุกปีมักสูงกว่าไตรมาสอื่น เพราะเป็นช่วงหลังฤดูเก็บเกี่ยว แรงงานเกษตรว่างงานตามฤดูกาล',
        calc:'(จำนวนผู้ว่างงาน ÷ กำลังแรงงานรวม) × 100 = ('+f(last.ue,0)+' ÷ '+f(last.force,0)+') × 100',
        src:SRC,when:curLabel})}),
    kpiCard({icon:'brief',img:'employed',color:cv('--brand'),label:'ผู้มีงานทำ',value:f(last.emp,0),unit:'คน',
      chip:(yoy?chip(pctc(last.emp,yoy.emp)):'<span class="chip">—</span>')+' '+statusBadge(yoy?pctc(last.emp,yoy.emp):null,false,'ผู้มีงานทำเทียบงวดเดียวกันปีก่อน'),
      sub:'จากประชากรอายุ 15 ปีขึ้นไป '+f(last.pop15,0)+' คน',
      tip:tipOf({t:'ผู้มีงานทำ',
        d:'ผู้ที่ทำงานตั้งแต่ 1 ชั่วโมงขึ้นไปในสัปดาห์สำรวจ หรือมีงานประจำแต่ไม่ได้ทำงานในสัปดาห์นั้น เป็นฐานกำลังซื้อที่แท้จริงของจังหวัด · '+aggNote,
        calc:'กำลังแรงงานรวม − ผู้ว่างงาน = '+f(last.force,0)+' − '+f(last.ue,0),
        src:SRC,when:curLabel})}),
    kpiCard({icon:'coin',img:'lfpr',color:cv('--plum'),label:'อัตราการมีส่วนร่วมกำลังแรงงาน',value:last.lfpr.toFixed(1),unit:'%',
      chip:'<span class="chip '+(last.lfpr<first.lfpr?'dn':'up')+'">'+(last.lfpr-first.lfpr>0?'+':'')+(last.lfpr-first.lfpr).toFixed(1)+' จุด จาก '+QS(first)+'</span>',
      sub:'ผู้ไม่อยู่ในกำลังแรงงาน '+f(last.notin,0)+' คน',
      tip:tipOf({t:'อัตราการมีส่วนร่วมกำลังแรงงาน',
        d:'สัดส่วนคนที่อยู่ในกำลังแรงงานต่อประชากรอายุ 15 ปีขึ้นไป · ตัวเลขนี้ลดลงหมายถึงคนถอนตัวออกจากตลาดแรงงานไปเลย ซึ่งไม่ถูกนับเป็นผู้ว่างงาน จึงต้องอ่านคู่กับอัตราการว่างงานเสมอ',
        calc:'(กำลังแรงงานรวม ÷ ประชากรอายุ 15 ปีขึ้นไป) × 100 = ('+f(last.force,0)+' ÷ '+f(last.pop15,0)+') × 100',
        src:SRC,when:curLabel})})
  ].join('');
  bindLb();

  /* ── กราฟหลัก ── */
  mk('cUe',{data:{labels:Q.map(QS),datasets:[
    {type:'bar',label:'จำนวนผู้ว่างงาน (คน)',data:Q.map(x=>x.ue),
      backgroundColor:Q.map(x=>(cur.qs.some(c=>c.q===x.q))?cv('--gold'):(x.n===1?cv('--coral'):cv('--brand')+'99')),
      borderRadius:6,barPercentage:.68,yAxisID:'y',order:2},
    {type:'line',label:'อัตราการว่างงาน (%)',data:Q.map(x=>x.ur),borderColor:cv('--gold'),borderWidth:2.6,
      pointRadius:4,pointBackgroundColor:cv('--gold'),pointBorderColor:'#fff',pointBorderWidth:1.6,tension:.28,yAxisID:'y2',order:1}]},
    options:{interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom',labels:{padding:12}},
        tooltip:{callbacks:{
          title:it=>QL(Q[it[0].dataIndex]),
          footer:it=>{const i=it[0].dataIndex;const p=yoyOf(Q,i,'ue');
            const base='กำลังแรงงาน '+f(Q[i].force,0)+' คน · ผู้มีงานทำ '+f(Q[i].emp,0)+' คน';
            return p==null?base:base+' · '+(p>0?'ผู้ว่างงานเพิ่มขึ้น ':'ผู้ว่างงานลดลง ')+Math.abs(p).toFixed(0)+'% เทียบไตรมาสเดียวกันปีก่อน'}}}},
      scales:{x:ax({grid:{display:false}}),
        y:ax({title:{display:true,text:'คน',color:cv('--faint'),font:{size:10}},ticks:{callback:v=>f(v,0)}}),
        y2:{position:'right',grid:{display:false},border:{display:false},
          title:{display:true,text:'%',color:cv('--faint'),font:{size:10}},ticks:{callback:v=>v.toFixed(1)}}}}});

  document.getElementById('tUe').innerHTML=`<thead><tr><th>ไตรมาส</th><th class="r">ประชากร 15+</th>
    <th class="r">กำลังแรงงาน</th><th class="r">ผู้มีงานทำ</th><th class="r">ผู้ว่างงาน</th>
    <th class="r">อัตราว่างงาน</th><th class="r">มีส่วนร่วม</th></tr></thead><tbody>`+
    Q.map((x,i)=>`<tr><td>${QL(x)}</td>${ec('labor.quarters.'+i+'.pop15',f(x.pop15,0),0)}
      ${ec('labor.quarters.'+i+'.force',f(x.force,0),0)}${ec('labor.quarters.'+i+'.emp',f(x.emp,0),0)}
      ${ec('labor.quarters.'+i+'.ue',x.ue==null?'n.a.':f(x.ue,0),0)}${ec('labor.quarters.'+i+'.ur',x.ur==null?'n.a.':x.ur.toFixed(2),2)}
      <td class="r">${x.lfpr.toFixed(1)}%</td></tr>`).join('')+'</tbody>';

  /* ── รายปี ── */
  const A=L.annual;
  mk('cAnn',{type:'bar',data:{labels:A.map(r=>'ปี '+r[0]),
    datasets:[{data:A.map(r=>r[1]),backgroundColor:A.map(r=>r[1]>=1.5?cv('--coral'):r[1]>0?cv('--brand'):cv('--line')),
      borderRadius:7,barPercentage:.6}]},
    options:{plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c=>'อัตราการว่างงาน '+c.raw.toFixed(1)+'%',
        footer:it=>it[0].raw===0?'การสำรวจไม่พบผู้ว่างงานในกลุ่มตัวอย่าง':''}}},
      scales:{x:ax({grid:{display:false}}),y:ax({ticks:{callback:v=>v+'%'}})}}});
  const mxA=A.reduce((a,b)=>b[1]>a[1]?b:a);
  document.getElementById('annNote').innerHTML=
    `ปีที่อัตราการว่างงานสูงสุดคือ <b>ปี ${mxA[0]}</b> ที่ ${mxA[1].toFixed(1)}%`+
    (A.filter(r=>r[2]!=null&&r[2]<4).map(r=>` · ปี ${r[0]} มีค่าประมาณผู้ว่างงานเพียง ${r[2]} ไตรมาส (ไตรมาสอื่นเป็น n.a.) จึงเฉลี่ยจากไตรมาสที่มีค่า`).join(''))+
    ` ตัวเลขนี้จึงต้องอ่านคู่กับอัตราการมีส่วนร่วมกำลังแรงงานเสมอ`;

  /* ── คนหายจากกำลังแรงงาน ── */
  mk('cForce',{data:{labels:Q.map(QS),datasets:[
    {type:'bar',label:'กำลังแรงงาน (คน)',data:Q.map(x=>x.force),backgroundColor:cv('--brand')+'d9',borderRadius:5,stack:'s',yAxisID:'y'},
    {type:'bar',label:'ผู้ไม่อยู่ในกำลังแรงงาน (คน)',data:Q.map(x=>x.notin),backgroundColor:cv('--coral')+'b3',borderRadius:5,stack:'s',yAxisID:'y'},
    {type:'line',label:'อัตราการมีส่วนร่วม (%)',data:Q.map(x=>x.lfpr),borderColor:cv('--gold'),borderWidth:2.4,
      pointRadius:3,tension:.28,yAxisID:'y2'}]},
    options:{interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom',labels:{padding:11,font:{size:10}}},
        tooltip:{callbacks:{title:it=>QL(Q[it[0].dataIndex])}}},
      scales:{x:ax({grid:{display:false},stacked:true}),
        y:ax({stacked:true,ticks:{callback:v=>f(v,0)}}),
        y2:{position:'right',grid:{display:false},border:{display:false},ticks:{callback:v=>v.toFixed(0)+'%',font:{size:9.5}}}}}});
  const dForce=last.force-first.force, dNot=last.notin-first.notin;
  document.getElementById('forceBox').innerHTML=[
    ['กำลังแรงงาน '+QS(first),f(first.force,0),'คน',cv('--dim')],
    ['กำลังแรงงาน '+QS(last),f(last.force,0),'คน',cv('--ink')],
    ['เปลี่ยนแปลง',(dForce>0?'+':'')+f(dForce,0),'คน',dForce<0?cv('--bad'):cv('--good')],
    ['ผู้ไม่อยู่ในกำลังแรงงานเพิ่มขึ้น','+'+f(dNot,0),'คน',cv('--bad')]
  ].map(r=>`<div class="mini" style="margin-bottom:9px">
      <div class="l">${r[0]}</div>
      <div class="v" style="color:${r[3]}">${r[1]}<small> ${r[2]}</small></div></div>`).join('');
  document.getElementById('forceNote').innerHTML=
    `ระหว่าง ${QL(first)} ถึง ${QL(last)} กำลังแรงงานของจังหวัด${dForce<0?'ลดลง':'เพิ่มขึ้น'} <b>${f(Math.abs(dForce),0)} คน</b>
     ขณะที่ผู้ไม่อยู่ในกำลังแรงงานเพิ่มขึ้น <b>${f(dNot,0)} คน</b>
     คนกลุ่มนี้ไม่ถูกนับเป็นผู้ว่างงาน เพราะเลิกหางานไปแล้ว อัตราการว่างงานจึงดูต่ำทั้งที่คนทำงานลดลงจริง
     นี่คือเหตุผลที่ต้องอ่านอัตราการมีส่วนร่วมกำลังแรงงานควบคู่เสมอ`;

  /* ── สาขาเศรษฐกิจ ── */
  const S=L.sectors, other=Math.max(0,L.secTotal-S.reduce((a,b)=>a+b[2],0));
  const sLab=S.map(r=>r[0].length>28?r[0].slice(0,27)+'…':r[0]).concat(other>0?['สาขาอื่น ๆ']:[]);
  const sVal=S.map(r=>r[2]).concat(other>0?[other]:[]);
  mk('cSec',{type:'doughnut',data:{labels:sLab,
    datasets:[{data:sVal,backgroundColor:PAL().concat(PAL()).slice(0,sVal.length),borderColor:cv('--card'),borderWidth:3}]},
    options:{cutout:'54%',plugins:{legend:{position:'bottom',labels:{padding:7,font:{size:9.5}}},
      tooltip:{callbacks:{label:c=>c.label+' '+f(c.raw,0)+' คน',
        footer:it=>'คิดเป็น '+(it[0].raw/L.secTotal*100).toFixed(1)+'% ของผู้มีงานทำ'}}}}});
  document.getElementById('tSec').innerHTML=`<thead><tr><th>สาขาเศรษฐกิจ</th><th class="r">คน</th><th class="r">สัดส่วน</th></tr></thead><tbody>`+
    S.map(r=>`<tr><td>${r[0]}</td><td class="r">${f(r[2],0)}</td><td class="r">${r[1].toFixed(1)}%</td></tr>`).join('')+
    `</tbody><tfoot><tr><td>ผู้มีงานทำทั้งหมด</td><td class="r">${f(L.secTotal,0)}</td><td class="r">100.0%</td></tr></tfoot>`;
  document.getElementById('secNote').innerHTML=
    `ภาคเกษตรกรรมจ้างงาน <b>${f(L.agri,0)} คน</b> (${(L.agri/L.secTotal*100).toFixed(1)}%)
     นอกภาคเกษตร <b>${f(L.nonagri,0)} คน</b> การจ้างงานจึงผูกกับฤดูกาลเพาะปลูกโดยตรง
     สาขาที่ใหญ่รองลงมาคือการค้าส่งค้าปลีก ซึ่งเป็นปลายทางของรายได้เกษตรกรอีกทอดหนึ่ง`;

  /* ── สถานภาพการทำงาน ── */
  const W=L.status, wTot=W.reduce((a,b)=>a+b[2],0);
  const informal=W.filter(r=>/ส่วนตัว|ครัวเรือน/.test(r[0])).reduce((a,b)=>a+b[1],0);
  document.getElementById('stBox').innerHTML=W.map((r,i)=>`<div class="barrow">
    <span class="nm">${r[0]}</span>
    <span class="tr"><i style="width:${(r[1]/W[0][1]*100).toFixed(0)}%;background:${PAL()[i%7]}"></i></span>
    <span class="vv">${r[1].toFixed(1)}%</span></div>`).join('');
  mk('cStatus',{type:'doughnut',data:{labels:['ทำงานส่วนตัวและช่วยธุรกิจครัวเรือน','ลูกจ้างเอกชนและรัฐบาล','นายจ้าง'],
    datasets:[{data:[
      W.filter(r=>/ส่วนตัว|ครัวเรือน/.test(r[0])).reduce((a,b)=>a+b[2],0),
      W.filter(r=>/ลูกจ้าง/.test(r[0])).reduce((a,b)=>a+b[2],0),
      W.filter(r=>/นายจ้าง/.test(r[0])).reduce((a,b)=>a+b[2],0)],
      backgroundColor:[cv('--coral'),cv('--brand'),cv('--gold')],borderColor:cv('--card'),borderWidth:3}]},
    options:{cutout:'62%',plugins:{legend:{position:'bottom',labels:{padding:9,font:{size:10}}},
      tooltip:{callbacks:{label:c=>c.label+' '+f(c.raw,0)+' คน',
        footer:it=>(it[0].raw/wTot*100).toFixed(1)+'% ของผู้มีงานทำ'}}}}});
  document.getElementById('stNote').innerHTML=
    `ผู้ทำงานส่วนตัวและช่วยธุรกิจครัวเรือนรวมกัน <b>${informal.toFixed(1)}%</b> ของผู้มีงานทำ
     คนกลุ่มนี้คือแรงงานนอกระบบโดยพฤตินัย ไม่มีเงินเดือนประจำ ไม่มีประกันสังคมจากนายจ้าง
     ขณะที่นายจ้างมีเพียง ${W.find(r=>/นายจ้าง/.test(r[0]))?W.find(r=>/นายจ้าง/.test(r[0]))[1].toFixed(1):'0'}%
     สะท้อนว่าจังหวัดยังขาดกิจการขนาดกลางที่จะดูดซับแรงงาน`;

  /* ── ทำงานต่ำกว่าระดับ ── */
  const U=L.under;
  mk('cUnder',{type:'bar',data:{labels:U.map(x=>'Q'+x.q.slice(-1)+'/'+x.q.slice(2,4)),
    datasets:[{label:'ผู้ทำงานต่ำกว่าระดับ (คน)',data:U.map(x=>x.v),
      backgroundColor:U.map(x=>x.v>30000?cv('--coral'):cv('--brand')),borderRadius:6,barPercentage:.7}]},
    options:{plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c=>f(c.raw,0)+' คน',
        footer:it=>'คิดเป็นราว '+(it[0].raw/last.emp*100).toFixed(0)+'% ของผู้มีงานทำปัจจุบัน'}}},
      scales:{x:ax({grid:{display:false},ticks:{font:{size:9.5}}}),y:ax({ticks:{callback:v=>f(v,0)}})}}});
  const uLast=U[U.length-1], uMax=U.reduce((a,b)=>b.v>a.v?b:a);
  document.getElementById('underNote').innerHTML=
    `ไตรมาสล่าสุดที่มีข้อมูลมีผู้ทำงานต่ำกว่าระดับ <b>${f(uLast.v,0)} คน</b>
     หรือราว ${(uLast.v/last.emp*100).toFixed(0)}% ของผู้มีงานทำ สูงกว่าจำนวนผู้ว่างงานหลายสิบเท่า
     นี่คือ “การว่างงานแฝง” ที่ตัวเลขอัตราการว่างงานมองไม่เห็น และเป็นกลุ่มเป้าหมายที่ตรงที่สุดของมาตรการเพิ่มรายได้`;

  /* ── ประกันสังคม (API: ผู้ประกันตนมาตรา 33 / 39 / 40 รายปี) ── */
  const SS=(L.sso||[]).slice(-8);
  if(!SS.length){document.getElementById('ssoNote').innerHTML='กำลังเชื่อมข้อมูลจากระบบบัญชีข้อมูลจังหวัด';}
  else{
    const ssY=SS.map(x=>'ปี '+x.y);
    mk('cSso',{data:{labels:ssY,datasets:[
      {type:'bar',label:'มาตรา 33 ลูกจ้างในระบบ',data:SS.map(x=>x.m33??null),backgroundColor:cv('--brand')+'d9',borderRadius:5,stack:'s'},
      {type:'bar',label:'มาตรา 39 ผู้ประกันตนต่อเนื่อง',data:SS.map(x=>x.m39??null),backgroundColor:cv('--gold')+'d9',borderRadius:5,stack:'s'},
      {type:'line',label:'มาตรา 40 แรงงานอิสระ',data:SS.map(x=>x.m40??null),borderColor:cv('--plum'),backgroundColor:cv('--plum'),borderWidth:2.4,pointRadius:3.5,tension:.3,yAxisID:'y2'}]},
      options:{interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{padding:11,font:{size:10}}},
        tooltip:{callbacks:{label:c=>c.dataset.label+' '+f(c.raw,0)+' ราย'}}},
        scales:{x:ax({stacked:true,grid:{display:false},ticks:{font:{size:9.5}}}),y:ax({stacked:true,ticks:{callback:v=>f(v,0)}}),
          y2:{position:'right',grid:{display:false},border:{display:false},ticks:{callback:v=>f(v,0),font:{size:9.5}}}}}});
    const a=SS[SS.length-1],p=SS.find(x=>x.y===a.y-1),f40=SS.find(x=>x.m40!=null);
    const tot=x=>(x.m33||0)+(x.m39||0)+(x.m40||0);
    document.getElementById('ssoU').textContent='รายปี · ปี '+SS[0].y+'–'+a.y;
    document.getElementById('ssoNote').innerHTML=
      `ปี ${a.y} มีผู้ประกันตนรวม <b>${f(tot(a),0)} ราย</b> แยกเป็นมาตรา 33 ${f(a.m33||0,0)} · มาตรา 39 ${f(a.m39||0,0)} · มาตรา 40 ${f(a.m40||0,0)} ราย`+
      (f40&&a.m40&&f40.y<a.y?` · มาตรา 40 (แรงงานอิสระ) เพิ่มจาก ${f(f40.m40,0)} รายในปี ${f40.y} หรือ ${((a.m40/f40.m40-1)*100).toFixed(0)}% สะท้อนว่าแรงงานนอกระบบเข้าสู่ระบบคุ้มครองมากขึ้น`:'')+
      ` · ผู้ประกันตนรวมยังเป็นสัดส่วนไม่มากเมื่อเทียบกับผู้มีงานทำ ${f(last.emp,0)} คน`;
  }

  applyEditMode();
}
DS.init('labor',renderLabor);
</script>
</body>
</html>
