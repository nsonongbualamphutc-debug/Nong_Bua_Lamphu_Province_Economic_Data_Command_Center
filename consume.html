/* ── หน้าการบริโภคและพลังงาน ── */
.cs-ban{height:auto!important;min-height:132px;display:flex;align-items:flex-end;gap:16px;padding:18px 20px;flex-wrap:wrap;position:relative}
.cs-ban:before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(6,30,48,.82) 0%,rgba(6,30,48,.45) 55%,rgba(6,30,48,.15) 100%)}
.cs-ban>*{position:relative}
.cs-ban .tt{display:flex;gap:14px;align-items:center;color:#fff}
.cs-ban .tt .bi{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.cs-ban .tt .bi img{width:44px;height:44px;object-fit:contain}
.cs-ban .tt b{display:block;font-family:var(--fd);font-size:23px;font-weight:600;line-height:1.2;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.cs-ban .tt span{font-size:12.5px;color:#d3e6f5}
.cs-pick{margin-left:auto;background:rgba(255,255,255,.95);border-radius:14px;padding:9px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.cs-pick .ci{width:36px;height:36px;border-radius:10px;background:#2f6fd0;display:grid;place-items:center;flex:none}
.cs-pick .ci svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cs-pick label{display:block;font-size:11.5px;color:#4b5b66;font-weight:600}
.cs-pick select{font:inherit;font-size:14px;font-weight:700;border:1px solid #d9e3ea;border-radius:8px;padding:4px 8px;background:#fff;color:#10231e;cursor:pointer;min-width:140px}
.cs-pick small{display:block;font-size:10.5px;color:#6b7b85;margin-top:2px}

#cKpi .kpi{cursor:pointer}
#cKpi .kpi.cs-on{outline:2px solid var(--kpi);outline-offset:-1px}
#cKpi .kpi .h span:last-child small{display:block;font-size:11px;font-weight:500;color:var(--faint);margin-top:1px}

.cs-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cs-bar .segs button{display:inline-flex;align-items:center;gap:6px;padding:7px 16px}
.cs-act{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.cs-act button{font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  color:var(--dim);border-radius:10px;padding:6px 12px;cursor:pointer}
.cs-act button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cs-act button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-l);font-weight:600}

.cs-sec{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);
  background:var(--card) right -10px center/auto 230% no-repeat;display:flex;align-items:center;gap:18px;padding:16px 18px;min-height:104px;flex-wrap:wrap}
.cs-sec:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 14%,var(--card)) 0%,color-mix(in srgb,var(--card) 92%,transparent) 30%,color-mix(in srgb,var(--card) 55%,transparent) 72%,transparent 100%)}
.cs-sec:after{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--sc)}
.cs-sec>*{position:relative}
.cs-hd{display:flex;gap:14px;align-items:center;min-width:230px}
.cs-hd .ci{width:58px;height:58px;border-radius:18px;background:var(--sc);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px color-mix(in srgb,var(--sc) 35%,transparent)}
.cs-hd .ci img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
.cs-hd b{display:block;font-family:var(--fd);font-size:23px;font-weight:700;color:var(--sc);line-height:1.15;letter-spacing:-.2px}
.cs-hd span span{font-size:12.5px;color:var(--dim)}
.cs-st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:1;max-width:760px;margin-right:22%}
.cs-tile{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(3px);
  border:1px solid color-mix(in srgb,var(--sc) 22%,var(--line));border-radius:14px;padding:10px 12px;min-width:0;box-shadow:0 2px 8px rgba(16,35,30,.05)}
.cs-tile .ti{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--sc) 13%,var(--card));display:grid;place-items:center;flex:none}
.cs-tile .ti img{width:28px;height:28px;object-fit:contain}
.cs-tile .tx{display:flex;flex-direction:column;min-width:0;gap:1px}
.cs-tile .tl{font-size:11.5px;color:var(--dim);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-tile .tv{font-family:var(--fn);font-size:22px;font-weight:700;color:var(--ink);line-height:1.15;letter-spacing:-.4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cs-tile .tv small{font-family:var(--fs);font-size:11px;font-weight:500;color:var(--faint);margin-left:4px;letter-spacing:0}
.cs-d{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;width:max-content;max-width:100%;padding:1px 8px;border-radius:999px;margin-top:2px}
.cs-d em{font-style:normal;font-weight:400;opacity:.75}
.cs-d.up{color:var(--good);background:var(--brand-l)}.cs-d.dn{color:var(--bad);background:var(--coral-l)}.cs-d.fl,.cs-d.nt{color:var(--dim);background:var(--card2);font-weight:500}
.cs-sub{font-size:12px;color:var(--faint);margin:-2px 16px 0;padding-left:37px}
.cs-ch{height:280px;position:relative}
.cs-g{display:grid;grid-template-columns:1.1fr .9fr;gap:13px}
.cs-t{width:100%;border-collapse:collapse;font-size:12.5px}
.cs-t th{font-size:11.5px;font-weight:600;color:var(--dim);text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--card2);line-height:1.35}
.cs-t th.l,.cs-t td.l{text-align:left}
.cs-t th.ce,.cs-t td.ce{text-align:center}
.cs-t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--fn);white-space:nowrap}
.cs-t td.l{font-family:var(--fs)}
.cs-t tr.tot td{font-weight:700;background:var(--sl,var(--card2));border-bottom:0;font-size:13.5px}
.cs-t .na{color:var(--faint);font-weight:400}
.cs-rk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--rc,#f07a1a);color:#fff;font-size:11.5px;font-weight:700;font-family:var(--fn)}
.cs-bar2{height:12px;border-radius:999px;background:var(--card2);overflow:hidden;min-width:120px}
.cs-bar2 i{display:block;height:100%;border-radius:999px;background:var(--bc)}
.cs-foot{font-size:11.5px;color:var(--faint);padding:8px 12px 2px;line-height:1.6}
@media (max-width:1100px){.cs-g{grid-template-columns:1fr}.cs-st{margin-right:0;max-width:none}}

  .cs-st{grid-template-columns:1fr!important;flex:1 1 100%;width:100%;margin-right:0}
  .cs-hd{min-width:0}
  .cs-sec{background-size:auto 140%;background-position:right -40px top}
  #cKpi{grid-template-columns:1fr 1fr!important;gap:9px}

  .cs-ban .tt b{font-size:18px}
  .cs-sec{background-size:auto 100%;background-position:right -60px center}
  .cs-st{grid-template-columns:1fr;width:100%}
  .cs-hd b{font-size:20px}
  .cs-sub{padding-left:0}
  .cs-bar2{min-width:60px}
  .cs-t td,.cs-t th{padding:7px 6px}
}

function apiRows(v){return gdcRows(v).map(r=>({y:parseInt(r['ปี'],10),amp:String(r['อำเภอ']||'').trim(),item:String(r['รายการ']||'').trim(),
  type:String(r['ประเภท']||'').replace(/\s+/g,' ').trim(),v:gdcNum(r['ค่าข้อมูล']!=null?r['ค่าข้อมูล']:r['จำนวน']!=null?r['จำนวน']:r['ค่าของข้อมูล'])})).filter(r=>r.y)}
const CS_APPLY={
  sold(R){const o={};R.forEach(r=>{(o[r.y]=o[r.y]||{})[r.amp]=r.v});return Object.keys(o).length&&(CS.D.water.sold=o)},
  rate(R){const o={};R.forEach(r=>{(o[r.y]=o[r.y]||{})[r.amp]=r.v});return Object.keys(o).length&&(CS.D.water.rate=o)},
  wstat(R){const u={},p={};R.forEach(r=>{const t=/ผู้ใช้/.test(r.item)?u:/ผลิต/.test(r.item)?p:null;if(t)(t[r.y]=t[r.y]||{})[r.amp]=r.v});
    if(Object.keys(u).length)CS.D.water.users=u;if(Object.keys(p).length)CS.D.water.prod=p;return Object.keys(u).length},
  kwh(R){const k={},t={};R.forEach(r=>{if(!r.type||r.type==='ยอดรวม')(k[r.y]=k[r.y]||{})[r.amp]=r.v;
      else{const d=(t[r.y]=t[r.y]||{});d[r.type]=+((d[r.type]||0)+(r.v||0)).toFixed(3)}});
    if(Object.keys(k).length){CS.D.elec.kwh=k;CS.D.elec.type=t}return Object.keys(k).length},
  eusers(R){const o={};R.forEach(r=>{(o[r.y]=o[r.y]||{})[r.amp]=r.v});return Object.keys(o).length&&(CS.D.elec.users=o)},
  car(R){const o={};R.forEach(r=>{if(r.v!=null)o[r.y]=r.v});return Object.keys(o).length&&(CS.D.car.cum=o)}
};
function loadApi(){
  Object.keys(CS_RES).forEach(k=>GDC.all(CS_RES[k]).then(v=>{CS.st[k]=CS_APPLY[k](apiRows(v))?'api':'fallback'})
    .catch(()=>{CS.st[k]='fallback'}).finally(()=>safeRender()));
}

      `<div class="cs-ch"><canvas id="cFuel"></canvas></div><div class="note">ดีเซลหมุนเร็วรวมทุกชนิด เพราะตั้งแต่ปี 2567 รายงานเปลี่ยนชื่อจาก "บี 7" เป็น "ดีเซลหมุนเร็วธรรมดา" · ${trendNote(S.diesel,'พันลิตร',2).replace(/^ปี/,'ดีเซลปี')}</div>`,'พันลิตร')}</div>
  ${card('','fuel',`ปริมาณการจำหน่ายน้ำมันเชื้อเพลิง รายชนิด ปี ${y}`,'จังหวัดหนองบัวลำภู',
    `<div class="sc"><table class="cs-t" style="--sl:#e6f6ee"><thead><tr><th class="ce">อันดับ</th><th class="l">ชนิดของน้ำมันเชื้อเพลิง</th><th>ปริมาณการจำหน่าย (พันลิตร)</th><th class="l" style="width:34%">สัดส่วน (%)</th><th></th></tr></thead>
    <tbody>${L.map((x,i)=>`<tr><td class="ce"><span class="cs-rk" style="--rc:${C[i%C.length]}">${i+1}</span></td><td class="l">${x.n}</td><td>${f(x.v,2)}</td>
      <td class="l"><div class="cs-bar2" style="--bc:${C[i%C.length]}"><i style="width:${Math.max(.6,x.v/tot*100).toFixed(1)}%"></i></div></td><td>${f(x.v/tot*100,1)}</td></tr>`).join('')}
    <tr class="tot"><td></td><td class="l">รวมน้ำมันทั้งหมด</td><td>${f(tot,2)}</td><td class="l"><div class="cs-bar2" style="--bc:#16865f"><i style="width:100%"></i></div></td><td>100.0</td></tr></tbody></table></div>

}

    {l:'รถจดทะเบียนใหม่',v:fx(S.newc[Y]),u:'คัน',ic:'newcar|car',d:dchip(S.newc[Y],S.newc[Y-1],'pct',0,Y-1)},
    {l:`รถใหม่รวม ${ny[0]}–${ny[ny.length-1]}`,v:fx(tot),u:'คัน',ic:'history',n:`เฉลี่ยปีละ ${f_num(Math.round(tot/ny.length))} คัน`}],Y)+

      `<div class="cs-ch"><canvas id="cCar"></canvas></div><div class="note">รถจดทะเบียนใหม่ปี ${ny[ny.length-1]} ${fx(S.newc[ny[ny.length-1]])} คัน เพิ่มจาก ${fx(S.newc[ny[0]])} คันในปี ${ny[0]} (${f(pctc(S.newc[ny[ny.length-1]],S.newc[ny[0]]),1)}%)</div>`,'คัน')}</div>
  ${card('','car','จำนวนรถจดทะเบียนใหม่ จำแนกรายปี','จังหวัดหนองบัวลำภู',
    `<div class="sc"><table class="cs-t" style="--sl:#f1ecfd;--bc:linear-gradient(90deg,#f37aa0,#e8336d)"><thead><tr><th class="ce">อันดับ</th><th class="ce">ปี</th><th>จำนวนรถจดทะเบียนใหม่ (คัน)</th><th>เทียบปีก่อน</th><th class="l" style="width:34%">สัดส่วน (%)</th><th></th></tr></thead>

    <tr class="tot"><td></td><td class="ce">รวมทั้งหมด</td><td>${f_num(tot)}</td><td></td><td class="l"><div class="cs-bar2"><i style="width:100%"></i></div></td><td>100.0</td></tr></tbody></table></div>`,'หน่วย: คัน')}`;

/* ── ตารางเปรียบเทียบรายปีของแท็บ ── */
function cmpRows(S){
  return {water:[['ปริมาณการใช้น้ำประปา (ล้าน ลบ.ม.)',S.water,2],['ปริมาณน้ำที่ผลิตได้จริง (ล้าน ลบ.ม.)',S.wprod,2],['จำนวนผู้ใช้น้ำ (ราย)',S.wuser,0],['การใช้น้ำเฉลี่ย (ลบ.ม./ราย)',S.wrate,2]],
    elec:[['ปริมาณการใช้ไฟฟ้า (ล้านกิโลวัตต์-ชั่วโมง)',S.elec,2],['จำนวนผู้ใช้ไฟฟ้า (ราย)',S.euser,0]],
    fuel:[['น้ำมันดีเซลหมุนเร็ว รวม (พันลิตร)',S.diesel,2],['แก๊สโซฮอล์ E10 ออกเทน 95 (พันลิตร)',S.g95,2],['แก๊สโซฮอล์ E10 ออกเทน 91 (พันลิตร)',S.g91,2],['แก๊สโซฮอล์ E20 (พันลิตร)',S.e20,2],['น้ำมันรวม (พันลิตร)',S.fuelL,2],['ก๊าซแอลพีจี (พันกิโลกรัม)',S.lpg,2]],
    car:[['รถจดทะเบียนสะสม (คัน)',S.cum,0],['รถจดทะเบียนใหม่ (คัน)',S.newc,0]]}[CS.tab];
}
function cmpHtml(S){
  const R=cmpRows(S),Y=[...new Set(R.flatMap(r=>yrs(r[1])))].sort((a,b)=>a-b),t=TABS.find(x=>x.k===CS.tab);
  return secHtml(t)+card('','compare',`เปรียบเทียบรายปี · ${t.t}`,'ตัวเลขเล็กใต้ค่าคือร้อยละเปลี่ยนแปลงจากปีก่อน',
    `<div class="sc"><table class="cs-t"><thead><tr><th class="l">รายการ</th>${Y.map(y=>`<th${y===CS.year?' style="background:var(--brand-l)"':''}>${y}</th>`).join('')}</tr></thead>
    <tbody>${R.map(([n,o,d])=>`<tr><td class="l">${n}</td>${Y.map(y=>{const v=o[y],p=o[y-1];
      return `<td${y===CS.year?' style="background:var(--brand-l)"':''}>${v==null?'<span class="na">—</span>':fx(v,d)}${v!=null&&p?`<div style="font-size:10.5px;color:${v>=p?'var(--good)':'var(--bad)'}">${v>=p?'▲':'▼'} ${f(Math.abs(pctc(v,p)),1)}%</div>`:''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`);
}

/* ── กราฟ ── */
function drawTab(S,Y){
  if(CS.view!=='trend')return;
  const X=o=>yrs(o).map(String),V=(o,ys)=>ys.map(y=>o[y]??null);
  const sel=ys=>ys.map(y=>+y===Y?7:4.5);
  const base={maintainAspectRatio:false,layout:{padding:{top:16,right:16,left:10}},interaction:{mode:'index',intersect:false},
    plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:14}}}};
  if(CS.tab==='water'){
    const ys=[...new Set([...yrs(S.water),...yrs(S.wprod)])].sort((a,b)=>a-b);
    mk('cWater',{type:'line',data:{labels:ys.map(String),datasets:[
        lineDs('ปริมาณน้ำที่จำหน่าย (การใช้น้ำ)',V(S.water,ys),COL.water,{fill:true,backgroundColor:grad('cWater',COL.water),pointRadius:sel(ys),lbl:v=>f(v,2)}),
        lineDs('ปริมาณน้ำที่ผลิตได้จริง',V(S.wprod,ys),'#94a3b8',{borderDash:[6,5],borderWidth:2,pointRadius:3})]},plugins:[lblPlug],
      options:Object.assign({},base,{plugins:{legend:base.plugins.legend,tooltip:{callbacks:{label:c=>c.dataset.label+' '+f(c.raw,2)+' ล้าน ลบ.ม.'}}},
        scales:{x:ax({grid:{display:false},ticks:{font:{size:11.5,weight:'600'}}}),y:ax({beginAtZero:true,grace:'15%',title:{display:true,text:'ล้าน ลบ.ม.',font:{weight:'600'}}})}})});
    const uy=yrs(S.wuser);
    mk('cWUser',{type:'line',data:{labels:uy.map(String),datasets:[
        lineDs('จำนวนผู้ใช้น้ำประปา (ราย)',V(S.wuser,uy),COL.wuser,{yAxisID:'y',pointRadius:sel(uy),lbl:v=>f_num(v)}),
        lineDs('การใช้น้ำเฉลี่ยต่อราย (ลบ.ม./ราย)',V(S.wrate,uy),COL.wrate,{yAxisID:'y1',pointStyle:'rectRot',pointRadius:sel(uy).map(r=>r+1),lbl:v=>f(v,1),lblPos:'below'})]},plugins:[lblPlug],
      options:Object.assign({},base,{scales:{x:ax({grid:{display:false}}),
        y:ax({min:0,max:Math.ceil(Math.max(...V(S.wuser,uy).filter(Boolean))*1.12/2000)*2000,title:{display:true,text:'ราย',color:COL.wuser,font:{weight:'600'}},ticks:{callback:v=>f_num(v)}}),
        y1:ax({position:'right',min:0,max:Math.ceil(Math.max(...V(S.wrate,uy).filter(Boolean))*2/50)*50,grid:{display:false},title:{display:true,text:'ลบ.ม./ราย',color:COL.wrate,font:{weight:'600'}}})}})});
  }
  if(CS.tab==='elec'){
    const ys=yrs(S.elec);
    mk('cElec',{type:'line',data:{labels:X(S.elec),datasets:[lineDs('ปริมาณการใช้ไฟฟ้า (ล้านกิโลวัตต์-ชั่วโมง)',V(S.elec,ys),COL.elec,{fill:true,backgroundColor:grad('cElec',COL.elec),pointRadius:sel(ys),lbl:v=>f(v,2)})]},plugins:[lblPlug],
      options:Object.assign({},base,{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>f(c.raw,2)+' ล้านกิโลวัตต์-ชั่วโมง'}}},
        scales:{x:ax({grid:{display:false},ticks:{font:{size:11.5,weight:'600'}}}),y:ax({beginAtZero:true,grace:'15%',title:{display:true,text:'ล้านหน่วย',font:{weight:'600'}}})}})});
    const y=atOr(S.elec,Y).y,T=CS.D.elec.type[y]||{},tl=Object.keys(T).filter(k=>T[k]>0).sort((a,b)=>T[b]-T[a]),tt=tl.reduce((a,k)=>a+T[k],0);
    const C=['#f07a1a','#f2b01e','#2f7fd8','#16a06a','#9b6bd6'];
    mk('cEType',{type:'bar',data:{labels:tl.map(k=>k.replace('สถานธุรกิจและ อุตสาหกรรม','ธุรกิจและอุตสาหกรรม').replace('ส่วนราชการ และองค์กรไม่แสวงหาผลกำไร','ส่วนราชการและองค์กรไม่แสวงหากำไร')),
        datasets:[{data:tl.map(k=>T[k]),backgroundColor:tl.map((_,i)=>C[i%C.length]),borderRadius:6,barPercentage:.72}]},
      plugins:[{id:'csHb',afterDatasetsDraw(c){const ctx=c.ctx;c.getDatasetMeta(0).data.forEach((b,i)=>{const v=c.data.datasets[0].data[i];
        ctx.save();ctx.font="600 11px 'IBM Plex Sans','IBM Plex Sans Thai',sans-serif";ctx.fillStyle=cv('--ink');ctx.textBaseline='middle';
        ctx.fillText(f(v,2)+' ('+f(v/tt*100,1)+'%)',b.x+6,b.y);ctx.restore()})}}],
      options:{indexAxis:'y',maintainAspectRatio:false,layout:{padding:{right:90}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>f(c.raw,2)+' ล้านหน่วย ('+f(c.raw/tt*100,1)+'%)'}}},
        scales:{x:ax({beginAtZero:true}),y:ax({grid:{display:false},ticks:{font:{size:11.5}}})}}});

  if(CS.tab==='fuel'){

    mk('cFuel',{type:'line',data:{labels:ys.map(String),datasets:[
        lineDs('น้ำมันดีเซลหมุนเร็ว (รวม)',V(S.diesel,ys),COL.diesel,{pointRadius:sel(ys),lbl:v=>f_num(Math.round(v))}),
        lineDs('แก๊สโซฮอล์ E10 ออกเทน 95',V(S.g95,ys),COL.g95,{pointRadius:sel(ys),lbl:v=>f_num(Math.round(v))}),
        lineDs('แก๊สโซฮอล์ E10 ออกเทน 91',V(S.g91,ys),COL.g91,{pointRadius:sel(ys),lbl:v=>f_num(Math.round(v)),lblPos:'below'}),
        lineDs('แก๊สโซฮอล์ E20',V(S.e20,ys),COL.e20,{pointRadius:sel(ys)})]},plugins:[lblPlug],
      options:Object.assign({},base,{plugins:{legend:base.plugins.legend,tooltip:{callbacks:{label:c=>c.dataset.label+' '+f(c.raw,2)+' พันลิตร'}}},
        scales:{x:ax({grid:{display:false},ticks:{font:{size:11.5,weight:'600'}}}),y:ax({beginAtZero:true,grace:'12%',title:{display:true,text:'พันลิตร',font:{weight:'600'}},ticks:{callback:v=>f_num(v)}})}})});
  }
  if(CS.tab==='car'){
    const ys=[...new Set([...yrs(S.cum),...yrs(S.newc)])].sort((a,b)=>a-b);
    mk('cCar',{type:'line',data:{labels:ys.map(String),datasets:[
        lineDs('รถจดทะเบียนสะสม (คัน)',V(S.cum,ys),COL.cum,{fill:true,backgroundColor:grad('cCar',COL.cum),pointRadius:sel(ys),lbl:v=>f_num(v)}),
        lineDs('รถจดทะเบียนใหม่ (คัน)',V(S.newc,ys),COL.newc,{fill:true,backgroundColor:COL.newc+'14',pointRadius:sel(ys),lbl:v=>f_num(v)})]},plugins:[lblPlug],

  }
}

/* ── ดาวน์โหลด CSV ของแท็บ ── */
function downloadCsv(){
  const S=series(),R=cmpRows(S),Y=[...new Set(R.flatMap(r=>yrs(r[1])))].sort((a,b)=>a-b),t=TABS.find(x=>x.k===CS.tab);
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const L=[['รายการ',...Y].map(q).join(',')];R.forEach(([n,o,d])=>L.push([n,...Y.map(y=>o[y]==null?'':(+o[y]).toFixed(d))].map(q).join(',')));
  if(CS.tab==='water'){const W=CS.D.water;L.push('',q('รายอำเภอ'));L.push(['ปี','อำเภอ','ปริมาณน้ำที่จำหน่าย (ลบ.ม.)','ผู้ใช้น้ำ (ราย)','อัตราการใช้น้ำ (ลบ.ม./ราย)'].map(q).join(','));
    yrs(W.sold).forEach(y=>AMP.forEach(a=>L.push([y,a,(W.sold[y]||{})[a],(W.users[y]||{})[a],(W.rate[y]||{})[a]].map(q).join(','))))}
  if(CS.tab==='elec'){const E=CS.D.elec;L.push('',q('รายอำเภอ'));L.push(['ปี','อำเภอ','การจำหน่ายไฟฟ้า (ล้านหน่วย)','ผู้ใช้ไฟฟ้า (ราย)'].map(q).join(','));
    yrs(E.kwh).forEach(y=>AMP.forEach(a=>L.push([y,a,(E.kwh[y]||{})[a],(E.users[y]||{})[a]].map(q).join(','))))}
  if(CS.tab==='fuel'){const F=CS.D.fuel;L.push('',q('รายชนิด'));L.push(['ปี','ชนิดของน้ำมันเชื้อเพลิง','ปริมาณ','หน่วย'].map(q).join(','));
    yrs(F).forEach(y=>Object.keys(F[y]).forEach(n=>L.push([y,n,F[y][n],CS.D.fuelUnit[n]].map(q).join(','))))}
  L.push('',q('ที่มา: ระบบบัญชีข้อมูลจังหวัดหนองบัวลำภู และรายงานสถิติจังหวัด'));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download=t.t+'_หนองบัวลำภู.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ── วาดหน้า ── */
function renderConsume(){
  const v=document.getElementById('v-consume');
  const S=series(),ys=yearList(S);
  if(!CS.year||ys.indexOf(CS.year)<0)CS.year=ys[ys.length-1];
  const Y=CS.year;
  const body=CS.view==='cmp'?cmpHtml(S):{water:waterHtml,elec:elecHtml,fuel:fuelHtml,car:carHtml}[CS.tab](S,Y);
  const apiN=Object.values(CS.st).filter(x=>x==='api').length;
  v.innerHTML=bannerHtml(Y,ys)+`<div class="grid g4 mb" id="cKpi">${kpis(S,Y)}</div>`+barHtml()+`<div id="csBody">${body}</div>
    <div class="c" style="margin-top:13px"><header><span class="hdico icow img">${icoImg('source',26)}</span><h3>แหล่งข้อมูลและหน่วยงานผู้รับผิดชอบ</h3></header>
      <div class="b">${srcBar(['pwa','pea','dlt','doeb'],`น้ำประปา ไฟฟ้า และรถจดทะเบียนสะสม: ระบบบัญชีข้อมูลจังหวัด (API ${apiN} จาก 6 ชุด${apiN<6?' · ชุดที่เชื่อมไม่ได้ใช้ข้อมูลสำรองจากไฟล์':''}) · น้ำมันเชื้อเพลิง: รายงานสถิติจังหวัด ตาราง 13.2 (ไฟล์) · รถจดทะเบียนใหม่: รายงานสถิติจังหวัด ตาราง 15.2 (ไฟล์)`)}</div></div>`;
  drawTab(S,Y);
  try{gdcLive('consume')}catch(e){}
}
window.onSeg=function(w,btn){if(w.id==='csTabs'){CS.tab=btn.dataset.k;safeRender()}};
document.addEventListener('click',e=>{
  const k=e.target.closest('[data-cstab]');if(k&&!e.target.closest('.kdot')){CS.tab=k.dataset.cstab;safeRender();
    const b=document.getElementById('csTabs');if(b)b.scrollIntoView({behavior:'smooth',block:'start'});return}
  const vw=e.target.closest('[data-csv]');if(vw){CS.view=vw.dataset.csv;safeRender();return}
  if(e.target.closest('[data-csdl]'))downloadCsv();
});
document.addEventListener('change',e=>{if(e.target.id==='csYear'){CS.year=+e.target.value;safeRender()}});
DS.init('consume',renderConsume);
loadApi();
