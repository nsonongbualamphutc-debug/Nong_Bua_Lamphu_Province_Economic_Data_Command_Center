<body>
<div id="tip"></div>
<div class="app" id="app">
  <header class="top" id="topbar"></header>
  <nav class="side" id="sidebar"></nav>
  <main class="main">
    <section class="view on" id="v-household"></section>
  </main>
</div>
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="data1.js"></script>
<script src="data2.js"></script>
<script src="ds.js"></script>
<script>
const H=DX.house;
const K_INC='รายได้ทั้งสิ้นเฉลี่ยต่อเดือนของครัวเรือน';
const K_EXP='ค่าใช้จ่ายทั้งสิ้นเฉลี่ยต่อเดือนของครัวเรือน';
const K_DEBT='จำนวนหนี้สินทั้งสิ้นเฉลี่ยต่อครัวเรือน';
const K_DEBT2='จำนวนหนี้สินเฉลี่ยต่อครัวเรือนที่เป็นหนี้';
const hv=(y,k)=>{const r=H.main.find(x=>x.y===y&&x.k===k);return r?r.v:null};
const hYears=k=>H.main.filter(x=>x.k===k).map(x=>x.y).sort((a,b)=>a-b);
let HY=null;

function renderHouse(){
  const incY=hYears(K_INC), expY=hYears(K_EXP);
  const YS=[...new Set([...incY,...expY])].sort((a,b)=>a-b);
  /* เปิดหน้าที่ปีล่าสุดที่มีทั้งรายได้และค่าใช้จ่าย · ปีที่สำรวจไม่ครบยังเลือกดูได้ */
  if(HY===null){const full=YS.filter(y=>hv(y,K_INC)!=null&&hv(y,K_EXP)!=null);HY=full.length?full[full.length-1]:YS[YS.length-1]}
  const inc=hv(HY,K_INC), exp=hv(HY,K_EXP);
  const debt=hv(HY,K_DEBT)??hv(YS[YS.length-2],K_DEBT);
  const debtY=hv(HY,K_DEBT)!=null?HY:YS.filter(y=>hv(y,K_DEBT)!=null).pop();
  const debt2=hv(debtY,K_DEBT2);
  const left=(inc!=null&&exp!=null)?inc-exp:null;
  /* Gini ต้นทางรายงาน 2 แบบตามขอบเขตจำกัดชั้นรายได้ คือแบ่งครัวเรือน 5 กลุ่ม และ 10 กลุ่ม
     ใช้ป้ายเดียวกันทั้งคู่ จึงต้องแยกด้วยช่อง g
     ถ้าตารางจากชีตยังไม่มีช่อง g ให้แยกจากค่าเอง: ปีที่มี 2 ค่า ค่าที่ต่ำกว่าคือ 5 กลุ่มเสมอ
     เพราะ 10 กลุ่มซ้อนอยู่ใน 5 กลุ่ม เส้นลอเรนซ์ที่มีจุดมากกว่าจะอยู่ต่ำกว่าหรือเท่าเดิม Gini จึงไม่มีทางต่ำกว่า */
  const gini=(function(rows){
    const by={};
    rows.filter(x=>x.v).forEach(r=>(by[r.y]=by[r.y]||[]).push(r));
    const out=[];
    Object.keys(by).map(Number).sort((a,b)=>a-b).forEach(y=>{
      const L=by[y];
      if(L.every(r=>r.g==5||r.g==10)){L.forEach(r=>out.push({y,v:+r.v,g:+r.g}));return}
      if(L.length===2){const q=L.slice().sort((a,b)=>a.v-b.v);out.push({y,v:+q[0].v,g:5},{y,v:+q[1].v,g:10});return}
      L.forEach(r=>out.push({y,v:+r.v,g:(r.g==5||r.g==10)?+r.g:0}));
    });
    return out;
  })(H.gini||[]);
  const gOf=g=>gini.filter(x=>x.g===g);
  const G10=gOf(10), G5=gOf(5), G0=gOf(0);
  const gMain=G10.length?G10:G5;                 /* ชุดหลักคือ 10 กลุ่ม เพราะละเอียดกว่า ใกล้ค่าจริงกว่า */
  const gMainN=G10.length?10:5;
  const gLast=gMain[gMain.length-1], gPrev=gMain[gMain.length-2];

  document.getElementById('v-household').innerHTML=`
  <div class="ph"><div class="t" style="display:flex;gap:14px;align-items:flex-start">
    <span class="bigico icow img" data-bigico="household"></span>
    <span><h2>ครัวเรือนและความเหลื่อมล้ำ</h2>
    <p>ตัวเลขเศรษฐกิจมหภาคดีขึ้นไม่ได้แปลว่าเงินถึงครัวเรือน หน้านี้ดูว่ารายได้ ค่าใช้จ่าย และหนี้สินของครัวเรือนจริงเป็นอย่างไร</p></span></div>
    <div class="r"><span class="chip real">ข้อมูลจริง</span></div></div>
  ${yearBar('yb-hh',{years:YS,value:HY,selId:'hYear',
    partial:YS.filter(y=>hv(y,K_INC)==null||hv(y,K_EXP)==null),
    note:'สำรวจภาวะเศรษฐกิจและสังคมของครัวเรือน เก็บรายได้กับค่าใช้จ่ายคนละรอบ ปีที่เก็บไม่ครบจะกำกับไว้ในรายการ'})}

  <div id="hPlayer"></div>
  <div class="grid g5 mb" id="hKpi"></div>

  <div class="grid g21 mb">
    <div class="c"><header><span class="hdico icow img" data-hdico="income"></span><h3>รายได้และค่าใช้จ่ายเฉลี่ยต่อเดือน</h3><span class="u">บาทต่อครัวเรือน</span>
      <span class="r">${viewToggle('cIE')}</span></header>
      <div class="b">
        <div id="cIE-chart"><div class="ch lg"><canvas id="cIE"></canvas></div></div>
        <div id="cIE-table" class="hide"><div class="sc"><table class="t" id="tIE"></table></div></div>
        <div class="note" id="ieNote"></div>
      </div></div>
    <div class="c"><header><span class="hdico icow img">${icoImg('debt',26)}</span><h3>หนี้สินเฉลี่ยต่อครัวเรือน</h3></header>
      <div class="b"><div class="ch lg"><canvas id="cDebt"></canvas></div>
        <div class="note" id="debtNote"></div></div></div>
  </div>

  <div class="grid g3 mb">
    <div class="c"><header><span class="hdico icow img">${icoImg('gini',26)}</span><h3>ความเหลื่อมล้ำด้านรายได้</h3>
      <span class="u">สัมประสิทธิ์ Gini</span></header>
      <div class="b"><div class="ch"><canvas id="cGini"></canvas></div>
        <div class="note" id="giniNote"></div></div></div>
    <div class="c"><header><span class="hdico icow img">${icoImg('income',26)}</span><h3>แหล่งที่มาของรายได้</h3></header>
      <div class="b"><div class="ch"><canvas id="cSrc"></canvas></div>
        <div class="note" id="srcNote"></div></div></div>
    <div class="c"><header><span class="hdico icow img">${icoImg('debt',26)}</span><h3>หนี้ในระบบและนอกระบบ</h3></header>
      <div class="b"><div id="dbox"></div>
        <div class="note" id="dboxNote"></div></div></div>
  </div>

  <div class="grid g2 mb">
    <div class="c"><header><span class="hdico icow img">${icoImg('expense',26)}</span><h3>ค่าใช้จ่ายตามขนาดครัวเรือน</h3>
      <span class="r">${viewToggle('cSize')}</span></header>
      <div class="b">
        <div id="cSize-chart"><div class="ch"><canvas id="cSize"></canvas></div></div>
        <div id="cSize-table" class="hide"><div class="sc"><table class="t" id="tSize"></table></div></div>
        <div class="note">ครัวเรือนขนาดใหญ่มีค่าใช้จ่ายรวมสูงกว่า แต่เมื่อหารต่อคนแล้วมักต่ำกว่า เพราะแบ่งใช้ค่าที่อยู่อาศัยและสาธารณูปโภคร่วมกัน</div></div></div>
    <div class="c"><header><span class="hdico icow img">${icoImg('poverty',26)}</span><h3>การกระจายค่าใช้จ่ายของครัวเรือน</h3>
      <span class="u">ร้อยละของครัวเรือน</span></header>
      <div class="b"><div class="ch"><canvas id="cDist"></canvas></div>
        <div class="note" id="distNote"></div></div></div>
  </div>

  <div class="c"><header><span class="hdico icow img">${icoImg('source',26)}</span><h3>แหล่งข้อมูลและหน่วยงานผู้รับผิดชอบ</h3></header>
    <div class="b">${srcBar(['house'],'สำรวจทุก 2 ปี เก็บข้อมูลจากกลุ่มตัวอย่างครัวเรือนทั่วจังหวัด ครอบคลุมรายได้ ค่าใช้จ่าย หนี้สิน และการกระจายรายได้')}</div></div>`;

  /* ── KPI ── */
  const prevY=YS[YS.indexOf(HY)-1];
  const incP=prevY?hv(prevY,K_INC):null, expP=prevY?hv(prevY,K_EXP):null;
  document.getElementById('hKpi').innerHTML=[
    kpiCard({icon:'coin',img:'income',color:cv('--brand'),label:'รายได้เฉลี่ยต่อเดือน',
      value:inc!=null?f(inc,0):'—',unit:'บาท',
      chip:(inc!=null&&incP)?chip(pctc(inc,incP))+' '+statusBadge(pctc(inc,incP),false,'รายได้ครัวเรือนเทียบปีสำรวจก่อน'):'<span class="chip">—</span>',
      sub:'ต่อครัวเรือน · ปี '+HY,
      tip:tipOf({t:'รายได้ทั้งสิ้นเฉลี่ยต่อเดือนของครัวเรือน',
        d:'รวมรายได้ทุกทางของสมาชิกในครัวเรือน ทั้งค่าจ้าง กำไรจากการผลิต เงินช่วยเหลือ และรายได้ที่ไม่เป็นตัวเงิน',
        calc:'ผลรวมรายได้ทุกแหล่ง หารด้วยจำนวนครัวเรือนตัวอย่าง แล้วถ่วงน้ำหนักขึ้นเป็นระดับจังหวัด',
        src:'house',when:'ปี '+HY})}),
    kpiCard({icon:'cart',img:'expense',color:cv('--coral'),label:'ค่าใช้จ่ายเฉลี่ยต่อเดือน',
      value:exp!=null?f(exp,0):'—',unit:'บาท',
      chip:(exp!=null&&expP)?chip(pctc(exp,expP))+' '+statusBadge(pctc(exp,expP),true,'ค่าใช้จ่ายครัวเรือนเทียบปีสำรวจก่อน'):'<span class="chip">—</span>',
      sub:'ต่อครัวเรือน · ปี '+HY,
      tip:tipOf({t:'ค่าใช้จ่ายทั้งสิ้นเฉลี่ยต่อเดือนของครัวเรือน',
        d:'รวมทั้งค่าอุปโภคบริโภคและค่าใช้จ่ายที่ไม่ใช่การบริโภค เช่น ภาษี เบี้ยประกัน และดอกเบี้ยเงินกู้',
        calc:'ผลรวมรายจ่ายทุกหมวด หารด้วยจำนวนครัวเรือนตัวอย่าง',src:'house',when:'ปี '+HY})}),
    kpiCard({icon:'chart',img:'income',color:left>=0?cv('--brand2'):cv('--bad'),label:'เงินเหลือต่อเดือน',
      value:left!=null?f(left,0):'—',unit:'บาท',
      chip:left!=null?('<span class="chip '+(left>=0?'up':'dn')+'">'+(left>=0?'เหลือ ':'ติดลบ ')+(inc?Math.abs(left/inc*100).toFixed(1):'0')+'% ของรายได้</span>'):'',
      sub:left!=null&&left<0?'ใช้จ่ายเกินรายได้':'ส่วนที่เหลือไว้ออมหรือชำระหนี้',
      tip:tipOf({t:'เงินเหลือต่อเดือน',
        d:'ส่วนต่างระหว่างรายได้กับค่าใช้จ่าย เป็นตัวบอกความสามารถในการออมและผ่อนชำระหนี้ของครัวเรือน',
        calc:'รายได้เฉลี่ยต่อเดือน − ค่าใช้จ่ายเฉลี่ยต่อเดือน'+(inc!=null?' = '+f(inc,0)+' − '+f(exp,0):''),
        src:'house',when:'ปี '+HY})}),
    kpiCard({icon:'coin',img:'debt',color:cv('--gold'),label:'หนี้สินเฉลี่ยต่อครัวเรือน',
      value:debt!=null?f(debt,0):'—',unit:'บาท',
      chip:(debt&&inc)?('<span class="chip fl">เท่ากับรายได้ '+(debt/inc).toFixed(1)+' เดือน</span>'):'',
      sub:'ปี '+debtY+(debt2?(' · เฉพาะครัวเรือนที่เป็นหนี้ '+f(debt2,0)+' บาท'):''),
      tip:tipOf({t:'จำนวนหนี้สินทั้งสิ้นเฉลี่ยต่อครัวเรือน',
        d:'เฉลี่ยรวมทุกครัวเรือน ทั้งที่มีหนี้และไม่มีหนี้ จึงต่ำกว่าตัวเลขเฉพาะครัวเรือนที่เป็นหนี้',
        calc:'ยอดหนี้คงค้างรวม หารด้วยจำนวนครัวเรือนทั้งหมด',src:'house',when:'ปี '+debtY})}),
    kpiCard({icon:'chart',img:'gini',color:cv('--plum'),label:'ความเหลื่อมล้ำด้านรายได้',
      value:gLast?gLast.v.toFixed(3):'—',unit:'Gini',
      chip:'<span class="chip '+(gLast&&gLast.v<0.35?'up':'fl')+'">'+(gLast&&gLast.v<0.35?'อยู่ในเกณฑ์ดี':'ต้องเฝ้าระวัง')+'</span>',
      sub:'ปี '+(gLast?gLast.y:'—')+' · แบ่ง '+gMainN+' กลุ่มรายได้',
      tip:tipOf({t:'สัมประสิทธิ์ความไม่เสมอภาคด้านรายได้ (Gini) · แบ่ง '+gMainN+' กลุ่ม',
        d:'ค่าระหว่าง 0 ถึง 1 · ยิ่งใกล้ 0 ยิ่งเท่าเทียม ยิ่งใกล้ 1 ยิ่งกระจุกตัว โดยทั่วไปต่ำกว่า 0.35 ถือว่าอยู่ในเกณฑ์ดี',
        calc:'คำนวณจากเส้นลอเรนซ์ของรายได้ครัวเรือน โดยแบ่งครัวเรือนตามขอบเขตจำกัดชั้นรายได้เป็น '+gMainN+' กลุ่มเท่ากัน'+
          ' · แบบ 10 กลุ่มละเอียดกว่าจึงใกล้ค่าจริงกว่า ค่าจะสูงกว่าแบบ 5 กลุ่มเสมอ'+
          (gPrev?' · ปี '+gPrev.y+' = '+gPrev.v.toFixed(3):''),
        src:'house',when:'ปี '+(gLast?gLast.y:'')})})
  ].join('');

  const hp=document.getElementById('hPlayer');
  if(hp){
    hp.innerHTML=playerBar('hPlay',{
      frames:YS.map(y=>({label:'ปี '+y,short:String(y).slice(-2),y})),
      i:YS.length-1, ms:1600, hoverStop:'#hKpi',
      onFrame:fr=>{HY=fr.y;renderHouse();
        const sl=document.getElementById('hYear'); if(sl)sl.value=fr.y;}
    });
    bindPlayer('hPlay',true);
  }

  /* ── รายได้ vs ค่าใช้จ่าย ── */
  mk('cIE',{data:{labels:YS.map(y=>'ปี '+y),datasets:[
    {type:'bar',label:'รายได้ (บาท/เดือน)',data:YS.map(y=>hv(y,K_INC)),backgroundColor:cv('--brand'),borderRadius:6,barPercentage:.72},
    {type:'bar',label:'ค่าใช้จ่าย (บาท/เดือน)',data:YS.map(y=>hv(y,K_EXP)),backgroundColor:cv('--coral'),borderRadius:6,barPercentage:.72},
    {type:'line',label:'เงินเหลือ',data:YS.map(y=>{const a=hv(y,K_INC),b=hv(y,K_EXP);return (a!=null&&b!=null)?a-b:null}),
      borderColor:cv('--gold'),borderWidth:2.6,pointRadius:4,pointBackgroundColor:cv('--gold'),tension:.25}]},
    options:{interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{padding:11}},
      tooltip:{callbacks:{label:c=>c.dataset.label+' '+f(c.raw,0)+' บาท'}}},
      scales:{x:ax({grid:{display:false}}),y:ax({ticks:{callback:v=>f(v,0)}})}}});
  document.getElementById('tIE').innerHTML=`<thead><tr><th>ปี</th><th class="r">รายได้</th><th class="r">ค่าใช้จ่าย</th>
    <th class="r">เงินเหลือ</th><th class="r">สัดส่วนใช้จ่าย</th></tr></thead><tbody>`+
    YS.map(y=>{const a=hv(y,K_INC),b=hv(y,K_EXP);
      return `<tr><td>ปี ${y}</td><td class="r">${a!=null?f(a,0):'—'}</td><td class="r">${b!=null?f(b,0):'—'}</td>
        <td class="r" style="font-weight:600">${(a!=null&&b!=null)?f(a-b,0):'—'}</td>
        <td class="r">${(a&&b)?(b/a*100).toFixed(1)+'%':'—'}</td></tr>`}).join('')+'</tbody>';
  const ratio=(inc&&exp)?(exp/inc*100):null;
  document.getElementById('ieNote').innerHTML=
    (inc==null||exp==null)
    ?`ปี ${HY} ${inc==null?'ยังไม่มีข้อมูลรายได้':''}${inc==null&&exp==null?' และ':''}${exp==null?'ยังไม่มีข้อมูลค่าใช้จ่าย':''}
       ${exp!=null?'มีเฉพาะค่าใช้จ่ายเฉลี่ย <b>'+f(exp,0)+' บาทต่อเดือน</b>':''}${inc!=null?'มีเฉพาะรายได้เฉลี่ย <b>'+f(inc,0)+' บาทต่อเดือน</b>':''}
       จึงคำนวณเงินเหลือเก็บไม่ได้ เลือกปีที่สำรวจครบเพื่อดูภาพเต็ม`
    :`ปี ${HY} ครัวเรือนมีรายได้เฉลี่ย <b>${f(inc,0)} บาทต่อเดือน</b> ใช้จ่าย <b>${f(exp,0)} บาท</b>
     คิดเป็น ${ratio.toFixed(1)}% ของรายได้ เหลือเก็บ ${f(left,0)} บาท
     ตัวเลขนี้สำคัญกว่า GPP ต่อหัว เพราะเป็นเงินที่ครัวเรือนสัมผัสได้จริง`;

  /* ── หนี้สิน ── */
  const dY=[...new Set(H.main.filter(x=>x.k===K_DEBT).map(x=>x.y))].sort((a,b)=>a-b);
  mk('cDebt',{data:{labels:dY.map(y=>'ปี '+y),datasets:[
    {type:'bar',label:'เฉลี่ยทุกครัวเรือน',data:dY.map(y=>hv(y,K_DEBT)),backgroundColor:cv('--gold'),borderRadius:6,barPercentage:.62},
    {type:'bar',label:'เฉพาะครัวเรือนที่เป็นหนี้',data:dY.map(y=>hv(y,K_DEBT2)),backgroundColor:cv('--coral'),borderRadius:6,barPercentage:.62}]},
    options:{plugins:{legend:{position:'bottom',labels:{padding:11}},
      tooltip:{callbacks:{label:c=>c.dataset.label+' '+f(c.raw,0)+' บาท',
        footer:it=>inc?('เท่ากับรายได้ราว '+(it[0].raw/inc).toFixed(1)+' เดือน'):''}}},
      scales:{x:ax({grid:{display:false}}),y:ax({ticks:{callback:v=>f(v/1000,0)+'K'}})}}});
  document.getElementById('debtNote').innerHTML=
    `หนี้สินเฉลี่ยทุกครัวเรือน ${f(debt,0)} บาท แต่ถ้านับเฉพาะครัวเรือนที่เป็นหนี้จริงจะสูงถึง <b>${f(debt2,0)} บาท</b>
     ส่วนต่างนี้บอกว่าหนี้กระจุกอยู่ในบางครัวเรือน ไม่ได้เฉลี่ยกันทั่ว การช่วยเหลือจึงควรพุ่งเป้าไปที่กลุ่มที่เป็นหนี้จริง`;

  /* ── Gini ── */
  /* แกนปีไม่ซ้ำ · แยกเส้นตามการแบ่งกลุ่ม · ปีที่ต้นทางไม่ระบุการแบ่งกลุ่มแสดงเป็นจุดแยก ไม่ต่อเส้น */
  const GY=[...new Set(gini.map(x=>x.y))].sort((a,b)=>a-b);
  const at=(arr,y)=>{const r=arr.find(x=>x.y===y);return r?r.v:null};
  const gSets=[];
  if(G10.length)gSets.push({label:'แบ่ง 10 กลุ่มรายได้',data:GY.map(y=>at(G10,y)),borderColor:cv('--plum'),
    backgroundColor:cv('--plum')+'1f',borderWidth:2.8,pointRadius:5,pointBackgroundColor:cv('--plum'),tension:.25,fill:true,spanGaps:true});
  if(G5.length)gSets.push({label:'แบ่ง 5 กลุ่มรายได้',data:GY.map(y=>at(G5,y)),borderColor:cv('--gold'),
    backgroundColor:'transparent',borderWidth:2.2,borderDash:[6,4],pointRadius:4.5,pointBackgroundColor:cv('--gold'),tension:.25,fill:false,spanGaps:true});
  if(G0.length)gSets.push({label:'ต้นทางไม่ระบุการแบ่งกลุ่ม',data:GY.map(y=>at(G0,y)),showLine:false,
    borderColor:cv('--faint')||'#8a9a94',backgroundColor:'#ffffff',pointStyle:'rectRot',pointRadius:7,pointBorderWidth:2});
  mk('cGini',{type:'line',data:{labels:GY.map(y=>'ปี '+y),datasets:gSets},
    options:{plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:12,boxHeight:12,font:{size:11}}},
      tooltip:{callbacks:{label:c=>c.dataset.label+' · Gini '+(c.raw==null?'—':c.raw.toFixed(3)),
        footer:it=>it[0]&&it[0].raw!=null?(it[0].raw<0.35?'อยู่ในเกณฑ์ดี':'เริ่มกระจุกตัว ควรเฝ้าระวัง'):''}}},
      scales:{x:ax({grid:{display:false}}),y:ax({min:0.25,max:0.40,ticks:{callback:v=>v.toFixed(2)}})}}});

  /* คำอธิบายเทียบเฉพาะชุดเดียวกัน ทิศทางคำนวณจากตัวเลขจริง ไม่เขียนตายตัว */
  const trend=(arr,n)=>{
    if(arr.length<2)return '';
    const a0=arr[0], a1=arr[arr.length-1], p=arr[arr.length-2], d=a1.v-a0.v, dr=a1.v-p.v;
    const w=x=>Math.abs(x)<0.005?'ทรงตัว':(x>0?'เพิ่มขึ้น':'ลดลง');
    return `แบบ ${n} กลุ่ม ${w(d)}จาก ${a0.v.toFixed(3)} ในปี ${a0.y} เป็น ${a1.v.toFixed(3)} ในปี ${a1.y}`+
           (p!==a0?` แต่ถ้าเทียบรอบก่อนหน้า (ปี ${p.y} = ${p.v.toFixed(3)}) ${w(dr)}`:'');
  };
  const t10=trend(G10,10), t5=trend(G5,5);
  const up=gLast&&gPrev&&gLast.v-gPrev.v>=0.005;
  document.getElementById('giniNote').innerHTML=
    [t10,t5].filter(Boolean).join('<br>')+'<br>'+
    (up?'ช่วงหลังความเหลื่อมล้ำกลับมาสูงขึ้น รายได้ที่เพิ่มยังกระจายไปไม่ทั่วถึงเท่าเดิม ควรเฝ้าระวัง'
       :'ภาพรวมความเหลื่อมล้ำไม่ได้แย่ลง')+
    (G0.length?`<br><span style="color:var(--faint)">ปี ${G0.map(x=>x.y).join(', ')} ต้นทางรายงานค่าเดียว (${G0.map(x=>x.v.toFixed(3)).join(', ')}) ไม่ระบุว่าแบ่งกี่กลุ่ม จึงแสดงเป็นจุดแยก</span>`:'')+
    `<br><span style="color:var(--faint)">อ่านเทียบกันได้เฉพาะเส้นเดียวกัน · แบบ 10 กลุ่มสูงกว่าแบบ 5 กลุ่มเสมอเพราะแบ่งละเอียดกว่า ไม่ได้แปลว่าเหลื่อมล้ำกว่า</span>`;

  /* ── แหล่งรายได้ ── */
  const sy=[...new Set(H.income_src.map(x=>x.y))].sort((a,b)=>b-a)[0];
  const SRC=H.income_src.filter(x=>x.y===sy&&x.v>0);
  const sTot=SRC.reduce((a,b)=>a+b.v,0)||1;
  mk('cSrc',{type:'doughnut',data:{labels:SRC.map(x=>x.k),
    datasets:[{data:SRC.map(x=>x.v),backgroundColor:PAL(),borderColor:cv('--card'),borderWidth:3}]},
    options:{cutout:'56%',plugins:{legend:{position:'bottom',labels:{padding:8,font:{size:10}}},
      tooltip:{callbacks:{label:c=>c.label+' '+f(c.raw,0),
        footer:it=>(it[0].raw/sTot*100).toFixed(1)+'% ของรายได้ทั้งหมด'}}}}});
  const work=SRC.find(x=>/ทำงาน/.test(x.k));
  document.getElementById('srcNote').innerHTML=work
    ? `รายได้จากการทำงานคิดเป็น <b>${(work.v/sTot*100).toFixed(1)}%</b> ของรายได้ครัวเรือน (ข้อมูลปี ${sy})
       ส่วนที่เหลือมาจากเงินช่วยเหลือ ทรัพย์สิน และรายได้ที่ไม่เป็นตัวเงิน
       ยิ่งพึ่งเงินช่วยเหลือมาก ยิ่งเปราะบางเมื่อนโยบายเปลี่ยน`
    : `ข้อมูลแหล่งรายได้ปี ${sy}`;

  /* ── หนี้ในระบบ/นอกระบบ ── */
  const dbY=[...new Set(H.debt.map(x=>x.y))].sort((a,b)=>b-a)[0];
  const DB2=H.debt.filter(x=>x.y===dbY);
  const dTot=DB2.reduce((a,b)=>a+b.v,0)||1;
  document.getElementById('dbox').innerHTML=DB2.map((r,i)=>`<div class="barrow">
      <span class="nm">หนี้${r.k}</span>
      <span class="tr"><i style="width:${(r.v/dTot*100).toFixed(0)}%;background:${r.k==='ในระบบ'?cv('--brand'):cv('--coral')}"></i></span>
      <span class="vv">${f(r.v,0)}</span></div>`).join('')+
    `<div class="mini" style="margin-top:10px"><div class="l">รวมหนี้สินเฉลี่ย ปี ${dbY}</div>
      <div class="v">${f(dTot,0)}<small> บาท/ครัวเรือน</small></div></div>`;
  const outsys=DB2.find(x=>x.k==='นอกระบบ');
  document.getElementById('dboxNote').innerHTML=outsys
    ? `หนี้นอกระบบคิดเป็น ${(outsys.v/dTot*100).toFixed(1)}% ของหนี้ทั้งหมด
       แม้สัดส่วนจะไม่มาก แต่เป็นหนี้ที่ดอกเบี้ยสูงที่สุดและกดดันครัวเรือนมากที่สุด จึงเป็นเป้าหมายแรกของการแก้หนี้`
    : '';

  /* ── ค่าใช้จ่ายตามขนาดครัวเรือน ── */
  const ey=[...new Set(H.expense.map(x=>x.y))].sort((a,b)=>b-a)[0];
  const EX=H.expense.filter(x=>x.y===ey&&x.k==='ค่าใช้จ่ายทั้งสิ้นต่อเดือน');
  const sizes=EX.map(x=>x.size);
  mk('cSize',{type:'bar',data:{labels:sizes,
    datasets:[{label:'ค่าใช้จ่ายรวม (บาท/เดือน)',data:EX.map(x=>x.v),backgroundColor:cv('--coral'),borderRadius:6,barPercentage:.66}]},
    options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>f(c.raw,0)+' บาท/เดือน'}}},
      scales:{x:ax({grid:{display:false},ticks:{font:{size:10}}}),y:ax({ticks:{callback:v=>f(v/1000,0)+'K'}})}}});
  document.getElementById('tSize').innerHTML=`<thead><tr><th>ขนาดครัวเรือน</th><th class="r">ค่าใช้จ่ายรวม</th>
    <th class="r">อุปโภคบริโภค</th><th class="r">ไม่ใช่การบริโภค</th></tr></thead><tbody>`+
    sizes.map(sz=>{const g=k=>{const r=H.expense.find(x=>x.y===ey&&x.size===sz&&x.k===k);return r?r.v:null};
      return `<tr><td>${sz}</td><td class="r">${f(g('ค่าใช้จ่ายทั้งสิ้นต่อเดือน'),0)}</td>
        <td class="r">${f(g('ค่าใช้จ่ายเพื่อการอุปโภคบริโภค'),0)}</td>
        <td class="r">${f(g('ค่าใช้จ่ายที่ไม่เกี่ยวกับการอุปโภคบริโภค'),0)}</td></tr>`}).join('')+'</tbody>';

  /* ── การกระจายค่าใช้จ่าย ── */
  const py=[...new Set(H.poverty.map(x=>x.y))].sort((a,b)=>b-a)[0];
  const PV=H.poverty.filter(x=>x.y===py);
  mk('cDist',{type:'bar',data:{labels:PV.map(x=>x.t),
    datasets:[{label:'ร้อยละของครัวเรือน',data:PV.map(x=>x.v),
      backgroundColor:PV.map((x,i)=>i<2?cv('--coral'):i<4?cv('--gold'):cv('--brand')),borderRadius:6,barPercentage:.72}]},
    options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw.toFixed(1)+'% ของครัวเรือน'}}},
      scales:{x:ax({grid:{display:false},ticks:{font:{size:9.5},maxRotation:40}}),y:ax({ticks:{callback:v=>v+'%'}})}}});
  const lowCnt=PV.slice(0,3).reduce((a,b)=>a+b.v,0);
  document.getElementById('distNote').innerHTML=
    `ครัวเรือนที่มีค่าใช้จ่ายต่ำกว่า 5,000 บาทต่อเดือนมีราว <b>${lowCnt.toFixed(1)}%</b> (ข้อมูลปี ${py})
     กลุ่มนี้คือครัวเรือนเปราะบางที่สุด มาตรการลดค่าครองชีพจะเห็นผลกับกลุ่มนี้มากที่สุด`;
}

DS.init('household',function(){
  renderHouse();
  onYearChange('hYear',function(v){HY=+v;renderHouse()});
});
</script>
</body>
