<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<script>
const P=DX.pop;
const AMP6=['เมืองหนองบัวลำภู','ศรีบุญเรือง','นากลาง','โนนสัง','สุวรรณคูหา','นาวัง'];
const BAND_ORDER=['0 ถึง 4 ปี','5 ถึง 9 ปี','10 ถึง 14 ปี','15 ถึง 19 ปี','20 ถึง 24 ปี','25 ถึง 29 ปี',
  '30 ถึง 34 ปี','35 ถึง 39 ปี','40 ถึง 44 ปี','45 ถึง 49 ปี','50 ถึง 54 ปี','55 ถึง 59 ปี',
  '60 ถึง 64 ปี','65 ถึง 69 ปี','70 ถึง 74 ปี','75 ถึง 79 ปี','80 ปี และมากกว่า'];
const bandVal=b=>P.ageBands[b]||0;
const ageOf=b=>parseInt(b)||0;

function renderPop(){
  const YS=Object.keys(P.popSeries).map(Number).sort((a,b)=>a-b);
  const lastY=YS[YS.length-1], firstY=YS[0];
  const popNow=P.popSeries[lastY], popFirst=P.popSeries[firstY];
  const male=AMP6.reduce((a,x)=>a+((P.popByAmpSex[x]||{})['ชาย']||0),0);
  const female=AMP6.reduce((a,x)=>a+((P.popByAmpSex[x]||{})['หญิง']||0),0);
  const bY=Object.keys(P.birth).map(Number).sort((a,b)=>a-b);
  const bLast=bY[bY.length-1];
  const birth=P.birth[bLast], death=P.death[bLast];
  const houses=Object.values(P.houses).reduce((a,b)=>a+b,0);
  const mv=P.move[String(bLast)]||{};
  /* โครงสร้างอายุ */
  const totalBand=BAND_ORDER.reduce((a,b)=>a+bandVal(b),0)||1;
  const kids=BAND_ORDER.filter(b=>ageOf(b)<15).reduce((a,b)=>a+bandVal(b),0);
  const work=BAND_ORDER.filter(b=>ageOf(b)>=15&&ageOf(b)<60).reduce((a,b)=>a+bandVal(b),0);
  const old=BAND_ORDER.filter(b=>ageOf(b)>=60).reduce((a,b)=>a+bandVal(b),0);
  const dep=((kids+old)/work*100);

  document.getElementById('v-population').innerHTML=`
  <div class="ph"><div class="t" style="display:flex;gap:14px;align-items:flex-start">
    <span class="bigico icow img" data-bigico="population"></span>
    <span><h2>ประชากรและโครงสร้างอายุ</h2>
    <p>ประชากรคือฐานของทุกตัวเลขเศรษฐกิจ จังหวัดกำลังเข้าสู่ภาวะประชากรลดลงและสังคมสูงวัย ซึ่งกระทบกำลังแรงงานและกำลังซื้อในระยะยาว</p></span></div>
    <div class="r"><span class="chip real">ข้อมูลจริง</span><span class="chip br">ปี ${lastY}</span></div></div>

  <div class="grid g6 mb" id="pKpi"></div>

  <div class="secthead"><span class="sn">1</span><b>จำแนกรายปี</b>
    <span>การเปลี่ยนแปลงของประชากรทั้งจังหวัดตลอด 7 ปี</span></div>

  <div class="grid g21 mb">

  <div class="grid g21 mb">

      <span class="r">
        <select class="sel" id="pyrScope">
          <optgroup label="ชายเทียบหญิง">

            ${AMP6.map(a=>`<option value="S|${a}">อำเภอ${a} · ชายเทียบหญิง</option>`).join('')}
          </optgroup>
          <optgroup label="เทียบแบบอื่น">
            <option value="Z|PROV">ทั้งจังหวัด · ในเขตเทียบนอกเขตเทศบาล</option>
          </optgroup>
        </select>
        ${viewToggle('cAge')}</span></header>
      <div class="b">
        <div id="playerBox"></div>
        <div id="cAge-chart"><div id="pyrBox"></div></div>
        <div id="cAge-table" class="hide"><div class="sc" style="max-height:380px"><table class="t" id="tAge"></table></div></div>
        <div class="note" id="ageNote"></div>

    <div class="c"><header><span class="hdico icow img">${icoImg('dependency',26)}</span><h3>สัดส่วนวัย</h3></header>

        <div id="depBox" style="margin-top:10px"></div></div></div>

  <div class="secthead"><span class="sn">3</span><b>จำแนกรายอำเภอ</b>
    <span>เปรียบเทียบประชากร ครัวเรือน และการย้ายถิ่นระหว่าง 6 อำเภอ</span></div>

  <div class="grid g21 mb">
    <div class="c"><header><span class="hdico icow img">${icoImg('district',26)}</span><h3>ประชากรรายอำเภอ</h3><span class="u">แยกชายและหญิง</span>
      <span class="r">${viewToggle('cAmp')}</span></header>
      <div class="b">
        <div id="cAmp-chart"><div class="ch"><canvas id="cAmp"></canvas></div></div>
        <div id="cAmp-table" class="hide"><div class="sc"><table class="t" id="tAmp"></table></div></div>
        <div class="note" id="ampNote"></div>
      </div></div>
    <div class="c"><header><span class="hdico icow img">${icoImg('migration',26)}</span><h3>การย้ายถิ่น</h3>
      <span class="u">ย้ายเข้าและย้ายออก</span></header>
      <div class="b"><div class="ch"><canvas id="cMove"></canvas></div>
        <div class="note" id="moveNote"></div></div></div>
  </div>

  <div class="c mb"><header><span class="hdico icow img">${icoImg('area',26)}</span>
    <h3>แผนที่ประชากรรายอำเภอ</h3><span class="u">เฉดสีเข้ม = มาก · เฉดสีอ่อน = น้อย</span>
    <span class="r"><select class="sel" id="mapMetric">
      <option value="pop">ประชากรรวม</option>
      <option value="male">ประชากรชาย</option>
      <option value="female">ประชากรหญิง</option>
      <option value="house">จำนวนบ้าน</option>
      <option value="perhouse">ประชากรต่อบ้าน</option>
      <option value="density">สัดส่วนของประชากรทั้งจังหวัด</option>
    </select></span></header>
    <div class="b">
      <div id="popMap"></div>
      <div class="note" id="popMapNote"></div>
    </div></div>

  <div class="c"><header><span class="hdico icow img">${icoImg('source',26)}</span><h3>แหล่งข้อมูลและหน่วยงานผู้รับผิดชอบ</h3></header>
    <div class="b">${srcBar(['popreg'],'ข้อมูลทะเบียนราษฎร ณ สิ้นปี ครอบคลุมจำนวนประชากรรายอำเภอแยกเพศ โครงสร้างอายุ การเกิด การตาย การย้ายถิ่น และจำนวนบ้าน')}</div></div>`;

  /* ── KPI ── */
  const natural=birth-death;
  function sexTop(sex){
    let best={n:'—',v:0};
    AMP6.forEach(x=>{const v=(P.popByAmpSex[x]||{})[sex]||0; if(v>best.v)best={n:x,v}});
    return best;
  }
  document.getElementById('pKpi').innerHTML=[
    kpiCard({icon:'people',img:'population',color:cv('--brand'),label:'ประชากรทั้งจังหวัด',
      value:f(popNow,0),unit:'คน',
      chip:chip(pctc(popNow,P.popSeries[YS[YS.length-2]]))+' '+statusBadge(pctc(popNow,P.popSeries[YS[YS.length-2]]),false,'ประชากรเทียบปีก่อน'),
      sub:'ลดลง '+f(popFirst-popNow,0)+' คน จากปี '+firstY,
      tip:tipOf({t:'จำนวนประชากรทั้งจังหวัด',
        d:'นับจากทะเบียนราษฎร ณ สิ้นปี ไม่ใช่จากการสำรวจ จึงเป็นตัวเลขที่ใช้อ้างอิงทางราชการ',
        calc:'ผลรวมประชากรชายและหญิงทั้ง 6 อำเภอ',src:'popreg',when:'ปี '+lastY})}),
    kpiCard({icon:'people',img:'male',color:cv('--blue'),label:'ประชากรชาย',value:f(male,0),unit:'คน',
      chip:'<span class="chip">'+(male/(male+female)*100).toFixed(2)+'% ของประชากร</span>',
      sub:'มากที่สุดที่อำเภอ'+sexTop('ชาย').n+' '+f(sexTop('ชาย').v,0)+' คน',
      tip:tipOf({t:'ประชากรชาย',
        d:'จำนวนผู้มีชื่อในทะเบียนราษฎรเพศชายรวมทั้ง 6 อำเภอ',
        calc:'(ชาย ÷ ประชากรทั้งหมด) × 100 = ('+f_num(male)+' ÷ '+f_num(male+female)+') × 100 · น้อยกว่าหญิง '+f_num(female-male)+' คน',
        src:'popreg',when:'ปี '+lastY})}),
    kpiCard({icon:'people',img:'female',color:cv('--lotus')||cv('--plum'),label:'ประชากรหญิง',value:f(female,0),unit:'คน',
      chip:'<span class="chip">'+(female/(male+female)*100).toFixed(2)+'% ของประชากร</span>',
      sub:'มากที่สุดที่อำเภอ'+sexTop('หญิง').n+' '+f(sexTop('หญิง').v,0)+' คน',
      tip:tipOf({t:'ประชากรหญิง',
        d:'จำนวนผู้มีชื่อในทะเบียนราษฎรเพศหญิงรวมทั้ง 6 อำเภอ · สูงกว่าชายตามอายุคาดเฉลี่ยที่ยาวกว่า ใช้วางแผนบริการสาธารณสุขและสวัสดิการผู้สูงอายุ',
        calc:'(หญิง ÷ ประชากรทั้งหมด) × 100 = ('+f_num(female)+' ÷ '+f_num(male+female)+') × 100 · อัตราส่วนเพศ = ชาย '+(male/female*100).toFixed(1)+' คนต่อหญิง 100 คน',
        src:'popreg',when:'ปี '+lastY})}),
    kpiCard({icon:'people',img:'birth',color:cv('--leaf'),label:'เด็กเกิดใหม่',value:f(birth,0),unit:'คน',
      chip:chip(pctc(birth,P.birth[bY[bY.length-2]]))+' '+statusBadge(pctc(birth,P.birth[bY[bY.length-2]]),false,'จำนวนเด็กเกิดใหม่เทียบปีก่อน'),
      sub:'ปี '+bLast+' · ลดลงจาก '+f(P.birth[bY[0]],0)+' คนในปี '+bY[0],
      tip:tipOf({t:'จำนวนเด็กเกิดใหม่',
        d:'จำนวนการเกิดที่แจ้งต่อนายทะเบียนในรอบปี · ลดลงต่อเนื่องทุกปี เป็นสัญญาณว่ากำลังแรงงานในอนาคตจะหดตัว',
        calc:'นับจากใบแจ้งเกิดที่บันทึกในระบบทะเบียนราษฎร',src:'popreg',when:'ปี '+bLast})}),
    kpiCard({icon:'chart',img:'natural',color:natural<0?cv('--bad'):cv('--good'),label:'การเปลี่ยนแปลงตามธรรมชาติ',
      value:(natural>0?'+':'')+f(natural,0),unit:'คน',
      chip:'<span class="chip '+(natural<0?'dn':'up')+'">'+(natural<0?'ตายมากกว่าเกิด':'เกิดมากกว่าตาย')+'</span>',
      sub:'เกิด '+f(birth,0)+' · ตาย '+f(death,0),
      tip:tipOf({t:'การเปลี่ยนแปลงประชากรตามธรรมชาติ',
        d:'ผลต่างระหว่างการเกิดกับการตาย ไม่รวมการย้ายถิ่น · ค่าติดลบแปลว่าประชากรลดลงเองแม้ไม่มีใครย้ายออก',
        calc:'จำนวนเกิด − จำนวนตาย = '+f(birth,0)+' − '+f(death,0),src:'popreg',when:'ปี '+bLast})}),
    kpiCard({icon:'brief',img:'dependency',color:cv('--gold'),label:'อัตราพึ่งพิง',value:dep.toFixed(1),unit:'%',
      chip:'<span class="chip fl">วัยทำงาน '+(work/totalBand*100).toFixed(1)+'%</span>',
      sub:'ผู้สูงอายุ '+(old/totalBand*100).toFixed(1)+'% · เด็ก '+(kids/totalBand*100).toFixed(1)+'%',
      tip:tipOf({t:'อัตราส่วนพึ่งพิง (Dependency ratio)',
        d:'บอกว่าวัยทำงาน 100 คนต้องดูแลเด็กและผู้สูงอายุกี่คน ยิ่งสูงยิ่งเป็นภาระต่อกำลังแรงงาน',
        calc:'((เด็กต่ำกว่า 15 ปี + ผู้สูงอายุ 60 ปีขึ้นไป) ÷ วัยทำงาน 15–59 ปี) × 100',
        src:'popreg',when:'ปี '+P.ageYear})})
  ].join('');

  /* ── ประชากรรายปี ── */
  mk('cPop',{data:{labels:YS.map(y=>'ปี '+y),datasets:[
    {type:'line',label:'ประชากร (คน)',data:YS.map(y=>P.popSeries[y]),borderColor:cv('--brand'),
      backgroundColor:cv('--brand')+'22',borderWidth:2.8,pointRadius:4,pointBackgroundColor:cv('--brand'),tension:.25,fill:true}]},
    options:{plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c=>f(c.raw,0)+' คน',
        footer:it=>{const i=it[0].dataIndex;if(!i)return'';
          const d=P.popSeries[YS[i]]-P.popSeries[YS[i-1]];
          return (d<0?'ลดลง ':'เพิ่มขึ้น ')+f(Math.abs(d),0)+' คนจากปีก่อน'}}}},
      scales:{x:ax({grid:{display:false}}),y:ax({ticks:{callback:v=>f(v,0)}})}}});
  document.getElementById('tPop').innerHTML=`<thead><tr><th>ปี</th><th class="r">ประชากร</th><th class="r">เปลี่ยนแปลง</th><th class="r">%</th></tr></thead><tbody>`+
    YS.map((y,i)=>{const d=i?P.popSeries[y]-P.popSeries[YS[i-1]]:null;
      return `<tr><td>ปี ${y}</td><td class="r">${f(P.popSeries[y],0)}</td>
        <td class="r" style="color:${d<0?'var(--bad)':'var(--good)'}">${d!=null?((d>0?'+':'')+f(d,0)):'—'}</td>
        <td class="r">${d!=null?((d/P.popSeries[YS[i-1]]*100).toFixed(2)+'%'):'—'}</td></tr>`}).join('')+'</tbody>';
  document.getElementById('popNote').innerHTML=
    `ประชากรลดลงต่อเนื่องจาก ${f(popFirst,0)} คนในปี ${firstY} เหลือ <b>${f(popNow,0)} คน</b> ในปี ${lastY}
     หายไป ${f(popFirst-popNow,0)} คนใน ${lastY-firstY} ปี เฉลี่ยปีละ ${f((popFirst-popNow)/(lastY-firstY),0)} คน
     ทุกนโยบายที่วางบนสมมติฐานประชากรคงที่ต้องทบทวนใหม่`;

  /* ── เกิด ตาย ── */
  mk('cBD',{data:{labels:bY.map(y=>'ปี '+y),datasets:[
    {type:'bar',label:'เกิด',data:bY.map(y=>P.birth[y]),backgroundColor:cv('--leaf'),borderRadius:6,barPercentage:.72},
    {type:'bar',label:'ตาย',data:bY.map(y=>P.death[y]),backgroundColor:cv('--coral'),borderRadius:6,barPercentage:.72},
    {type:'line',label:'เกิด − ตาย',data:bY.map(y=>P.birth[y]-P.death[y]),borderColor:cv('--gold'),
      borderWidth:2.6,pointRadius:4,pointBackgroundColor:cv('--gold'),tension:.25}]},
    options:{interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{padding:11}},
      tooltip:{callbacks:{label:c=>c.dataset.label+' '+f(c.raw,0)+' คน'}}},
      scales:{x:ax({grid:{display:false}}),y:ax({ticks:{callback:v=>f(v,0)}})}}});
  const cross=bY.find(y=>P.death[y]>P.birth[y]);
  document.getElementById('bdNote').innerHTML=
    `จังหวัดมีคนตายมากกว่าคนเกิดตั้งแต่ปี <b>${cross}</b> เป็นต้นมา
     ปี ${bLast} เกิด ${f(birth,0)} คน แต่ตาย ${f(death,0)} คน ต่างกัน ${f(death-birth,0)} คน
     นี่คือสาเหตุหลักที่ประชากรลดลง ไม่ใช่การย้ายออกอย่างที่เข้าใจกัน`;

  /* ── ปิรามิดประชากร ── */
  buildPyramid();
  renderPopMap();
  /* กราฟแท่งช่วงอายุแบบเดิมถูกแทนที่ด้วยปิรามิดแล้ว
     โค้ดเดิมยังเขียนทับตาราง #tAge และคำอธิบาย #ageNote ของปิรามิดทุกครั้ง
     ตารางและคำอธิบายของปิรามิดจึงไม่เคยแสดงผลจริง ลบทิ้งทั้งบล็อก */

  /* ── สัดส่วนวัย ── */
  mk('cDep',{type:'doughnut',data:{labels:['เด็ก 0–14 ปี','วัยทำงาน 15–59 ปี','ผู้สูงอายุ 60 ปีขึ้นไป'],
    datasets:[{data:[kids,work,old],backgroundColor:[cv('--leaf'),cv('--brand'),cv('--coral')],
      borderColor:cv('--card'),borderWidth:3}]},
    options:{cutout:'58%',plugins:{legend:{position:'bottom',labels:{padding:10,font:{size:10.5}}},
      tooltip:{callbacks:{label:c=>c.label+' '+f(c.raw,0)+' คน',
        footer:it=>(it[0].raw/totalBand*100).toFixed(1)+'% ของประชากร'}}}}});
  document.getElementById('depBox').innerHTML=[
    ['อัตราพึ่งพิงรวม',dep.toFixed(1)+'%','วัยทำงาน 100 คน ดูแล '+dep.toFixed(0)+' คน',cv('--gold')],
    ['สัดส่วนผู้สูงอายุ',(old/totalBand*100).toFixed(1)+'%',(old/totalBand>=0.2?'เข้าสู่สังคมสูงวัยอย่างสมบูรณ์แล้ว':'ใกล้เข้าสู่สังคมสูงวัยสมบูรณ์'),cv('--coral')]
  ].map(r=>`<div class="mini" style="margin-bottom:9px"><div class="l">${r[0]}</div>
      <div class="v" style="color:${r[3]}">${r[1]}</div>
      <div style="font-size:11px;color:var(--faint);margin-top:3px">${r[2]}</div></div>`).join('');

  /* ── รายอำเภอ ── */
  const rows=AMP6.map(a=>({a,m:(P.popByAmpSex[a]||{})['ชาย']||0,f:(P.popByAmpSex[a]||{})['หญิง']||0}))
    .sort((x,y)=>(y.m+y.f)-(x.m+x.f));
  mk('cAmp',{type:'bar',data:{labels:rows.map(r=>r.a),datasets:[
    {label:'ชาย',data:rows.map(r=>r.m),backgroundColor:cv('--blue'),borderRadius:5,stack:'s'},
    {label:'หญิง',data:rows.map(r=>r.f),backgroundColor:cv('--lotus')||cv('--plum'),borderRadius:5,stack:'s'}]},
    options:{plugins:{legend:{position:'bottom',labels:{padding:11}},
      tooltip:{callbacks:{label:c=>c.dataset.label+' '+f(c.raw,0)+' คน',
        footer:it=>{const r=rows[it[0].dataIndex];return 'รวม '+f(r.m+r.f,0)+' คน · บ้าน '+f(P.houses[r.a]||0,0)+' หลัง'}}}},
      scales:{x:ax({grid:{display:false},stacked:true,ticks:{font:{size:10}}}),
        y:ax({stacked:true,ticks:{callback:v=>f(v/1000,0)+'K'}})}}});
  document.getElementById('tAmp').innerHTML=`<thead><tr><th>อำเภอ</th><th class="r">ชาย</th><th class="r">หญิง</th>
    <th class="r">รวม</th><th class="r">บ้าน (หลัง)</th><th class="r">คน/หลัง</th></tr></thead><tbody>`+
    rows.map(r=>{const h=P.houses[r.a]||0,t=r.m+r.f;
      return `<tr><td>${r.a}</td><td class="r">${f(r.m,0)}</td><td class="r">${f(r.f,0)}</td>
        <td class="r" style="font-weight:600">${f(t,0)}</td><td class="r">${f(h,0)}</td>
        <td class="r">${h?(t/h).toFixed(2):'—'}</td></tr>`}).join('')+
    `</tbody><tfoot><tr><td>รวม</td><td class="r">${f(male,0)}</td><td class="r">${f(female,0)}</td>
      <td class="r">${f(male+female,0)}</td><td class="r">${f(houses,0)}</td>
      <td class="r">${((male+female)/houses).toFixed(2)}</td></tr></tfoot>`;
  document.getElementById('ampNote').innerHTML=
    `<b>${rows[0].a}</b> มีประชากรมากที่สุด ${f(rows[0].m+rows[0].f,0)} คน คิดเป็น ${((rows[0].m+rows[0].f)/(male+female)*100).toFixed(1)}% ของจังหวัด
     ทั้งจังหวัดมีบ้าน ${f(houses,0)} หลัง เฉลี่ย ${((male+female)/houses).toFixed(2)} คนต่อหลัง
     ซึ่งต่ำกว่าค่าเฉลี่ยประเทศ สะท้อนว่าครัวเรือนมีขนาดเล็กลงและมีบ้านว่างจากการย้ายถิ่น`;

  /* ── ย้ายถิ่น ── */
  const mY=Object.keys(P.move).map(Number).sort((a,b)=>a-b);
  mk('cMove',{data:{labels:mY.map(y=>'ปี '+y),datasets:[
    {type:'bar',label:'ย้ายเข้า',data:mY.map(y=>P.move[y]['ย้ายเข้า']),backgroundColor:cv('--brand'),borderRadius:5},
    {type:'bar',label:'ย้ายออก',data:mY.map(y=>P.move[y]['ย้ายออก']),backgroundColor:cv('--coral'),borderRadius:5},
    {type:'line',label:'สุทธิ',data:mY.map(y=>P.move[y]['ย้ายเข้า']-P.move[y]['ย้ายออก']),
      borderColor:cv('--gold'),borderWidth:2.4,pointRadius:4,tension:.25}]},
    options:{interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{padding:11,font:{size:10}}},
      tooltip:{callbacks:{label:c=>c.dataset.label+' '+f(c.raw,0)+' คน'}}},
      scales:{x:ax({grid:{display:false}}),y:ax({ticks:{callback:v=>f(v/1000,0)+'K'}})}}});
  const net=(mv['ย้ายเข้า']||0)-(mv['ย้ายออก']||0);
  document.getElementById('moveNote').innerHTML=
    `ปี ${bLast} ย้ายเข้า ${f(mv['ย้ายเข้า']||0,0)} คน ย้ายออก ${f(mv['ย้ายออก']||0,0)} คน สุทธิ ${net>=0?'+':''}${f(net,0)} คน
     การย้ายถิ่นเกือบสมดุล ต่างจากที่หลายคนเข้าใจ ประชากรที่ลดลงจึงมาจากการเกิดน้อยกว่าตายเป็นหลัก`;
}


/* ══════════ ปิรามิดประชากร ══════════
   โหมดหลักคือ ชาย (ซ้าย) เทียบ หญิง (ขวา) ในปีและพื้นที่ที่เลือก
   ต้องมีข้อมูล DX_PYR.sex ซึ่งเป็นจำนวนประชากรแยกเพศตามช่วงอายุ
   ถ้ายังไม่มี ระบบจะบอกตรง ๆ ว่ายังไม่มีข้อมูล และสลับไปโหมดในเขต/นอกเขตให้แทน
   รูปแบบข้อมูลที่ต้องเติมใน data2.js — ค่าทุกชุดต้องยาวเท่ากับ bands (17 ช่วง)
     DX_PYR.sex = { "2568": { "PROV": {"ชาย":[...17 ค่า...], "หญิง":[...17 ค่า...]},
                              "เมืองหนองบัวลำภู": {"ชาย":[...], "หญิง":[...]} } }
*/
const PYR=(typeof DX_PYR!=='undefined')?DX_PYR:null;
const PYR_SEX=(PYR&&PYR.sex)?PYR.sex:null;
let PYR_MODE='S', PYR_AREA='PROV', PYR_YEAR=null;
const pyrYears=()=>PYR?PYR.years:[];
const pyrZero=()=>PYR.bands.map(()=>0);
function sexAt(y,area){
  if(!PYR_SEX)return null;
  const box=PYR_SEX[y]||PYR_SEX[String(y)];
  if(!box)return null;
  const rec=box[area]||(area==='PROV'?box['PROV']||box['ทั้งจังหวัด']:null);
  if(!rec||!rec['ชาย']||!rec['หญิง'])return null;
  return rec;
}
function sexYears(){
  if(!PYR_SEX)return [];
  return pyrYears().filter(y=>sexAt(y,PYR_AREA));
}
function pyrSeries(){
  if(PYR_MODE==='S'){
    const rec=sexAt(PYR_YEAR,PYR_AREA);
    if(!rec)return null;
    const where=PYR_AREA==='PROV'?'ทั้งจังหวัด':'อำเภอ'+PYR_AREA;
    return {left :{label:'ชาย · '+where+' · พ.ศ. '+PYR_YEAR, arr:rec['ชาย'],  color:'var(--blue)'},
            right:{label:'หญิง · '+where+' · พ.ศ. '+PYR_YEAR,arr:rec['หญิง'],color:'var(--lotus,#cf5f92)'}};
  }
  const z=PYR.zone[PYR_YEAR]||PYR.zone[String(PYR_YEAR)];
  if(!z)return null;
  return {left :{label:'ในเขตเทศบาล · พ.ศ. '+PYR_YEAR, arr:z.in, color:'var(--blue)'},
          right:{label:'นอกเขตเทศบาล · พ.ศ. '+PYR_YEAR,arr:z.out,color:'var(--lotus,#cf5f92)'}};
}
function buildPyramid(){
  if(!PYR){document.getElementById('pyrBox').innerHTML='<div class="svc-empty">ไม่พบข้อมูลโครงสร้างอายุรายปี</div>';return}
  const sc=document.getElementById('pyrScope');
  /* ถ้ายังไม่มีข้อมูลแยกเพศ ให้เริ่มที่โหมดในเขต/นอกเขตแทน จะได้ไม่เปิดมาเจอหน้าว่าง */
  if(!PYR_SEX&&PYR_MODE==='S'){PYR_MODE='Z';PYR_AREA='PROV';if(sc)sc.value='Z|PROV'}
  /* โหมดชายหญิงมีข้อมูลแค่บางปี ปุ่มเล่นจึงไล่เฉพาะปีที่มีจริง ไม่พาไปเจอหน้าว่าง */
  const YS=(PYR_MODE==='S'&&sexYears().length)?sexYears():pyrYears();
  if(PYR_YEAR==null||YS.indexOf(PYR_YEAR)<0)PYR_YEAR=YS[YS.length-1];
  const box=document.getElementById('playerBox');
  if(box){
    box.innerHTML=playerBar('pyrPlay',{
      frames:YS.map(y=>({label:'พ.ศ. '+y,short:String(y).slice(-2),y})),
      i:Math.max(0,YS.indexOf(PYR_YEAR)), ms:1500, hoverStop:'#pyrBox',
      onFrame:fr=>{PYR_YEAR=fr.y;drawPyramid()}
    });
    bindPlayer('pyrPlay',true);
  }
  if(sc&&!sc.dataset.b){sc.dataset.b='1';
    sc.addEventListener('change',()=>{
      const v=sc.value.split('|');
      PYR_MODE=v[0]; PYR_AREA=v[1]||'PROV';
      buildPyramid();
    });
  }
  drawPyramid();
}
function pyrEmpty(){
  const where=PYR_AREA==='PROV'?'ทั้งจังหวัด':'อำเภอ'+PYR_AREA;
  document.getElementById('pyrBox').innerHTML=
    `<div class="svc-empty" style="text-align:left;line-height:1.9">
      <b>ยังไม่มีข้อมูลประชากรแยกเพศตามช่วงอายุของ${where} ปี ${PYR_YEAR}</b><br>
      ข้อมูลที่ระบบมีตอนนี้คือจำนวนประชากรตามช่วงอายุรวมทั้งสองเพศ
      และจำนวนชายหญิงรวมทุกช่วงอายุ ยังไม่มีชุดที่ตัดขวางทั้งสองอย่างพร้อมกัน<br>
      ต้องขอจาก <b>ที่ทำการปกครองจังหวัดหนองบัวลำภู</b>
      เป็นรายงานทะเบียนราษฎรแบบแยกรายอายุและเพศ แล้วรวมเป็นช่วงอายุ 5 ปีทั้ง 17 ช่วง<br>
      ระหว่างนี้เลือก <b>ในเขตเทียบนอกเขตเทศบาล</b> จากช่องด้านบนเพื่อดูโครงสร้างอายุได้ตามปกติ</div>`;
  const tb=document.getElementById('tAge'); if(tb)tb.innerHTML='';
  const nt=document.getElementById('ageNote'); if(nt)nt.textContent='';
  const sub=document.getElementById('pyrSub'); if(sub)sub.textContent='รอข้อมูลแยกเพศตามช่วงอายุ';
}
function drawPyramid(){
  const B=PYR.bands, S=pyrSeries();
  if(!S){pyrEmpty();return}
  const tL=S.left.arr.reduce((a,b)=>a+b,0)||1, tR=S.right.arr.reduce((a,b)=>a+b,0)||1;
  const pctL=S.left.arr.map(v=>v/tL*100), pctR=S.right.arr.map(v=>v/tR*100);
  const mx=Math.max(...pctL,...pctR)||1;
  const old=(arr,t)=>arr.reduce((a,v,i)=>a+(ageOf(B[i])>=60?v:0),0)/t*100;
  const kid=(arr,t)=>arr.reduce((a,v,i)=>a+(ageOf(B[i])<15?v:0),0)/t*100;
  let h=`<div class="pyr">
    <div class="pyr-h">${S.left.label} · ${f(tL,0)} คน</div>
    <div class="pyr-h">ช่วงอายุ</div>
    <div class="pyr-h">${S.right.label} · ${f(tR,0)} คน</div>`;
  for(let i=B.length-1;i>=0;i--){
    const pa=pctL[i], pb=pctR[i], d=pb-pa;
    const tip=tipOf({t:B[i],
      d:S.left.label+' '+f(S.left.arr[i],0)+' คน ('+pa.toFixed(1)+'%) · '+
        S.right.label+' '+f(S.right.arr[i],0)+' คน ('+pb.toFixed(1)+'%)',
      calc:'สัดส่วน = จำนวนในช่วงอายุ ÷ ประชากรรวมของฝั่งนั้น × 100 · ผลต่างสองฝั่ง '+
        (d>0?'+':'')+d.toFixed(1)+' จุด · ความยาวแท่งเทียบกับช่วงอายุที่มีสัดส่วนสูงสุด '+mx.toFixed(1)+'%',
      src:'popreg',when:'พ.ศ. '+PYR_YEAR});
    h+=`<div class="pyr-row" data-tip2="${tip}">
      <div class="pyr-l"><span class="pyr-n">${pa.toFixed(1)}%</span>
        <i style="width:${(pa/mx*100).toFixed(1)}%;background:${S.left.color}"></i></div>
      <div class="pyr-b">${B[i].replace(' ปี','').replace('ถึง','–').replace(' และมากกว่า','+')}</div>
      <div class="pyr-r"><i style="width:${(pb/mx*100).toFixed(1)}%;background:${S.right.color}"></i>
        <span class="pyr-n">${pb.toFixed(1)}%</span></div></div>`;
  }
  h+=`</div><div class="pyr-legend">
    <span><i style="background:${S.left.color}"></i>${S.left.label}</span>
    <span><i style="background:${S.right.color}"></i>${S.right.label}</span>
    <span style="color:var(--faint)">แท่งยาวสุด = ${mx.toFixed(1)}% ของฝั่งนั้น</span></div>`;
  document.getElementById('pyrBox').innerHTML=h;
  const sub=document.getElementById('pyrSub');
  if(sub)sub.textContent=(PYR_MODE==='S'
      ?'ชายอยู่ฝั่งซ้าย หญิงอยู่ฝั่งขวา '+(PYR_AREA==='PROV'?'ทั้งจังหวัด':'อำเภอ'+PYR_AREA)
      :'ในเขตเทศบาลเทียบนอกเขตเทศบาล ทั้งจังหวัด')+
    ' · พ.ศ. '+PYR_YEAR+' · กดเล่นเพื่อไล่ปี';
  const tb=document.getElementById('tAge');
  if(tb)tb.innerHTML=`<thead><tr><th>ช่วงอายุ</th>
      <th class="r">${S.left.label}</th><th class="r">%</th>
      <th class="r">${S.right.label}</th><th class="r">%</th>
      <th class="r">รวม</th><th class="r">ผลต่าง</th></tr></thead><tbody>`+
    B.map((b,i)=>`<tr><td>${b}</td>
      <td class="r">${f(S.left.arr[i],0)}</td><td class="r">${pctL[i].toFixed(1)}%</td>
      <td class="r">${f(S.right.arr[i],0)}</td><td class="r">${pctR[i].toFixed(1)}%</td>
      <td class="r">${f(S.left.arr[i]+S.right.arr[i],0)}</td>
      <td class="r">${(pctR[i]-pctL[i]>0?'+':'')+(pctR[i]-pctL[i]).toFixed(1)}</td></tr>`).reverse().join('')+
    `</tbody><tfoot><tr><td>รวม</td><td class="r">${f(tL,0)}</td><td class="r">100.0%</td>
      <td class="r">${f(tR,0)}</td><td class="r">100.0%</td>
      <td class="r">${f(tL+tR,0)}</td><td></td></tr></tfoot>`;
  const ratio=tR?(tL/tR*100):0;
  document.getElementById('ageNote').innerHTML=
    `${S.left.label} มีผู้สูงอายุ 60 ปีขึ้นไป <b>${old(S.left.arr,tL).toFixed(1)}%</b>
     และเด็กต่ำกว่า 15 ปี ${kid(S.left.arr,tL).toFixed(1)}%<br>
     ${S.right.label} มีผู้สูงอายุ <b>${old(S.right.arr,tR).toFixed(1)}%</b>
     และเด็ก ${kid(S.right.arr,tR).toFixed(1)}%<br>`+
    (PYR_MODE==='S'
      ? `อัตราส่วนเพศ = ชาย ${ratio.toFixed(1)} คนต่อหญิง 100 คน
         ช่วงอายุที่ผลต่างสองฝั่งกว้างที่สุดมักเป็นกลุ่มสูงอายุ เพราะผู้หญิงมีอายุคาดเฉลี่ยยาวกว่า`
      : `ฐานปิรามิดที่แคบกว่ายอดคือสัญญาณว่าคนรุ่นใหม่เกิดน้อยกว่ารุ่นก่อน`)+
    `<br>ชี้เมาส์ที่แท่งจะหยุดเล่นชั่วคราวและแสดงตัวเลขจริง`;
}

/* ══════════ แผนที่ประชากรรายอำเภอ ══════════ */
const MAP_METRIC={
  pop     :{label:'ประชากรรวม',unit:'คน',dec:0,
            val:a=>((P.popByAmpSex[a]||{})['ชาย']||0)+((P.popByAmpSex[a]||{})['หญิง']||0),
            calc:'ผลรวมประชากรชายและหญิงของอำเภอนั้นตามทะเบียนราษฎร'},
  male    :{label:'ประชากรชาย',unit:'คน',dec:0,
            val:a=>(P.popByAmpSex[a]||{})['ชาย']||0,
            calc:'จำนวนผู้มีชื่อในทะเบียนราษฎรเพศชายของอำเภอนั้น'},
  female  :{label:'ประชากรหญิง',unit:'คน',dec:0,
            val:a=>(P.popByAmpSex[a]||{})['หญิง']||0,
            calc:'จำนวนผู้มีชื่อในทะเบียนราษฎรเพศหญิงของอำเภอนั้น'},
  house   :{label:'จำนวนบ้าน',unit:'หลัง',dec:0,
            val:a=>P.houses[a]||0,
            calc:'จำนวนบ้านที่มีเลขที่บ้านในทะเบียนราษฎร ณ สิ้นปี'},
  perhouse:{label:'ประชากรต่อบ้าน',unit:'คน/หลัง',dec:2,
            val:a=>{const p=((P.popByAmpSex[a]||{})['ชาย']||0)+((P.popByAmpSex[a]||{})['หญิง']||0);
                    const h=P.houses[a]||0; return h?p/h:0},
            calc:'ประชากรของอำเภอ ÷ จำนวนบ้านของอำเภอ · ค่าต่ำอาจแปลว่ามีบ้านว่างหรือคนย้ายออกไปทำงานต่างถิ่น'},
  density :{label:'สัดส่วนของประชากรทั้งจังหวัด',unit:'%',dec:2,
            val:a=>{const p=((P.popByAmpSex[a]||{})['ชาย']||0)+((P.popByAmpSex[a]||{})['หญิง']||0);
                    const t=AMP6.reduce((x,y)=>x+((P.popByAmpSex[y]||{})['ชาย']||0)+((P.popByAmpSex[y]||{})['หญิง']||0),0)||1;
                    return p/t*100},
            calc:'(ประชากรของอำเภอ ÷ ประชากรทั้งจังหวัด) × 100'}
};
let MAP_KEY='pop';
function renderPopMap(){
  const m=MAP_METRIC[MAP_KEY];
  const rows=AMP6.map(a=>({name:a,value:m.val(a)}));
  const sorted=rows.slice().sort((a,b)=>b.value-a.value);
  const hi=sorted[0], lo=sorted[sorted.length-1];
  drawAmpChoropleth('popMap',rows,{unit:m.unit,dec:m.dec,height:400,
    tipOf:r=>tipOf({t:m.label+' · อำเภอ'+r.name,d:'หน่วยวัด '+m.unit,
      calc:m.calc,src:'popreg',when:'ปี '+P.popYear})});
  const note=document.getElementById('popMapNote');
  if(note)note.innerHTML=
    `${m.label} สูงสุดที่อำเภอ<b>${hi.name}</b> ${f(hi.value,m.dec)} ${m.unit}
     ต่ำสุดที่อำเภอ<b>${lo.name}</b> ${f(lo.value,m.dec)} ${m.unit}
     ห่างกัน ${f(hi.value-lo.value,m.dec)} ${m.unit}<br>
     ข้อมูลทะเบียนราษฎร ปี ${P.popYear} · ชี้ที่อำเภอเพื่อดูตัวเลข กดที่พื้นที่เพื่อเปิดรายละเอียด`;
  const sel=document.getElementById('mapMetric');
  if(sel&&!sel.dataset.b){sel.dataset.b='1';
    sel.addEventListener('change',()=>{MAP_KEY=sel.value;renderPopMap()})}
}

DS.init('population',renderPop);
