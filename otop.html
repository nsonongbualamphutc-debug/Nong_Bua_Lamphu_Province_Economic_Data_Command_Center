<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OTOP และเศรษฐกิจชุมชน · ศูนย์บัญชาการข้อมูลเศรษฐกิจ จังหวัดหนองบัวลำภู</title>
<meta name="theme-color" content="#0b3c32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds.css">
</head>
<body>
<div id="tip"></div>
<div class="app" id="app">
  <header class="top" id="topbar"></header>
  <nav class="side" id="sidebar"></nav>
  <main class="main">
    <section class="view on" id="v-otop"></section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="data2.js"></script>
<script src="ds.js"></script>
<script>
const O=DX.otop;
const AMP6=['เมืองหนองบัวลำภู','ศรีบุญเรือง','นากลาง','โนนสัง','สุวรรณคูหา','นาวัง'];
const yearsOf=o=>Object.keys(o.revByYear).map(Number).sort((a,b)=>a-b);
let SEL_YEAR=null;

function totalRev(y){return Object.values(O.revByYear[y]||{}).reduce((a,b)=>a+b,0)}
function fy(fyNo){return O.revMonthly.filter(x=>x.fy===fyNo)}

function renderOtop(){
  const YS=yearsOf(O), last=YS[YS.length-1], prev=YS[YS.length-2];
  if(SEL_YEAR===null)SEL_YEAR=last;
  const rev=totalRev(last), revPrev=totalRev(prev);
  const prodTot=Object.values(O.prodByType).reduce((a,b)=>a+b,0);
  const star5=Object.values(O.star5).reduce((a,b)=>a+b,0);
  const shops=Object.values(O.shops).reduce((a,b)=>a+b,0);
  const vich=Object.values(O.vichalai||{}).reduce((a,b)=>a+b,0);
  const M=fy(2569);

  document.getElementById('v-otop').innerHTML=`
  <div class="ph"><div class="t" style="display:flex;gap:14px;align-items:flex-start">
    <span class="bigico icow img" data-bigico="otop"></span>
    <span><h2>OTOP และเศรษฐกิจชุมชน</h2>
    <p>รายได้จากผลิตภัณฑ์ชุมชนคือเงินที่ไหลถึงครัวเรือนโดยตรง ไม่ผ่านคนกลาง เป็นเครื่องยนต์เศรษฐกิจฐานรากที่จังหวัดควบคุมได้เอง</p></span></div>
    <div class="r"><span class="chip real">ข้อมูลจริง</span>
      <select class="sel" id="otopYear">${yearsOf(O).slice().reverse().map(y=>`<option value="${y}"${y===SEL_YEAR?' selected':''}>ปี ${y}</option>`).join('')}</select></div></div>

  <div class="grid g5 mb" id="oKpi"></div>

  <div class="grid g21 mb">
    <div class="c"><header><h3>รายได้จากผลิตภัณฑ์ OTOP รายปี</h3><span class="u">ล้านบาท · ${YS[0]}–${last}</span>
      <span class="r">${viewToggle('cRev')}</span></header>
      <div class="b">
        <div id="cRev-chart"><div class="ch lg"><canvas id="cRev"></canvas></div></div>
        <div id="cRev-table" class="hide"><div class="sc" style="max-height:330px"><table class="t" id="tRev"></table></div></div>
        <div class="note" id="revNote"></div>
      </div></div>
    <div class="c"><header><h3>รายได้รายเดือน ปีงบประมาณ 2569</h3><span class="u">ล้านบาท</span></header>
      <div class="b"><div class="ch lg"><canvas id="cMon"></canvas></div>
        <div class="note" id="monNote"></div></div></div>
  </div>

  <div class="grid g3 mb">
    <div class="c"><header><h3>รายได้รายอำเภอ</h3><span class="u">ปี <b id="yLab">${SEL_YEAR}</b> · ล้านบาท</span></header>
      <div class="b"><div id="ampBars"></div>
        <div class="note" id="ampNote"></div></div></div>
    <div class="c"><header><h3>ผลิตภัณฑ์จำแนกตามประเภท</h3><span class="u">ปี ${O.prodYear} · ${prodTot} ชนิด</span>
      <span class="r">${viewToggle('cType')}</span></header>
      <div class="b">
        <div id="cType-chart"><div class="ch"><canvas id="cType"></canvas></div></div>
        <div id="cType-table" class="hide"><div class="sc"><table class="t" id="tType"></table></div></div>
      </div></div>
    <div class="c"><header><h3>ลักษณะผู้ประกอบการ</h3><span class="u">${f(O.entTotal,0)} ราย</span></header>
      <div class="b"><div id="entBox"></div>
        <div class="note">ผู้ประกอบการ OTOP ในระบบทั้งหมด ${f(O.entTotal,0)} ราย กระจายทุกอำเภอ กลุ่มที่มีสัดส่วนสูงสุดคือกลุ่มผู้ผลิตชุมชน ซึ่งเป็นรูปแบบที่กระจายรายได้ได้กว้างที่สุด</div></div></div>
  </div>

  <div class="grid g2 mb">
    <div class="c"><header><h3>ศักยภาพผลิตภัณฑ์รายอำเภอ</h3>
      <span class="u">ผลิตภัณฑ์ 5 ดาว · ร้านค้าชุมชน · แหล่งเรียนรู้วิชชาลัย</span>
      <span class="r">${viewToggle('cCap')}</span></header>
      <div class="b">
        <div id="cCap-chart"><div class="ch lg"><canvas id="cCap"></canvas></div></div>
        <div id="cCap-table" class="hide"><div class="sc"><table class="t" id="tCap"></table></div></div>
        <div class="note" id="capNote"></div>
      </div></div>
    <div class="c"><header><h3>รายได้ OTOP เทียบกับภาคเศรษฐกิจอื่น</h3><span class="u">ล้านบาทต่อปี</span></header>
      <div class="b"><div class="ch lg"><canvas id="cCmp"></canvas></div>
        <div class="note" id="cmpNote"></div></div></div>
  </div>

  <div class="c"><header><h3>แหล่งข้อมูลและหน่วยงานผู้รับผิดชอบ</h3></header>
    <div class="b">${srcBar(['otop'],'ชุดข้อมูลเผยแพร่ผ่านบัญชีข้อมูลจังหวัดหนองบัวลำภู (gdcatalog) · ครอบคลุมรายได้รายปีและรายเดือน ผลิตภัณฑ์จำแนกตามประเภท ผู้ประกอบการ ร้านค้าชุมชน ผลิตภัณฑ์ระดับ 5 ดาว และแหล่งเรียนรู้วิชชาลัย')}</div></div>`;

  /* ── KPI ── */
  document.getElementById('oKpi').innerHTML=[
    kpiCard({icon:'coin',img:'otop',color:cv('--brand'),label:'รายได้ OTOP ปี '+last,
      value:f(rev/1e6,0),unit:'ลบ.',chip:chip(pctc(rev,revPrev)),
      sub:'เทียบปี '+prev+' · '+f(revPrev/1e6,0)+' ลบ.',
      tip:'รายได้จากผลิตภัณฑ์ OTOP|ยอดจำหน่ายผลิตภัณฑ์ชุมชนทั้งจังหวัดในรอบปี|ที่มา: สำนักงานพัฒนาชุมชนจังหวัดหนองบัวลำภู'}),
    kpiCard({icon:'people',color:cv('--gold'),label:'ผู้ประกอบการ',value:f(O.entTotal,0),unit:'ราย',
      chip:'<span class="chip">ทุกอำเภอ</span>',sub:'ลงทะเบียนในระบบ OTOP'}),
    kpiCard({icon:'cart',color:cv('--leaf'),label:'ผลิตภัณฑ์',value:f(prodTot,0),unit:'ชนิด',
      chip:'<span class="chip">ปี '+O.prodYear+'</span>',sub:'5 ประเภทผลิตภัณฑ์'}),
    kpiCard({icon:'chart',img:'otopstar',color:cv('--plum'),label:'ผลิตภัณฑ์ระดับ 5 ดาว',value:f(star5,0),unit:'รายการ',
      chip:'<span class="chip up">คุณภาพสูงสุด</span>',sub:'ปี '+O.star5Year,
      tip:'ผลิตภัณฑ์ระดับ 5 ดาว|ผ่านการคัดสรรสุดยอดหนึ่งตำบลหนึ่งผลิตภัณฑ์ระดับประเทศ|เป็นกลุ่มที่พร้อมผลักเข้าตลาดนอกจังหวัดและออนไลน์ทันที'}),
    kpiCard({icon:'brief',color:cv('--blue'),label:'ร้านค้าชุมชน',value:f(shops,0),unit:'แห่ง',
      chip:'<span class="chip">วิชชาลัย '+vich+' แห่ง</span>',sub:'ปี '+O.shopYear})
  ].join('');

  /* ── รายได้รายปี ── */
  const revs=YS.map(y=>+(totalRev(y)/1e6).toFixed(1));
  mk('cRev',{data:{labels:YS.map(y=>'ปี '+y),datasets:[
    {type:'bar',label:'รายได้ (ล้านบาท)',data:revs,
      backgroundColor:YS.map(y=>y===SEL_YEAR?cv('--brand'):cv('--brand')+'99'),borderRadius:7,barPercentage:.65,yAxisID:'y'},
    {type:'line',label:'เปลี่ยนแปลง %YoY',data:revs.map((v,i)=>i?+((v-revs[i-1])/revs[i-1]*100).toFixed(1):null),
      borderColor:cv('--gold'),borderWidth:2.4,pointRadius:4,pointBackgroundColor:cv('--gold'),tension:.3,yAxisID:'y2'}]},
    options:{interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom',labels:{padding:11}},
        tooltip:{callbacks:{footer:it=>{const i=it[0].dataIndex;
          return 'เฉลี่ยเดือนละ '+f(revs[i]/12,1)+' ล้านบาท'}}}},
      scales:{x:ax({grid:{display:false}}),
        y:ax({ticks:{callback:v=>f(v,0)}}),
        y2:{position:'right',grid:{display:false},border:{display:false},ticks:{callback:v=>v+'%',font:{size:9.5}}}}}});
  document.getElementById('tRev').innerHTML=`<thead><tr><th>ปี</th><th class="r">รายได้ (ลบ.)</th><th class="r">%YoY</th>
    ${AMP6.map(a=>`<th class="r">${a.replace('เมืองหนองบัวลำภู','เมือง')}</th>`).join('')}</tr></thead><tbody>`+
    YS.map((y,i)=>`<tr><td>${y}</td><td class="r">${f(revs[i],1)}</td>
      <td class="r">${i?((revs[i]-revs[i-1])/revs[i-1]*100).toFixed(1)+'%':'—'}</td>
      ${AMP6.map(a=>`<td class="r">${f((O.revByYear[y][a]||0)/1e6,1)}</td>`).join('')}</tr>`).join('')+'</tbody>';
  const g=(revs[revs.length-1]-revs[0])/revs[0]*100;
  document.getElementById('revNote').innerHTML=
    `รายได้ OTOP เติบโตจาก ${f(revs[0],0)} ล้านบาทในปี ${YS[0]} เป็น ${f(revs[revs.length-1],0)} ล้านบาทในปี ${last}
     หรือ <b>เพิ่มขึ้น ${g.toFixed(0)}%</b> ในรอบ ${YS.length-1} ปี เฉลี่ยปีละ ${(g/(YS.length-1)).toFixed(1)}%
     ถือเป็นภาคที่โตต่อเนื่องที่สุดภาคหนึ่งของจังหวัด`;

  /* ── รายเดือน ── */
  const mv=M.map(x=>+(x.v/1e6).toFixed(1));
  mk('cMon',{type:'bar',data:{labels:M.map(x=>x.label),
    datasets:[{label:'รายได้ (ล้านบาท)',data:mv,
      backgroundColor:mv.map(v=>v>=Math.max(...mv)*0.95?cv('--gold'):cv('--brand')),borderRadius:6,barPercentage:.7}]},
    options:{plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c=>f(c.raw,1)+' ล้านบาท',
        footer:it=>'คิดเป็น '+(it[0].raw/mv.reduce((a,b)=>a+b,0)*100).toFixed(1)+'% ของยอดสะสมปีงบประมาณนี้'}}},
      scales:{x:ax({grid:{display:false},ticks:{font:{size:9.5}}}),y:ax({ticks:{callback:v=>f(v,0)}})}}});
  const best=M[mv.indexOf(Math.max(...mv))], sum=mv.reduce((a,b)=>a+b,0);
  document.getElementById('monNote').innerHTML=
    `สะสม ${M.length} เดือนแรกของปีงบประมาณ 2569 ได้ <b>${f(sum,0)} ล้านบาท</b>
     เดือนที่ทำรายได้สูงสุดคือ <b>${best.label}</b> ที่ ${f(best.v/1e6,1)} ล้านบาท
     ข้อมูลรายเดือนช่วยให้วางแผนจัดงานแสดงสินค้าและช่วงโปรโมตได้ตรงจังหวะ`;

  renderAmp();

  /* ── ประเภทผลิตภัณฑ์ ── */
  const T=Object.entries(O.prodByType).sort((a,b)=>b[1]-a[1]);
  mk('cType',{type:'doughnut',data:{labels:T.map(r=>r[0]),
    datasets:[{data:T.map(r=>r[1]),backgroundColor:PAL(),borderColor:cv('--card'),borderWidth:3}]},
    options:{cutout:'56%',plugins:{legend:{position:'bottom',labels:{padding:9,font:{size:10.5}}},
      tooltip:{callbacks:{label:c=>c.label+' '+c.raw+' ชนิด',
        footer:it=>(it[0].raw/prodTot*100).toFixed(1)+'% ของผลิตภัณฑ์ทั้งหมด'}}}}});
  document.getElementById('tType').innerHTML=`<thead><tr><th>ประเภท</th><th class="r">ชนิด</th><th class="r">สัดส่วน</th></tr></thead><tbody>`+
    T.map(r=>`<tr><td>${r[0]}</td><td class="r">${r[1]}</td><td class="r">${(r[1]/prodTot*100).toFixed(1)}%</td></tr>`).join('')+
    `</tbody><tfoot><tr><td>รวม</td><td class="r">${prodTot}</td><td class="r">100.0%</td></tr></tfoot>`;

  /* ── ลักษณะผู้ประกอบการ ── */
  const E=Object.entries(O.entByType||{}).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const eMax=E.length?E[0][1]:1;
  document.getElementById('entBox').innerHTML=E.map((r,i)=>`<div class="barrow">
    <span class="nm">${r[0]}</span><span class="tr"><i style="width:${(r[1]/eMax*100).toFixed(0)}%;background:${PAL()[i%7]}"></i></span>
    <span class="vv">${f(r[1],0)}</span></div>`).join('');

  /* ── ศักยภาพรายอำเภอ ── */
  mk('cCap',{type:'bar',data:{labels:AMP6.map(a=>a.replace('เมืองหนองบัวลำภู','เมือง')),datasets:[
    {label:'ผลิตภัณฑ์ 5 ดาว',data:AMP6.map(a=>O.star5[a]||0),backgroundColor:cv('--gold'),borderRadius:5},
    {label:'ร้านค้าชุมชน',data:AMP6.map(a=>O.shops[a]||0),backgroundColor:cv('--brand'),borderRadius:5},
    {label:'แหล่งเรียนรู้วิชชาลัย',data:AMP6.map(a=>(O.vichalai||{})[a]||0),backgroundColor:cv('--blue'),borderRadius:5}]},
    options:{plugins:{legend:{position:'bottom',labels:{padding:11,font:{size:10}}}},
      scales:{x:ax({grid:{display:false},ticks:{font:{size:10}}}),y:ax({type:'logarithmic',ticks:{callback:v=>f(v,0)}})}}});
  document.getElementById('tCap').innerHTML=`<thead><tr><th>อำเภอ</th><th class="r">รายได้ (ลบ.)</th>
    <th class="r">5 ดาว</th><th class="r">ร้านค้าชุมชน</th><th class="r">วิชชาลัย</th><th class="r">ผลิตภัณฑ์</th></tr></thead><tbody>`+
    AMP6.map(a=>`<tr><td>${a}</td><td class="r">${f((O.revByYear[SEL_YEAR][a]||0)/1e6,1)}</td>
      <td class="r">${O.star5[a]||0}</td><td class="r">${f(O.shops[a]||0,0)}</td>
      <td class="r">${(O.vichalai||{})[a]||0}</td><td class="r">${O.prodByAmp[a]||0}</td></tr>`).join('')+'</tbody>';
  const topStar=AMP6.slice().sort((a,b)=>(O.star5[b]||0)-(O.star5[a]||0))[0];
  document.getElementById('capNote').innerHTML=
    `<b>${topStar}</b> มีผลิตภัณฑ์ระดับ 5 ดาวมากที่สุด ${O.star5[topStar]||0} รายการ
     อำเภอที่มีร้านค้าชุมชนมากแต่ผลิตภัณฑ์ 5 ดาวน้อย คือกลุ่มที่ควรได้รับการพัฒนาคุณภาพก่อน
     เพราะมีช่องทางขายพร้อมแล้ว ขาดเพียงสินค้าที่ยกระดับได้`;

  /* ── เทียบภาคอื่น ── */
  const cropValue=D.crop.rows.reduce((a,r)=>a+(r.price?r.y*r.price:0),0)/1e6;
  const cmp=[['OTOP',rev/1e6,cv('--brand')],
             ['มูลค่าผลผลิตพืชอายุสั้น',cropValue,cv('--leaf')],
             ['เม็ดเงินงบประมาณที่เบิกจ่าย',D.fiscal.fn.dis[0].val,cv('--gold')],
             ['GPP ภาคเกษตร',(DX.agri2.gppAgri.slice(-1)[0]||{}).v||0,cv('--blue')]];
  mk('cCmp',{type:'bar',data:{labels:cmp.map(r=>r[0]),
    datasets:[{data:cmp.map(r=>+r[1].toFixed(0)),backgroundColor:cmp.map(r=>r[2]),borderRadius:6,barThickness:22}]},
    options:{indexAxis:'y',plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c=>f(c.raw,0)+' ล้านบาท'}}},
      scales:{x:ax({ticks:{callback:v=>f(v,0)}}),y:ax({grid:{display:false},ticks:{font:{size:11}}})}}});
  document.getElementById('cmpNote').innerHTML=
    `รายได้ OTOP ${f(rev/1e6,0)} ล้านบาท มีขนาดใกล้เคียงกับมูลค่าผลผลิตพืชอายุสั้นทั้งจังหวัด
     ต่างกันตรงที่ OTOP เป็นรายได้ที่ผ่านการแปรรูปแล้ว จึงเหลือกำไรอยู่ในชุมชนมากกว่าการขายผลผลิตดิบ
     การเพิ่มสัดส่วน OTOP จึงเป็นทางลัดที่สุดในการยกรายได้ครัวเรือน`;

  applyEditMode();
}

function renderAmp(){
  const vals=O.revByYear[SEL_YEAR]||{};
  const rows=AMP6.map(a=>({a,v:(vals[a]||0)/1e6})).sort((x,y)=>y.v-x.v);
  const mx=rows[0].v||1, tot=rows.reduce((a,b)=>a+b.v,0);
  document.getElementById('ampBars').innerHTML=rows.map((r,i)=>`<div class="barrow">
      <span class="nm">${r.a}</span>
      <span class="tr"><i style="width:${(r.v/mx*100).toFixed(0)}%;background:${i===0?cv('--brand'):cv('--brand')+'99'}"></i></span>
      <span class="vv">${f(r.v,1)}</span></div>`).join('');
  const yl=document.getElementById('yLab'); if(yl)yl.textContent=SEL_YEAR;
  document.getElementById('ampNote').innerHTML=
    `<b>${rows[0].a}</b> ทำรายได้สูงสุด ${f(rows[0].v,1)} ล้านบาท คิดเป็น ${(rows[0].v/tot*100).toFixed(1)}% ของทั้งจังหวัด
     ขณะที่ <b>${rows[rows.length-1].a}</b> ต่ำสุดที่ ${f(rows[rows.length-1].v,1)} ล้านบาท
     ช่องว่างระหว่างอำเภอสูงสุดกับต่ำสุดอยู่ที่ ${f(rows[0].v-rows[rows.length-1].v,1)} ล้านบาท`;
}

DS.init('otop',function(){
  renderOtop();
  const sel=document.getElementById('otopYear');
  if(sel)sel.onchange=function(){SEL_YEAR=+sel.value;renderOtop();
    const s2=document.getElementById('otopYear'); if(s2)s2.onchange=sel.onchange;};
});
</script>
</body>
</html>
