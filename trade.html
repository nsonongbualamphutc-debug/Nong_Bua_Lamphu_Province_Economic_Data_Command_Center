/* ── หน้าการค้าและค่าครองชีพ ── */
.tr-yr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 14px}
.tr-yr .sl-lab{display:inline-flex;align-items:center;gap:6px}
.tr-yr .sl-lab img{width:18px;height:18px}
.tr-yr .yinfo{margin-left:auto;font-size:11.5px;color:var(--faint)}
.tr-sub{font-size:12px;color:var(--faint);margin:-2px 16px 0;padding-left:37px}
.tr-ch{height:300px;position:relative}
.tr-hl{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--dim)}
.tr-hl b{font-family:var(--fn);color:var(--ink)}

.tp-ban{position:relative;border-radius:var(--r);overflow:hidden;background:#0b3c32 center 60%/cover;min-height:128px;
  display:flex;align-items:flex-end;gap:16px;padding:18px 20px;color:#fff;flex-wrap:wrap}
.tp-ban:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,38,30,.86) 0%,rgba(6,38,30,.55) 55%,rgba(6,38,30,.25) 100%)}
.tp-ban>*{position:relative}
.tp-ban .tt b{display:block;font-family:var(--fd);font-size:21px;font-weight:600;line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.tp-ban .tt span{font-size:12px;color:#c4e3d6}
.tp-pick{margin-left:auto;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:9px 12px;display:flex;flex-direction:column;gap:5px;min-width:240px}
.tp-pick label{font-size:11.5px;color:#d9efe6;display:flex;align-items:center;gap:6px}
.tp-pick select{font:inherit;font-size:13.5px;font-weight:600;border:0;border-radius:9px;padding:6px 10px;background:#fff;color:#10231e;cursor:pointer}
.tp-pick small{font-size:11px;color:#cfe8de}

.tp-kpis{display:grid;grid-template-columns:1fr 1fr 2fr;gap:13px}
.tp-sum{border-radius:18px;padding:16px 18px;display:flex!important;flex-direction:row!important;gap:16px;align-items:center;min-height:100%;--kpi:#2f6fc0}
.tp-sum .ic{width:62px;height:62px;flex:none;border-radius:16px;background:color-mix(in srgb,#2f6fc0 12%,var(--card));display:grid;place-items:center}
.tp-sum .ic img{width:44px;height:44px;object-fit:contain}
.tp-sum .l{font-size:12.5px;color:var(--dim)}
.tp-sum b{display:block;font-family:var(--fd);font-size:22px;font-weight:600;line-height:1.3;margin:2px 0 4px;color:#2f6fc0}
.tp-sum p{margin:0;font-size:12px;line-height:1.65;color:var(--dim);max-width:62ch}
.tp-sum .bars{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tp-sum .bars span{font-size:11px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim)}
.tp-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tp-act{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.tp-act button{font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  color:var(--dim);border-radius:10px;padding:6px 12px;cursor:pointer}
.tp-act button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tp-act button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-l);font-weight:600}
.tp-act button:hover{border-color:var(--brand)}

.tp-pills{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.tp-pills button{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--card2);color:var(--dim);border-radius:999px;padding:3px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.tp-pills button img{width:16px;height:16px;object-fit:contain}
.tp-pills button.on{color:#fff;font-weight:600;border-color:var(--pc);background:var(--pc)}
.tp-cap{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:6px}
.tp-cap b{font-family:var(--fn);color:var(--ink)}

.tp-tb>header{border-radius:var(--r) var(--r) 0 0;padding:12px 16px 10px!important;margin:-1px -1px 0;background:var(--hc);align-items:center!important}
.tp-tb>header h3{color:#fff}
.tp-tb>header .u{color:rgba(255,255,255,.85)}
.tp-tb>header .hdico{background:rgba(255,255,255,.92);border-radius:8px;width:30px!important;height:30px!important}
.tp-tb>header .hdico img{width:24px!important;height:24px!important}
.tp-tb>header .pdot{border-color:#fff}
.tp-tb{display:flex;flex-direction:column}.tp-tb .tp-more{margin-top:auto;padding-bottom:10px}
.tp-t{width:100%;border-collapse:collapse;font-size:12.5px}
.tp-t th{font-size:11.5px;font-weight:600;color:var(--dim);text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card2)}
.tp-t th:first-child{text-align:left}
.tp-t td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--fn);white-space:nowrap}
.tp-t td:first-child{text-align:left;font-family:var(--fs);white-space:normal}
.tp-t tr:last-child td{border-bottom:0}
.tp-t .nm{display:flex;gap:7px;align-items:flex-start}
.tp-t .nm .rowico{margin-top:1px}
.tp-t .nm b{font-weight:600;display:block;line-height:1.3}
.tp-t .nm small{display:block;font-size:10.5px;color:var(--faint);line-height:1.35}
.tp-t td.now{font-weight:700;color:var(--ink)}
.tp-t .na{color:var(--faint)}
.tp-ch{display:inline-flex;align-items:center;gap:3px;font-weight:600}
.tp-ch.up{color:var(--good)}.tp-ch.dn{color:var(--bad)}.tp-ch.eq{color:var(--faint);font-weight:500}
.tp-more{display:flex;justify-content:center;padding:8px 0 2px}
.tp-more button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card2);color:var(--brand);border-radius:999px;padding:5px 16px;cursor:pointer;font-weight:600}
.tp-hist td.cur,.tp-hist th.cur{background:var(--brand-l)}
.tp-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
.tp-foot .lg{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
.tp-foot .lg span{display:inline-flex;gap:5px;align-items:center}
.tp-foot .lg i{font-style:normal;font-weight:700}
@media (max-width:1100px){.tp-kpis{grid-template-columns:1fr 1fr}.tp-kpis .tp-sum{grid-column:1/-1}}
@media (max-width:640px){
  .tp-kpis{grid-template-columns:1fr}
  .tp-pick{margin-left:0;width:100%}
  .tp-act{margin-left:0;width:100%}.tp-act button{flex:1;justify-content:center;padding:6px 8px;font-size:11.5px}
  .tp-ban .tt b{font-size:17px}
  .tr-yr .yinfo{margin-left:0;width:100%}
  .tr-sub{padding-left:0}
  .tp-sum b{font-size:19px}
  .tp-foot .lg{margin-left:0}
}
</style>

    [/มันสำปะหลัง.*ลานมัน/,'มันสำปะหลัง (ลานมัน)'],[/มันสำปะหลัง.*โรงแป้ง/,'มันสำปะหลัง (โรงแป้ง)'],
    [/ข้าวโพด.*ฝัก/,'ข้าวโพดเลี้ยงสัตว์ (ฝัก)'],[/ข้าวโพด.*เมล็ด.*14\.5/,'ข้าวโพดเลี้ยงสัตว์ (เมล็ด ชื้น 14.5%)'],[/ข้าวโพด.*เมล็ด/,'ข้าวโพดเลี้ยงสัตว์ (เมล็ด ชื้น 30%)'],
    [/สุกร.*เนื้อแดง/,'สุกรเนื้อแดง'],[/สุกร.*สามชั้น/,'สุกรสามชั้น'],[/เนื้อโค.*น่อง/,'เนื้อโค (เนื้อน่อง)'],
    [/ไก่.*ทั้งตัว/,'ไก่เนื้อ (ทั้งตัว)'],[/ไก่.*อก/,'ไก่เนื้อ (อก)'],[/ไก่.*(น่อง|สะโพก)/,'ไก่เนื้อ (น่องสะโพก)']];
  for(const [re,s] of M)if(re.test(n))return s;
  return n;
}
function detailN(n){const m=String(n).match(/\(([^)]+)\)/);return m&&!/^(ลานมัน|โรงแป้ง)$/.test(m[1])?m[1]:''}
function repMonths(dateStr){
  const d=new Date(dateStr+'T00:00:00'),m=d.getMonth(),y=d.getFullYear()+543;
  const pm=m===0?11:m-1,py=m===0?y-1:y;
  return {mo:TP_M[pm]+' '+String(py).slice(-2),yr:TP_M[pm]+' '+String(py-1).slice(-2)};
}
const shortDate=s=>{const d=new Date(s+'T00:00:00');return d.getDate()+' '+TP_M[d.getMonth()]};
function chgOf(r){
  if(r.now==null)return {k:'na'};
  if(r.chg!=null&&r.chg!==0)return {k:r.chg>0?'up':'dn',v:r.chg};
  if(r.chg===0||String(r.now)===String(r.prev))return {k:'eq'};
  const a=midOf(r.now),b=midOf(r.prev);
  if(a!=null&&b!=null&&a!==b)return {k:a>b?'up':'dn',v:+(a-b).toFixed(2)};
  return {k:'eq'};
}
function chgHtml(r){
  const c=chgOf(r);
  if(c.k==='na')return '<span class="tp-ch eq">—</span>';
  if(c.k==='eq')return '<span class="tp-ch eq">↔ 0</span>';
  const v=Math.abs(c.v),t=Number.isInteger(v)?f_num(v):f(v,2);
  return c.k==='up'?`<span class="tp-ch up">▲ +${t}</span>`:`<span class="tp-ch dn">▼ −${t}</span>`;
}
/* ป้ายค่าบนจุดของกราฟ */
const lblPlug={id:'trLbl',afterDatasetsDraw(c){
  const ctx=c.ctx;
  c.data.datasets.forEach((d,i)=>{
    if(!d.lbl)return;const m=c.getDatasetMeta(i);if(m.hidden)return;
    m.data.forEach((pt,j)=>{const v=d.data[j];if(v==null||pt.skip)return;
      if(innerWidth<640&&d.data.length>6&&j%2&&j!==d.data.length-1)return;const t=d.lbl(v,j);if(t==null)return;
      ctx.save();ctx.font=`600 ${innerWidth<640?10:11}px 'IBM Plex Sans','IBM Plex Sans Thai',sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      const y=pt.y+(d.lblPos==='below'?15:-14);
      ctx.lineWidth=3.2;ctx.strokeStyle=cv('--card');ctx.lineJoin='round';ctx.strokeText(t,pt.x,y);
      ctx.fillStyle=d.lblColor||d.borderColor;ctx.fillText(t,pt.x,y);ctx.restore()})})}};

function loadTrade(){
  fetch('data/trade.json?v='+(typeof CFG!=='undefined'&&CFG.build||Date.now()),{cache:'no-cache'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .catch(()=>TRADE_EMBED)
    .then(d=>{if(!d||!d.weekly)d=TRADE_EMBED;TR.data=d;if(!TR.credit)TR.credit=d.credit||[];
      const ys=d.cpi.map(x=>x.y);TR.year=TR.year||ys[ys.length-1];
      TR.rep=TR.rep||d.weekly[d.weekly.length-1].date;safeRender()})
    .catch(e=>{TR.err=e.message;safeRender()});
  GDC.all(CREDIT_ID).then(v=>{
    const o={};gdcRows(v).forEach(r=>{const y=gdcYear(r),x=pv(r);if(y&&x!=null)o[y]=x});
    const L=Object.keys(o).map(Number).sort((a,b)=>a-b).map(y=>({y,v:o[y]}));
    if(L.length){TR.credit=L;TR.cs='api';TR.creditAt=v.at||null}else TR.cs='fallback';
  }).catch(()=>{TR.cs='fallback'}).finally(()=>{if(TR.data&&!TR.credit.length)TR.credit=TR.data.credit||[];safeRender()});
}

  const lst=a=>a.length?a.slice(0,3).join(', ')+(a.length>3?` และอีก ${a.length-3} รายการ`:''):'ไม่มี';
  const kpis=`<div class="tp-kpis mb" id="tpKpi">
    ${kpiCard({icon:'chart',img:'priceup',bg:'inflation',color:cv('--brand'),label:'สินค้าที่ราคาสูงขึ้น',value:up,unit:'รายการ ▲',sim:false,
      chip:`<span class="chip">จากทั้งหมด ${n} รายการ</span>`,sub:lst(upN),
      tip:tipOf({t:'สินค้าที่ราคาสูงขึ้นจากสัปดาห์ก่อน',d:upN.join(' · ')||'ไม่มี',calc:'นับรายการที่ราคาสัปดาห์นี้สูงกว่าสัปดาห์ก่อน จากสินค้าที่มีราคา '+n+' รายการ',src:'cpi',when})})}
    ${kpiCard({icon:'chart',img:'pricedown',bg:'cpi',color:cv('--coral'),label:'สินค้าที่ราคาลดลง',value:dn,unit:'รายการ ▼',sim:false,
      chip:`<span class="chip">จากทั้งหมด ${n} รายการ</span>`,sub:lst(dnN),
      tip:tipOf({t:'สินค้าที่ราคาลดลงจากสัปดาห์ก่อน',d:dnN.join(' · ')||'ไม่มี',calc:'นับรายการที่ราคาสัปดาห์นี้ต่ำกว่าสัปดาห์ก่อน จากสินค้าที่มีราคา '+n+' รายการ',src:'cpi',when})})}
    <div class="tp-sum kpi hasbg">${cardBg('','trade-overall')}<span class="ic">${icoImg('pricegoods',44)}</span><div>
      <span class="l">ราคาสินค้าโดยรวม</span><b>${verdict}</b>
      <p>สินค้าส่วนใหญ่${eq>=n*.5?'':'ไม่'}ทรงตัว: ราคาไม่เปลี่ยนแปลง ${eq} รายการ · สูงขึ้น ${up} รายการ · ลดลง ${dn} รายการ จากสินค้าที่มีราคา ${n} รายการ</p>
      <div class="bars"><span>สินค้าเกษตร ▲ ${A.up} ▼ ${A.dn} ↔ ${A.eq}</span><span>สินค้าอุปโภคบริโภค ▲ ${C.up} ▼ ${C.dn} ↔ ${C.eq}</span></div></div></div>
  </div>`;
  const ico=(p)=>`<svg viewBox="0 0 24 24">${p}</svg>`;
  const bar=`<div class="tp-bar mb">
    <div class="segs" id="tpGrp">
      <button class="${TR.grp==='all'?'on':''}" data-g="all">ภาพรวมราคา</button>
      <button class="${TR.grp==='agri'?'on':''}" data-g="agri"><img class="segico" src="assets/icons/ic-agriprice.png" alt="" onerror="this.remove()">สินค้าเกษตร</button>
      <button class="${TR.grp==='cons'?'on':''}" data-g="cons"><img class="segico" src="assets/icons/ic-pricegoods.png" alt="" onerror="this.remove()">สินค้าอุปโภคบริโภค</button></div>
    <div class="tp-act">
      <button class="${TR.view==='trend'?'on':''}" data-tv="trend">${ico('<path d="M4 17l5-5 4 3 7-8"/><path d="M15 7h5v5"/>')}แนวโน้มราคา</button>
      <button class="${TR.view==='hist'?'on':''}" data-tv="hist">${ico('<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/>')}เปรียบเทียบย้อนหลัง</button>
      <button data-tdl="1">${ico('<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/>')}ดาวน์โหลดข้อมูล</button></div></div>`;
  const G=TR.grp==='all'?['agri','cons']:[TR.grp];
  const wide=G.length===1;
  /* กราฟแนวโน้ม */
  const trend=`<div class="grid ${wide?'':'g2'} mb">${G.map(g=>{
    const P=pillItems(g);if(!TR.pick[g]||!P.find(r=>r.n===TR.pick[g]))TR.pick[g]=P[0]&&P[0].n;
    return `<div class="c"><header><span class="hdico icow img" data-hdico="${GRP[g].ico}"></span><h3>แนวโน้ม${GRP[g].t.replace('ราคา','ราคา')}</h3><span class="u">${W.length} รายงานล่าสุด</span></header>
      <div class="b"><div class="tp-pills" style="--pc:${GRP[g].c}">${P.map(r=>`<button class="${r.n===TR.pick[g]?'on':''}" data-pg="${g}" data-pn="${r.n.replace(/"/g,'&quot;')}">${pIco(r.n)}${shortN(r.n)}</button>`).join('')}</div>
      <div class="tr-ch" style="height:${wide?300:270}px"><canvas id="cTp-${g}"></canvas></div>
      <div class="tp-cap" id="cap-${g}"></div></div></div>`}).join('')}</div>`;
  /* ตารางเทียบย้อนหลังทุกวันรายงาน */
  const hist=G.map(g=>`<div class="c mb tp-tb" style="--hc:${GRP[g].c}"><header><span class="hdico icow img">${icoImg(GRP[g].ico,24)}</span><h3>เปรียบเทียบย้อนหลัง · ${GRP[g].t}</h3><span class="u">${W.length} รายงาน · ${W[0].label} – ${W[W.length-1].label}</span></header>
    <div class="sc"><table class="tp-t tp-hist"><thead><tr><th>สินค้า</th>${W.map(w=>`<th class="${w.date===R.date?'cur':''}">${shortDate(w.date)}</th>`).join('')}</tr></thead>
    <tbody>${R[g].map((r,i)=>`<tr><td><div class="nm">${rowIco(r.n)}<span><b>${shortN(r.n)}</b><small>${r.u}</small></span></div></td>${W.map(w=>{const x=w[g][i];const t=x&&pTxt2(x.now);
      return `<td class="${w.date===R.date?'cur':''}">${t==null?'<span class="na">—</span>':t}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');
  /* ตารางราคาสัปดาห์นี้ */
  const tbl=`<div class="grid ${wide?'':'g2'} mb">${G.map(g=>{
    const all=R[g],sorted=all.filter(r=>r.now!=null).concat(all.filter(r=>r.now==null));
    const LIM=6,show=TR.more[g]?sorted:sorted.slice(0,LIM);
    return `<div class="c tp-tb" style="--hc:${GRP[g].c}"><header><span class="hdico icow img">${icoImg(GRP[g].ico,24)}</span><h3>${GRP[g].t}</h3><span class="u">${R.label}</span></header>
      <div class="sc"><table class="tp-t"><thead><tr><th>สินค้า</th><th>สัปดาห์นี้</th><th>สัปดาห์ก่อน</th><th>เปลี่ยนแปลง</th><th>เดือนก่อน (${mm.mo})</th><th>ปีก่อน (${mm.yr})</th></tr></thead>
      <tbody>${show.map(r=>{const dt=detailN(r.n);
        const tp=tipOf({t:r.n,d:'หน่วย '+r.u+(r.now!=null&&/[–-]/.test(String(r.now))?' · ราคาที่รายงานเป็นช่วงต่ำสุด–สูงสุดของท้องตลาด':''),src:'cpi',when});
        return `<tr data-tip2="${tp}"><td><div class="nm">${rowIco(r.n)}<span><b>${shortN(r.n)}</b><small>${dt?dt+' · ':''}${r.u}</small></span></div></td>
        <td class="now">${pTxt2(r.now)||'<span class="na">—</span>'}</td><td>${pTxt2(r.prev)||'<span class="na">—</span>'}</td><td>${chgHtml(r)}</td>
        <td>${pTxt2(r.mo)||'<span class="na">—</span>'}</td><td>${pTxt2(r.yr)||'<span class="na">—</span>'}</td></tr>`}).join('')}</tbody></table></div>
      ${sorted.length>LIM?`<div class="tp-more"><button data-tmore="${g}">${TR.more[g]?'ย่อรายการ':'ดูทั้งหมด ('+sorted.length+' รายการ)'}</button></div>`:''}</div>`}).join('')}</div>`;
  const opts=W.slice().reverse().map(w=>`<option value="${w.date}"${w.date===R.date?' selected':''}>${w.label}${w===W[W.length-1]?' (ล่าสุด)':''}</option>`).join('');
  return `<div class="tp-ban mb" style="background-image:url('assets/t-price.jpg')">
      <div class="tt"><b>ราคาสินค้าเกษตร และสินค้าอุปโภคบริโภค รายสัปดาห์</b><span>${(M.weekly&&M.weekly.ag)||'สำนักงานพาณิชย์จังหวัดหนองบัวลำภู'} · ${(M.weekly&&M.weekly.note)||''}</span></div>
      <div class="tp-pick"><label for="tpRep">${icoImg('history',16)}เลือกวันที่รายงาน</label>
        <select id="tpRep">${opts}</select><small>ข้อมูลล่าสุด ณ วันที่ ${W[W.length-1].label}</small></div></div>
    ${kpis}${bar}${TR.view==='hist'?hist:trend}${tbl}
    <div class="tp-foot"><span>ข้อมูล ณ วันที่ <b>${R.label}</b> · ${(M.weekly&&M.weekly.ag)||''} (ไฟล์)</span>
      <span class="lg"><span><i class="na">—</i> ไม่มีข้อมูล</span><span><i style="color:var(--good)">▲</i> ราคาเพิ่มขึ้น</span><span><i style="color:var(--bad)">▼</i> ราคาลดลง</span><span><i style="color:var(--faint)">↔</i> ราคาไม่เปลี่ยนแปลง</span></span></div>`;
}
function drawPrice(){
  if(TR.view!=='trend')return;
  const W=TR.data.weekly,R=curRep();
  (TR.grp==='all'?['agri','cons']:[TR.grp]).forEach(g=>{
    const name=TR.pick[g];if(!name)return;
    const idx=W[W.length-1][g].findIndex(r=>r.n===name);
    const pts=W.map(w=>w[g][idx]||{}),vals=pts.map(p=>midOf(p.now)),u=(pts.find(p=>p.u)||{}).u||'';
    const col=GRP[g].c,cur=W.findIndex(w=>w.date===R.date);
    const vv=vals.filter(v=>v!=null),mn=Math.min(...vv),mx=Math.max(...vv),pad=Math.max((mx-mn)*.35,mx*.03);
    mk('cTp-'+g,{type:'line',data:{labels:W.map(w=>shortDate(w.date)),datasets:[{label:shortN(name),data:vals,borderColor:col,
        backgroundColor:col+'22',fill:true,borderWidth:2.6,tension:.25,cubicInterpolationMode:'monotone',spanGaps:true,
        pointRadius:W.map((_,i)=>i===cur?7:4),pointBackgroundColor:W.map((_,i)=>i===cur?col:'#fff'),pointBorderColor:col,pointBorderWidth:2.2,
        lbl:(v,j)=>pTxt2(pts[j].now)}]},
      plugins:[lblPlug],
      options:{maintainAspectRatio:false,layout:{padding:{top:16,right:14,left:26}},plugins:{legend:{display:false},
          tooltip:{callbacks:{title:c=>W[c[0].dataIndex].label,label:c=>shortN(name)+' '+(pTxt2(pts[c.dataIndex].now)||'—')+' '+u}}},
        scales:{x:ax({grid:{display:false}}),y:ax({grace:'30%',beginAtZero:false,title:{display:true,text:u,font:{weight:'600'}},
          ticks:{maxTicksLimit:5,callback:v=>mx>=1000?f_num(Math.round(v)):f(v,mx<20?2:0)}})}}});
    const a=vals.find(v=>v!=null),b=vals[cur],mo=midOf(pts[cur].mo),yr=midOf(pts[cur].yr);
    const ch=(x,y)=>x!=null&&y?`<span class="tp-ch ${x>y?'up':x<y?'dn':'eq'}">${x>y?'▲ +':x<y?'▼ ':'↔ '}${f(pctc(x,y),1)}%</span>`:'—';
    const cap=document.getElementById('cap-'+g);
    if(cap)cap.innerHTML=`<span>หน่วย <b>${u}</b></span><span>เทียบรายงานแรก (${shortDate(W[0].date)}) ${ch(b,a)}</span><span>เทียบเดือนก่อน ${ch(b,mo)}</span><span>เทียบปีก่อน ${ch(b,yr)}</span>`;
  });
}
function downloadCsv(){
  const R=curRep(),mm=repMonths(R.date);
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const L=[['กลุ่ม','สินค้า','หน่วย','สัปดาห์นี้','สัปดาห์ก่อน','เปลี่ยนแปลง','เดือนก่อน ('+mm.mo+')','ปีก่อน ('+mm.yr+')'].map(q).join(',')];
  [['agri','สินค้าเกษตร'],['cons','สินค้าอุปโภคบริโภค']].forEach(([g,t])=>R[g].forEach(r=>{const c=chgOf(r);
    L.push([t,r.n,r.u,r.now,r.prev,c.k==='na'?'':c.k==='eq'?0:c.v,r.mo,r.yr].map(q).join(','))}));
  L.push('',q('ข้อมูล ณ วันที่ '+R.label+' · ที่มา '+((TR.data.meta.weekly||{}).ag||'')));
  const blob=new Blob(['﻿'+L.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ราคาสินค้ารายสัปดาห์_'+R.date+'.csv';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ── วาดหน้า ── */
function renderTradePage(){
  const v=document.getElementById('v-trade');
  const keep=v.querySelector(':scope>.pgbanner');
  if(!TR.data){
    v.innerHTML=headHtml()+`<div class="c"><div class="b" style="padding:30px;text-align:center;color:var(--faint)">${TR.err?'โหลดไฟล์ข้อมูล data/trade.json ไม่สำเร็จ ('+TR.err+') · ตรวจว่าอัปโหลดไฟล์ไว้ในโฟลเดอร์ data แล้ว จากนั้นโหลดหน้าใหม่':'กำลังโหลดข้อมูล…'}</div></div>`;
    if(keep)v.prepend(keep);return;
  }
  v.innerHTML=headHtml()+`<div id="trade-idx" class="${TR.tab==='idx'?'':'hide'}">${idxHtml()}</div>
    <div id="trade-price" class="${TR.tab==='price'?'':'hide'}">${priceHtml()}</div>`;
  if(keep)v.prepend(keep);
  if(TR.tab==='idx')drawIdx();else drawPrice();
  try{gdcLive('trade')}catch(e){}
  applyEditMode();
}
window.onSeg=function(w,btn){
  if(w.id==='tradeSeg'){TR.tab=btn.dataset.t;
    const a=document.getElementById('trade-idx'),b=document.getElementById('trade-price');
    if(!a||!b||!TR.data)return;   /* ข้อมูลยังโหลดไม่เสร็จ · จำแท็บไว้ วาดตอนข้อมูลมา */
    a.classList.toggle('hide',TR.tab!=='idx');b.classList.toggle('hide',TR.tab!=='price');
    if(TR.tab==='idx')drawIdx();else drawPrice();return}
  if(w.id==='tpGrp'){TR.grp=btn.dataset.g;safeRender()}
};
document.addEventListener('click',e=>{
  const y=e.target.closest('[data-ty]');if(y){TR.year=+y.dataset.ty;safeRender();return}
  const p=e.target.closest('[data-pg]');if(p){TR.pick[p.dataset.pg]=p.dataset.pn;
    p.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===p));drawPrice();return}
  const t=e.target.closest('[data-tv]');if(t){TR.view=t.dataset.tv;safeRender();return}
  const m=e.target.closest('[data-tmore]');if(m){TR.more[m.dataset.tmore]=!TR.more[m.dataset.tmore];safeRender();return}
  if(e.target.closest('[data-tdl]'))downloadCsv();
});
document.addEventListener('change',e=>{if(e.target.id==='tpRep'){TR.rep=e.target.value;safeRender()}});
DS.init('trade',renderTradePage);
loadTrade();
</script>
