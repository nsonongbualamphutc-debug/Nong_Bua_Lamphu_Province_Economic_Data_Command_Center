<style>
/* ══ สรุปผู้บริหาร 1 หน้า A4 ══
   ออกแบบให้พิมพ์ได้ 1 แผ่นพอดี และอ่านบนจอได้ด้วย · ทุกตัวเลขอ่านจากไฟล์ข้อมูลชุดเดียวกับแดชบอร์ด */
:root{--forest:#0b3c32;--brand:#0d9268;--gold:#b5851a;--ink:#14231f;--dim:#4d635b;--faint:#80938c;
  --line:#dde7e2;--soft:#f3f7f5;--good:#0d8a5f;--bad:#c34a33;--warn:#a87511}
*{box-sizing:border-box}
html,body{margin:0;background:#e8eeeb;color:var(--ink);font-family:'Sarabun','Kanit',system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tools{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;
  padding:10px 14px;background:#0b3c32;color:#fff;font-size:13px}
.tools a,.tools button,.tools select{font:inherit;border-radius:9px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);
  color:#fff;padding:7px 13px;cursor:pointer;text-decoration:none}
.tools select option{color:#000}
.tools .pri{background:#f0d79a;color:#0b3c32;border-color:#f0d79a;font-weight:600}
.sheet{width:210mm;min-height:297mm;margin:18px auto 40px;background:#fff;padding:9mm 11mm 7mm;
  box-shadow:0 20px 50px -25px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:3.2mm}
h1,h2,h3,b.k{font-family:'Kanit','Sarabun',sans-serif}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2.5px solid var(--forest);padding-bottom:2.2mm}
.top .t small{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.2px}
.top h1{margin:1mm 0 0;font-size:21px;line-height:1.2;color:var(--forest)}
.top h1 em{font-style:normal;color:var(--brand)}
.top .r{text-align:right;font-size:10.5px;color:var(--dim);line-height:1.6}
.top .r b{display:block;font-size:12.5px;color:var(--ink)}

.head{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:3mm}
.big{background:linear-gradient(135deg,#0b3c32,#0d6f52);color:#fff;border-radius:4mm;padding:3.5mm 4.5mm}
.big .l{font-size:11px;opacity:.85}
.big .v{font-family:'Kanit';font-size:31px;font-weight:700;line-height:1.1;margin:.5mm 0}
.big .s{font-size:11.5px;line-height:1.45}
.pil{border:1px solid var(--line);border-radius:4mm;padding:3mm 4mm;background:var(--soft)}
.pil .l{font-size:11.5px;font-weight:600;color:var(--forest)}
.pil .v{font-family:'Kanit';font-size:24px;font-weight:700;line-height:1.15}
.chips{display:flex;gap:1.5mm;flex-wrap:wrap;margin-top:1mm}
.ch{font-size:10px;font-weight:600;border-radius:999px;padding:.4mm 2.2mm;border:1px solid}
.ch em{font-style:normal;font-weight:400;opacity:.8;margin-left:1mm}
.ch.up{color:var(--good);background:#e4f4ec;border-color:#bfe3d0}
.ch.dn{color:var(--bad);background:#fbe9e4;border-color:#f0c4bb}
.ch.fl{color:var(--dim);background:#f1f4f3;border-color:#dde5e1}
.big .ch{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}

.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm}
.key{border:1px solid var(--line);border-left:3px solid var(--c,var(--brand));border-radius:3mm;padding:2.6mm 3.2mm}
.key .l{font-size:10.5px;color:var(--dim);line-height:1.35}
.key .v{font-family:'Kanit';font-size:20px;font-weight:700;line-height:1.2}
.key .v small{font-size:11px;font-weight:500;color:var(--dim);margin-left:.6mm}
.key .s{font-size:9.8px;color:var(--faint);line-height:1.35}

h2{font-size:13.5px;margin:0 0 1.5mm;color:var(--forest);display:flex;align-items:center;gap:2mm}
h2 i{display:inline-block;width:3px;height:13px;background:var(--gold);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:11px}
th{font-weight:600;color:var(--dim);font-size:10px;text-align:left;padding:1.3mm 2mm;border-bottom:1.5px solid var(--forest)}
td{padding:.95mm 2mm;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td .g{color:var(--faint);font-size:9.5px;margin-left:1mm}
tr.grp td{background:var(--soft);font-weight:600;font-size:10px;color:var(--forest);padding:.6mm 2mm}
.up{color:var(--good)} .dn{color:var(--bad)} .fl{color:var(--dim)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.box{border:1px solid var(--line);border-radius:3mm;padding:2.6mm 3.4mm}
.box ul{margin:0;padding-left:4.5mm;font-size:11px;line-height:1.45}
.box li b{font-family:'Kanit';font-weight:600}
.box.good{border-top:3px solid var(--good)} .box.bad{border-top:3px solid var(--bad)}
.ask{border:1px dashed #d9c08a;background:#fffaf0;border-radius:3mm;padding:2.6mm 3.4mm}
.ask ol{margin:0;padding-left:5mm;font-size:11px;line-height:1.45}
.ask .note{font-size:9.5px;color:var(--faint);margin-top:1mm}

.foot{margin-top:auto;display:flex;gap:4mm;align-items:center;border-top:1px solid var(--line);padding-top:2.5mm}
.foot .src{flex:1;font-size:9.3px;color:var(--dim);line-height:1.55}
.foot .src b{color:var(--ink)}
.foot .qr{width:20mm;text-align:center;font-size:8.5px;color:var(--dim)}
.foot .qr svg{width:20mm;height:20mm;display:block}

@media screen and (max-width:820px){
  .sheet{width:auto;min-height:0;margin:10px;padding:16px}
  .head,.keys,.two{grid-template-columns:1fr 1fr}
  .head .big{grid-column:1/-1}
}
@media screen and (max-width:520px){.keys,.two,.head{grid-template-columns:1fr}}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{background:#fff}
  .tools{display:none}
  .sheet{margin:0;box-shadow:none;width:210mm;height:297mm;min-height:0;overflow:hidden}
}
</style>
</head>
<body>
<div class="tools">
  <a href="overview.html">‹ กลับแดชบอร์ด</a>
  <span>เลือกเดือน</span><select id="selM"></select>
  <button class="pri" id="btnP">พิมพ์ / บันทึกเป็น PDF</button>
  <span style="opacity:.75">กระดาษ A4 แนวตั้ง · ตั้งค่าขอบกระดาษเป็น "ไม่มี" จะพอดีหน้าเดียว</span>
</div>
<div class="sheet" id="sheet"></div>

<script src="data1.js"></script>
<script src="data2.js"></script>
<script src="ds.js"></script>
<script>
/* ── ข้อมูล ── */
const BR_MAC=((DX.macro&&DX.macro.rows)||[]).slice().sort((a,b)=>(a.y-b.y)||(a.m-b.m));
const BR_W=(DX.macro&&DX.macro.weight)||{agri:21,indus:22,serv:57};
const THF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const lab=r=>TH_M[r.m-1]+' '+String(r.y).slice(-2);
const sg=(v,d)=>v==null||isNaN(v)?'—':(v>0?'+':'')+f(v,d==null?1:d);
const cls=v=>v==null?'fl':v>.15?'up':v<-.15?'dn':'fl';
const arr=v=>v==null?'':v>.15?'▲':v<-.15?'▼':'▬';
const bchip=(v,u,t)=>v==null?'':`<span class="ch ${cls(v)}">${arr(v)} ${sg(v)}${u}<em>${t}</em></span>`;
const supI=r=>(r.agri*BR_W.agri+r.indus*BR_W.indus+r.serv*BR_W.serv)/(BR_W.agri+BR_W.indus+BR_W.serv);
const demI=r=>(r.cons+r.invest+r.gov)/3;

let BR_I=BR_MAC.length-1;
(function(){const v=URLST.get('m'); if(v){const [y,m]=v.split('-').map(Number);const i=BR_MAC.findIndex(r=>r.y===y&&r.m===m);if(i>=0)BR_I=i}})();

function render(){
  const cur=BR_MAC[BR_I], prv=BR_MAC[BR_I-1]||null, py=BR_MAC[BR_I-12]||null;
  const F=D.fiscal, dis=F.fn.dis, G=REAL.gpp, gL=G.rows[G.rows.length-1];
  const gr=(G.growth||[]).find(x=>x.y===gL.y)||{};
  const nb=(G.ne&&G.ne.rows||[]).find(r=>r.n==='หนองบัวลำภู')||{};
  const nN=(G.ne&&G.ne.rows||[]).length;
  const ov=cur.overall, dem=demI(cur), sup=supI(cur);
  const say=ov>=5?'เศรษฐกิจจังหวัดขยายตัวชัดเจน':ov>=1?'เศรษฐกิจจังหวัดขยายตัวอย่างค่อยเป็นค่อยไป':ov>-1?'เศรษฐกิจจังหวัดทรงตัว':'เศรษฐกิจจังหวัดหดตัว';

  /* ตารางตัวชี้วัด */
  const IND=[
    ['ด้านอุปทาน'],
    ['agri','ภาคเกษตรกรรม','pct'],['indus','ภาคอุตสาหกรรม','pct'],['serv','ภาคบริการ','pct'],
    ['ด้านอุปสงค์'],
    ['cons','การบริโภคภาคเอกชน','pct'],['invest','การลงทุนภาคเอกชน','pct'],['gov','การใช้จ่ายภาครัฐ','pct'],
    ['การเงินและการจ้างงาน'],
    ['depo','เงินฝากรวม','lvl','ล้านบาท','depoY'],['cred','สินเชื่อรวม','lvl','ล้านบาท','credY'],['emp','การจ้างงานรวม','lvl','คน',null]
  ];
  const rowsH=IND.map(x=>{
    if(x.length===1)return `<tr class="grp"><td colspan="4">${x[0]}</td></tr>`;
    const [k,n,t,u,ky]=x;
    if(t==='pct'){
      const v=cur[k], d=prv?v-prv[k]:null;
      return `<tr><td>${n}</td><td class="r"><b class="${cls(v)}">${sg(v)}%</b></td>
        <td class="r ${cls(v)}">${arr(v)} ${sg(v)}%</td><td class="r ${cls(d)}">${arr(d)} ${sg(d)} จุด</td></tr>`;
    }
    const v=cur[k], yo=ky?cur[ky]:(py&&py[k]?(v-py[k])/py[k]*100:null), mo=prv&&prv[k]?(v-prv[k])/prv[k]*100:null;
    return `<tr><td>${n}</td><td class="r"><b>${f(v,0)}</b><span class="g">${u}</span></td>
      <td class="r ${cls(yo)}">${arr(yo)} ${sg(yo)}%</td><td class="r ${cls(mo)}">${arr(mo)} ${sg(mo)}%</td></tr>`;
  }).join('');

  /* จุดเด่น · จุดเฝ้าระวัง · คัดจาก 6 ตัวชี้วัดหลัก */
  const SIX=[['agri','ภาคเกษตรกรรม'],['indus','ภาคอุตสาหกรรม'],['serv','ภาคบริการ'],['cons','การบริโภคภาคเอกชน'],['invest','การลงทุนภาคเอกชน'],['gov','การใช้จ่ายภาครัฐ']]
    .map(([k,n])=>({k,n,v:cur[k],d:prv?cur[k]-prv[k]:null}));
  const good=SIX.filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,3);
  const bad=SIX.filter(x=>x.v<0).sort((a,b)=>a.v-b.v).slice(0,3);
  const swing=SIX.filter(x=>x.d!=null&&Math.abs(x.d)>=10).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  if(bad.length<2)swing.filter(x=>x.d<0&&!bad.includes(x)).slice(0,2-bad.length).forEach(x=>bad.push(Object.assign({slow:true},x)));

  /* ประเด็นที่ผู้บริหารน่าจะถาม · ระบบคัดจากตัวเลขที่ผิดปกติ ไม่ได้เดาสาเหตุ */
  const ask=[];
  swing.slice(0,2).forEach(x=>ask.push(`<b>${x.n}</b> ${x.d<0?'ชะลอลงแรง':'เร่งขึ้นแรง'} จาก ${sg(prv[x.k])}% เป็น ${sg(x.v)}% (${sg(x.d)} จุดในเดือนเดียว) — เกิดจากอะไร เป็นปัจจัยชั่วคราวหรือไม่`));
  if(nb.r_pc&&nb.r_pc>nN*2/3)ask.push(`<b>GPP ต่อหัว</b> ${f(nb.pc,0)} บาท อยู่อันดับ ${nb.r_pc} จาก ${nN} จังหวัดในภาคตะวันออกเฉียงเหนือ (ปี ${G.ne.year}) — แนวทางยกระดับรายได้ต่อหัว`);
  if(cur.depoY!=null&&cur.credY!=null&&cur.depoY>0&&cur.credY<0)ask.push(`<b>เงินฝากเพิ่มแต่สินเชื่อหด</b> (${sg(cur.depoY)}% กับ ${sg(cur.credY)}%) — สะท้อนความไม่มั่นใจในการลงทุนหรือการเข้าถึงสินเชื่อหรือไม่`);
  if(dis[0].pct<90)ask.push(`<b>การเบิกจ่ายงบประมาณ</b> ${f(dis[0].pct,2)}% ยังต่ำกว่าเกณฑ์ 90%`);

  const qrUrl=(()=>{const u=new URL('overview.html',location.href);u.searchParams.set('m',cur.y+'-'+String(cur.m).padStart(2,'0'));return u.toString()})();

  document.getElementById('sheet').innerHTML=`
  <div class="top">
    <div class="t"><small>ศูนย์บัญชาการข้อมูลเศรษฐกิจ จังหวัดหนองบัวลำภู · สรุปสำหรับผู้บริหาร</small>
      <h1>ภาวะเศรษฐกิจจังหวัดหนองบัวลำภู <em>${THF[cur.m-1]} ${cur.y}</em></h1></div>
    <div class="r"><b>ข้อมูล ณ ${CFG.asof}</b>พิมพ์เมื่อ ${new Date().toLocaleDateString('th-TH',{dateStyle:'long'})}</div>
  </div>

  <div class="head">
    <div class="big"><div class="l">ภาวะเศรษฐกิจรายเดือน · เทียบเดือนเดียวกันปีก่อน</div>
      <div class="v">${sg(ov)}%</div>
      <div class="s"><b>${say}</b></div>
      <div class="chips">${bchip(ov,'%','ปีก่อน')}${prv?bchip(ov-prv.overall,' จุด','เดือนก่อน'):''}</div></div>
    <div class="pil"><div class="l">ด้านอุปสงค์</div><div class="v ${cls(dem)}">${sg(dem)}%</div>
      <div class="chips">${bchip(dem,'%','ปีก่อน')}${prv?bchip(dem-demI(prv),' จุด','เดือนก่อน'):''}</div></div>
    <div class="pil"><div class="l">ด้านอุปทาน</div><div class="v ${cls(sup)}">${sg(sup)}%</div>
      <div class="chips">${bchip(sup,'%','ปีก่อน')}${prv?bchip(sup-supI(prv),' จุด','เดือนก่อน'):''}</div></div>
  </div>

  <div class="keys">
    <div class="key" style="--c:var(--brand)"><div class="l">การเบิกจ่ายงบประมาณภาพรวม</div>
      <div class="v">${f(dis[0].pct,2)}<small>%</small></div><div class="s">อันดับ ${dis[0].rank} ของประเทศ · สูงกว่าเป้า ${f(dis[0].over,2)} จุด</div></div>
    <div class="key" style="--c:var(--gold)"><div class="l">เม็ดเงินภาครัฐที่ลงสู่พื้นที่แล้ว</div>
      <div class="v">${f(dis[0].val,0)}<small>ล้านบาท</small></div><div class="s">คงเหลือรอเบิก ${f(dis[0].alloc-dis[0].val,0)} ล้านบาท</div></div>
    <div class="key" style="--c:#356aad"><div class="l">GPP ปี ${gL.y}${gL.note?' ('+gL.note+')':''}</div>
      <div class="v">${f(gL.value,1)}<small>ล้านบาท</small></div><div class="s">ขยายตัวจริง ${sg(gr.prov,2)}% · ประเทศ ${sg(gr.nat,2)}%</div></div>
    <div class="key" style="--c:#8a5aa8"><div class="l">GPP ต่อหัว ปี ${gL.y}</div>
      <div class="v">${f(gL.pc,0)}<small>บาท/คน/ปี</small></div><div class="s">อันดับ ${nb.r_pc||'—'} จาก ${nN} ในภาคอีสาน · ขยายตัวอันดับ ${nb.r_grow||'—'}</div></div>
  </div>

  <div><h2><i></i>ตัวชี้วัดเศรษฐกิจรายเดือน · ${lab(cur)}</h2>
    <table><thead><tr><th>ตัวชี้วัด</th><th class="r">เดือนนี้</th><th class="r">เทียบปีก่อน</th><th class="r">เทียบเดือนก่อน</th></tr></thead>
    <tbody>${rowsH}</tbody></table></div>

  <div class="two">
    <div class="box good"><h2><i style="background:var(--good)"></i>จุดเด่น</h2><ul>
      ${good.length?good.map(x=>`<li><b>${x.n}</b> ขยายตัว ${sg(x.v)}% จากปีก่อน</li>`).join(''):'<li>ไม่มีตัวชี้วัดที่ขยายตัวในเดือนนี้</li>'}</ul></div>
    <div class="box bad"><h2><i style="background:var(--bad)"></i>จุดเฝ้าระวัง</h2><ul>
      ${bad.length?bad.map(x=>x.slow?`<li><b>${x.n}</b> ชะลอลง ${sg(x.d)} จุดจากเดือนก่อน</li>`:`<li><b>${x.n}</b> หดตัว ${sg(x.v)}% จากปีก่อน</li>`).join(''):'<li>ไม่มีตัวชี้วัดที่หดตัวในเดือนนี้</li>'}</ul></div>
  </div>

  ${ask.length?`<div class="ask"><h2><i></i>ประเด็นที่ควรเตรียมคำตอบ</h2><ol>${ask.map(a=>`<li>${a}</li>`).join('')}</ol>
    <div class="note">ระบบคัดจากตัวเลขที่เปลี่ยนแปลงผิดปกติเท่านั้น ไม่ได้ระบุสาเหตุ · ให้หน่วยงานที่รับผิดชอบชี้แจงประกอบ</div></div>`:''}

  <div class="foot">
    <div class="src"><b>ที่มา</b> เครื่องชี้เศรษฐกิจรายเดือน: สำนักงานคลังจังหวัดหนองบัวลำภู ·
      การเบิกจ่ายงบประมาณ: รายงานผลการเบิกจ่าย สำนักงานคลังจังหวัด ข้อมูล ณ ${CFG.asof} ·
      GPP: สำนักงานสภาพัฒนาการเศรษฐกิจและสังคมแห่งชาติ ฉบับ พ.ศ. 2567<br>
      ตัวเลขเทียบปีก่อนของดัชนีรายเดือนเป็นอัตราที่ต้นทางรายงาน · "จุด" คือผลต่างของอัตราระหว่างเดือน ไม่ใช่การเติบโตรายเดือน<br>
      จัดทำโดย สำนักงานสถิติจังหวัดหนองบัวลำภู</div>
    <div class="qr"><div id="qrSlot"></div>สแกนเปิดแดชบอร์ด</div>
  </div>`;

  qrSvg(qrUrl,4).then(svg=>{document.getElementById('qrSlot').innerHTML=svg}).catch(()=>{
    document.getElementById('qrSlot').innerHTML='<div style="font-size:8px;word-break:break-all">'+qrUrl+'</div>'});
  URLST.set({m:BR_I===BR_MAC.length-1?null:cur.y+'-'+String(cur.m).padStart(2,'0')});
  document.title='สรุปผู้บริหาร '+THF[cur.m-1]+' '+cur.y+' · ศูนย์บัญชาการข้อมูลเศรษฐกิจ จังหวัดหนองบัวลำภู';
}

/* เลือกเดือน · เรียงตามปีงบประมาณจากล่าสุด */
const sel=document.getElementById('selM');
sel.innerHTML=BR_MAC.map((r,i)=>({r,i})).reverse().map(({r,i})=>
  `<option value="${i}"${i===BR_I?' selected':''}>${THF[r.m-1]} ${r.y} · ปีงบ ${r.m>=10?r.y+1:r.y}</option>`).join('');
sel.addEventListener('change',()=>{BR_I=+sel.value;render()});
document.getElementById('btnP').addEventListener('click',()=>window.print());
render();
</script>
</body>
</html>
